<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>아이템 관리 - 혈맹 보스탐 체크기</title>
    <link rel="stylesheet" href="{{ asset('common.css') }}">
    <link rel="stylesheet" href="{{ asset('item_manage.css') }}">
</head>
<body>
    <nav class="navbar" id="appNavbar"></nav>

    <main class="main-container">
        <div class="top-bar">
            <h1 class="page-title">🧰 혈맹 아이템 내판가 및 혈비제외가 목록</h1>
            <span id="itemCountBadge" class="count-label">총 0개</span>
        </div>

        <!-- 1. 혈비(%) 공제율 설정 (관리자 모드 ON) -->
        <section class="card-box admin-block">
            <div class="tax-config-row">
                <div>
                    <span class="section-label">⚖️ 혈맹 혈비 공제율(%) 설정 (관리자 전용)</span>
                    <p class="item-guide-text no-margin">
                        일별현황, 분배금관리, 내참여내역 및 아래 혈비제외가 계산에 이 공제율이 동일하게 적용됩니다.
                    </p>
                </div>
                <div class="tax-input-group">
                    <input type="number" id="clanTaxRateInput" class="input-common tax-rate-input" value="20" min="0" max="100" step="1">
                    <span class="c-white">%</span>
                    <button type="button" class="btn-sm btn-sm-green" onclick="saveGlobalTaxRate()">혈비율 저장</button>
                </div>
            </div>
        </section>

        <!-- 2. 아이템 추가 (관리자 모드 ON) -->
        <section class="card-box admin-block">
            <span class="section-label">➕ 아이템 및 내판가 추가 (관리자 전용)</span>
            <p class="item-guide-text">
                보스탐 드랍 아이템 입력 시 이 목록의 <b>아이템명·별칭·내판가</b>가 자동으로 매칭됩니다.
            </p>
            <div class="item-form-grid">
                <input type="text" id="newItemName" class="input-common" placeholder="아이템명 (예: 발터모)">
                <input type="text" id="newItemAliases" class="input-common" placeholder="별칭 (예: 발터, 발라카스투구)">
                <input type="number" id="newItemPrice" class="input-common" placeholder="내판가 (예: 40000)" min="0">
                <button type="button" class="btn-sm btn-sm-blue item-add-btn" onclick="addItem()">+ 추가</button>
            </div>
            <div class="item-kind-row">
                <label for="newItemKind">구분</label>
                <select id="newItemKind" class="input-common item-kind-select">
                    <option value="normal">일반 아이템</option>
                    <option value="clan">혈비귀속 (판매금 혈비 귀속 · 분배금 제외템)</option>
                    <option value="event">이벤트템 (분배금 0원)</option>
                </select>
            </div>
        </section>

        <!-- 3. 등록된 아이템 목록 (일반회원/관리자 모두 조회 가능) -->
        <section class="card-box">
            <div class="section-head">
                <span class="section-label">📋 등록된 아이템 (<span id="taxRateLabelText" class="c-money">혈비 20% 제외 기준</span>)</span>
                <input type="search" id="itemSearch" class="input-common item-search" placeholder="아이템명 검색" oninput="renderItems()">
            </div>

            <div class="tbl-wrap">
                <table class="tbl item-master-table">
                    <thead>
                        <tr>
                            <th>아이템명 (풀네임)</th>
                            <th>별칭</th>
                            <th>내판가</th>
                            <th>혈비제외가</th>
                            <th>구분</th>
                            <th class="admin-cell">관리</th>
                        </tr>
                    </thead>
                    <tbody id="itemTableBody">
                        <tr><td colspan="6" class="empty-party-msg">불러오는 중...</td></tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="{{ asset('common.js') }}"></script>
    <script src="{{ asset('item_manage.js') }}"></script>
</body>
</html>
