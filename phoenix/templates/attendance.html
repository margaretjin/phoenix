<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>참여도 현황 - 혈맹 보스탐 체크기</title>
    <link rel="stylesheet" href="{{ asset('common.css') }}">
    <link rel="stylesheet" href="{{ asset('attendance.css') }}">
</head>
<body>
    <nav class="navbar" id="appNavbar"></nav>

    <main class="main-container">
        <div class="top-bar">
            <h1 class="page-title">📊 전체 혈원 보스탐 참여도 현황</h1>
            <span id="memberCountLabel" class="count-label">전체 0명</span>
        </div>

        <!-- 1. 기준 월 선택 및 검색 필터 -->
        <section class="card-box">
            <div class="filter-grid att-filter-grid">
                <div class="filter-field">
                    <label>조회 기준 월 (월별 집계)</label>
                    <input type="month" id="attMonthInput" class="input-common" onchange="loadMonthRaidsData()">
                </div>

                <div class="filter-field">
                    <label>클래스 필터</label>
                    <select id="attClassFilter" class="input-common" onchange="renderAttendanceTable()">
                        <option value="all">전체 클래스</option>
                        <option value="기사">기사</option>
                        <option value="요정">요정</option>
                        <option value="법사">법사</option>
                        <option value="군주">군주</option>
                        <option value="다크엘프">다크엘프</option>
                    </select>
                </div>

                <div class="filter-field full-mobile">
                    <label>혈원 검색 (본캐릭 / 보조캐릭)</label>
                    <input type="search" id="attMemberSearch" class="input-common" placeholder="캐릭터명 검색" oninput="renderAttendanceTable()">
                </div>
            </div>

            <!-- 상단 요약 KPI 3칸 -->
            <div class="att-kpi-grid">
                <div class="kpi-box">
                    <div class="kpi-label">전체 등록 혈원</div>
                    <div id="kpiTotalMembers" class="kpi-val">0명</div>
                </div>
                <div class="kpi-box">
                    <div class="kpi-label">해당 월 진행된 보스탐</div>
                    <div id="kpiMonthRaids" class="kpi-val">총 0회</div>
                </div>
                <div class="kpi-box">
                    <div class="kpi-label">해당 월 메인보스탐</div>
                    <div id="kpiMonthMainRaids" class="kpi-val main-highlight">총 0회</div>
                </div>
            </div>
        </section>

        <!-- 2. 전체 혈원 참여도 표 -->
        <section class="card-box">
            <div class="section-head">
                <span class="section-label" id="attSectionTitle">🏆 전체 혈원 월별 참여 횟수 및 누적분배금</span>
                <div id="attSortTabs" class="tab-bar">
                    <button type="button" data-tab="monthTotal" class="tab-btn active" onclick="setSortMode('monthTotal')">월 전체순</button>
                    <button type="button" data-tab="totalShare" id="sortBtnTotalShare" class="tab-btn" onclick="setSortMode('totalShare')">누적분배금순</button>
                    <button type="button" data-tab="monthMain" class="tab-btn" onclick="setSortMode('monthMain')">월별 메인탐순</button>
                    <button type="button" data-tab="09시" class="tab-btn" onclick="setSortMode('09시')">월별 09시</button>
                    <button type="button" data-tab="15시" class="tab-btn" onclick="setSortMode('15시')">월별 15시</button>
                    <button type="button" data-tab="21시" class="tab-btn" onclick="setSortMode('21시')">월별 21시</button>
                    <button type="button" data-tab="23시(오만)" class="tab-btn" onclick="setSortMode('23시(오만)')">월별 23시(오만)</button>
                    <button type="button" data-tab="03시" class="tab-btn" onclick="setSortMode('03시')">월별 03시</button>
                </div>
            </div>

            <div class="tbl-wrap">
                <table class="tbl att-table">
                    <thead>
                        <tr>
                            <th>순위</th>
                            <th>혈원명</th>
                            <th>클래스</th>
                            <th>월 전체<br>참여</th>
                            <th id="thMonthlyShare" class="share-th">누적분배금</th>
                            <th class="main-white-th">월별 메인보스탐</th>
                            <th class="slot-class-th">월별 09시</th>
                            <th class="slot-class-th">월별 15시</th>
                            <th class="slot-class-th">월별 21시</th>
                            <th class="slot-class-th">월별 23시(오만)</th>
                            <th class="slot-class-th">월별 03시</th>
                        </tr>
                    </thead>
                    <tbody id="attendanceTableBody">
                        <tr><td colspan="11" class="empty-party-msg">조회 중...</td></tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="{{ asset('common.js') }}"></script>
    <script src="{{ asset('attendance.js') }}"></script>
</body>
</html>
