<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>일별 기록 현황 - 혈맹 보스탐 체크기</title>
    <link rel="stylesheet" href="{{ asset('common.css') }}">
    <link rel="stylesheet" href="{{ asset('raid_status.css') }}">
</head>
<body>
    <nav class="navbar" id="appNavbar"></nav>

    <main class="main-container">
        <!-- 상단 타이틀 & 관리자 모드 전용 엑셀 다운로드 버튼 -->
        <div class="top-bar">
            <h1 class="page-title">📅 일별 기록 현황</h1>
            <div class="excel-btn-group admin-only">
                <button type="button" class="btn-excel-sm" onclick="downloadExcelRange('day')">📥 일별</button>
                <button type="button" class="btn-excel-sm" onclick="downloadExcelRange('week')">주별</button>
                <button type="button" class="btn-excel-sm" onclick="downloadExcelRange('month')">월별</button>
            </div>
        </div>

        <!-- 1. 날짜 선택 및 일별 요약 카드 -->
        <section class="card-box">
            <div class="status-date-row">
                <div id="displaySelectedDate" class="status-selected-date">00-00-00 일 00시</div>
                <div class="status-date-controls">
                    <button type="button" class="btn-day-move" onclick="moveDay(-1)">◀ 전날</button>
                    <button type="button" class="btn-day-move today" onclick="setToday()">오늘</button>
                    <button type="button" class="btn-day-move" onclick="moveDay(1)">다음날 ▶</button>
                    <input type="date" id="statusDatePicker" class="date-picker-input" onchange="onDateInputChange()">
                </div>
            </div>

            <div class="day-summary-strip">
                <div class="kpi-box summary-mini-box">
                    <div class="kpi-label">드랍 아이템</div>
                    <div id="sumDropCount" class="kpi-val">0개</div>
                </div>
                <div class="kpi-box summary-mini-box summary-items-box">
                    <div class="kpi-label">이날 나온 아이템</div>
                    <div id="sumDropList" class="summary-drop-list"><span class="summary-none">없음</span></div>
                </div>
            </div>

            <!-- 고정 보스탐 시간 선택 그리드 -->
            <div id="statusTimeGrid" class="common-time-grid"></div>
        </section>

        <!-- 선택된 보스탐 상세: 왼쪽 드랍 아이템 / 오른쪽 파티원 -->
        <div class="raid-detail-columns">
            <!-- 왼쪽: 드랍 아이템 -->
            <section class="card-box raid-detail-items">
                <div class="item-section-header">
                    <span class="section-label">
                        🎁 드랍 아이템 내역
                        <span class="slot-gray-note">(실제 판매가는 변경될수있습니다)</span>
                    </span>
                    <span id="slotItemTotalBadge" class="slot-green-meta">총 0 (단위:아데나)</span>
                </div>

                <div id="slotItemList" class="item-list-wrap">
                    <div class="empty-party-msg">드랍된 아이템이 없습니다.</div>
                </div>

                <!-- 관리자 모드에서만 보이는 하단 아이템 추가 -->
                <div class="admin-item-add-row admin-block">
                    <input type="text" id="newDropItemName" class="input-common" placeholder="아이템명 (띄어쓰기로 여러 개)">
                    <button type="button" class="btn-sm btn-sm-blue" onclick="addDropItemRow()">+ 아이템 추가</button>
                </div>
            </section>

            <!-- 오른쪽: 파티원 명단 + 혈비 제외 분배금 -->
            <section class="card-box raid-detail-parties">
                <div class="item-section-header">
                    <span id="slotParticipantCount" class="section-label">총 0파티 (0명)</span>
                    <div class="header-right-group">
                        <span class="slot-gray-note"><span id="taxLabel">혈비 20%</span> 제외 분배 <br> (실제 분배금은 변경될수있습니다)</span>
                        <button type="button" class="btn-sm btn-sm-red btn-tiny admin-only" onclick="deleteEntireRaidSlot()">전체삭제</button>
                    </div>
                </div>

                <div id="slotPartyList" class="party-list-stack">
                    <div class="empty-party-msg">해당 보스탐에 등록된 파티 기록이 없습니다.</div>
                </div>

                <!-- 관리자 모드에서만 보이는 하단 파티원 추가 -->
                <div class="admin-party-add admin-block">
                    <select id="addPartyTarget" class="input-common"></select>
                    <input type="text" id="addMemberInput" class="input-common" placeholder="아이디 (띄어쓰기로 여러 명)">
                    <button type="button" class="btn-sm btn-sm-blue" onclick="addPartyMembers()">+ 파티원 추가</button>
                </div>
            </section>
        </div>
    </main>

    <script src="{{ asset('common.js') }}"></script>
    <script src="{{ asset('raid_status.js') }}"></script>
</body>
</html>
