<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>일별기록현황 - 혈맹 보스탐 체크기</title>
    <link rel="stylesheet" href="/static/style.css?v=7">
</head>
<body>
    <nav class="navbar" id="appNavbar"></nav>

    <main class="container">
        <!-- 1. 월 선택 + 혈비 공제율 + 엑셀 다운로드 + 달력 -->
        <div class="card">
            <div class="week-selector-row">
                <input type="month" id="statusMonth" onchange="onMonthChange()" style="width: auto; font-weight: 700;">

                <div class="tax-setting-box">
                    <span>💰 혈비: <b id="taxRateDisplay" style="color: var(--accent-gold);">20%</b></span>
                    <span id="superAdminTaxEditor" class="hidden" style="display: inline-flex; align-items: center; gap: 0.25rem;">
                        <input type="number" id="taxRateInput" min="0" max="100" style="width: 55px; padding: 0.15rem 0.3rem; font-size: 0.78rem;">%
                        <button class="btn btn-green" style="padding: 0.15rem 0.45rem; font-size: 0.74rem;" onclick="saveTaxRate()">저장</button>
                    </span>
                </div>

                <div style="margin-left: auto; display: flex; align-items: center; gap: 0.4rem; flex-wrap: wrap;">
                    <button class="btn btn-blue" style="padding: 0.32rem 0.65rem; font-size: 0.78rem;" onclick="ClanApp.downloadExcel({ date: selectedDateStr })">📥 선택일 엑셀</button>
                    <button class="btn btn-dark" style="padding: 0.32rem 0.65rem; font-size: 0.78rem;" onclick="ClanApp.downloadExcel({ month: document.getElementById('statusMonth').value })">📥 월 전체 엑셀</button>
                    <button id="toggleCalendarBtn" class="btn btn-dark" style="padding: 0.32rem 0.65rem; font-size: 0.78rem;" onclick="toggleCalendarSection()">달력 닫기 ▲</button>
                </div>
            </div>

            <div id="calendarCollapsibleArea" style="margin-top: 0.8rem;">
                <div class="calendar-header-row">
                    <div class="sun">일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div class="sat">토</div>
                </div>
                <div id="fullCalendarGrid" class="full-calendar-grid"></div>
            </div>
        </div>

        <!-- 2. 해당 일자 총 득템 요약 -->
        <div class="card">
            <div class="summary-toggle-header" onclick="toggleDailyDropSummary()">
                <span style="font-weight: 800; color: var(--accent-gold); font-size: 0.95rem;">
                    🎁 [<span id="selectedDateLabel">-</span>] 총 득템 현황 (<span id="dailyDropCount">0</span>건)
                </span>
                <button id="toggleSummaryBtn" class="btn btn-dark" style="padding: 0.25rem 0.6rem; font-size: 0.76rem;">펼치기 ▼</button>
            </div>
            <div id="dailyDropSummaryBody" class="hidden" style="margin-top: 0.75rem; padding-top: 0.75rem; border-top: 1px solid var(--border-color); font-size: 0.88rem; line-height: 1.7;"></div>
        </div>

        <!-- 3. 16타임 원형 그리드 & 아이템 가격/당첨자/분배일자 설정 -->
        <div class="card">
            <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.4rem;">
                <h3 class="section-title" style="margin-bottom: 0; font-size: 1rem;">⏱️ 보스탐 시간별 상세 및 정산</h3>
                <button id="statusDeleteRaidBtn" class="btn btn-red hidden" style="padding: 0.28rem 0.65rem; font-size: 0.76rem;" onclick="deleteCurrentTimeRaid()">🗑️ 이 시간 기록 삭제</button>
            </div>

            <div id="circleTimeGrid" class="circle-time-grid"></div>

            <!-- 관리자 일괄 아이템 텍스트 입력 -->
            <div id="statusAdminItemBar" class="hidden" style="margin-bottom: 0.9rem; padding: 0.65rem; background: rgba(245, 158, 11, 0.12); border: 1px solid var(--accent-gold); border-radius: 8px; display: flex; gap: 0.4rem; align-items: center; flex-wrap: wrap;">
                <span style="color: var(--accent-gold); font-weight: 700; font-size: 0.82rem;">👑 득템 일괄 입력:</span>
                <input type="text" id="statusDroppedItemsInput" placeholder="예: 축젤 발터모 (띄어쓰기로 입력)" style="flex: 1; min-width: 160px;">
                <button class="btn btn-green" style="padding: 0.35rem 0.7rem; font-size: 0.8rem;" onclick="saveDroppedItemsFromStatus()">저장</button>
            </div>

            <div class="raid-detail-two-col">
                <!-- 왼쪽: 득템 아이템 가격 / 당첨자 / 분배일자 -->
                <div class="detail-col-box">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem; border-bottom: 1px solid var(--border-color); padding-bottom: 0.35rem;">
                        <span style="font-weight: 800; color: var(--accent-gold);">💎 득템 아이템 (<span id="detailSelectedTimeLabel">-</span>)</span>
                        <button id="btnShowAddSingleItem" class="btn btn-green hidden" style="padding: 0.2rem 0.5rem; font-size: 0.74rem;" onclick="document.getElementById('addSingleItemBox').classList.toggle('hidden')">+ 아이템 추가</button>
                    </div>

                    <div id="addSingleItemBox" class="inline-add-box hidden">
                        <div style="display: flex; gap: 0.35rem; flex-wrap: wrap;">
                            <input type="text" id="newSingleItemName" placeholder="아이템명" style="flex: 1; min-width: 90px;">
                            <input type="number" id="newSingleItemPrice" placeholder="가격(아데나)" style="width: 110px;">
                            <button class="btn btn-green" onclick="addSingleItemToRaid()">추가</button>
                        </div>
                    </div>

                    <div id="detailPoolSummaryBox" class="pool-summary-box hidden">
                        <div>• 총 판매액: <b id="totalGrossAdena" style="color: var(--accent-gold);">0 아데나</b></div>
                        <div>• 혈비(<span id="appliedTaxRateLabel">20</span>%) 제외 분배풀: <b id="totalNetAdena" style="color: #34d399;">0 아데나</b></div>
                    </div>

                    <div id="detailItemsArea"></div>
                </div>

                <!-- 오른쪽: 참여 혈맹원 및 개별 분배금 -->
                <div class="detail-col-box">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem; border-bottom: 1px solid var(--border-color); padding-bottom: 0.35rem;">
                        <span style="font-weight: 800; color: #a7f3d0;">👥 참여 인원 (<span id="detailMemberCount">0</span>명)</span>
                        <div style="display: flex; align-items: center; gap: 0.35rem;">
                            <span id="detailPerPersonBadge" style="font-size: 0.78rem; color: var(--accent-gold); font-weight: 800;"></span>
                            <button id="btnShowAddMember" class="btn btn-green hidden" style="padding: 0.2rem 0.5rem; font-size: 0.74rem;" onclick="document.getElementById('addMemberBox').classList.toggle('hidden')">+ 인원 추가</button>
                        </div>
                    </div>

                    <div id="addMemberBox" class="inline-add-box hidden">
                        <div style="display: flex; gap: 0.35rem;">
                            <input type="text" id="addMemberSearchInput" placeholder="혈맹원 아이디 검색" oninput="filterAddMemberCandidates()" style="flex: 1;">
                            <button class="btn btn-green" onclick="addSelectedMemberToRaid()">추가</button>
                        </div>
                        <div id="addMemberCandidates" class="winner-search-chips"></div>
                    </div>

                    <div id="detailMembersArea"></div>
                </div>
            </div>
        </div>
    </main>

    <script src="/static/common.js?v=7"></script>
    <script>
        let currentTaxRate = 20;
        let raidTimes = [];
        let allMembers = [];
        let selectedDateStr = "";
        let selectedTime = "09시";
        let monthRaidsData = [];
        let dayRaidsData = [];
        let activeItemDetails = [];

        window.onload = async () => {
            const user = ClanApp.initPage('/raid-status', () => {
                applyAdminUI();
                renderSelectedTimeDetail();
            });
            if (!user) return;

            const [timeRes, taxRes, memRes] = await Promise.all([
                fetch('/api/raids/times'),
                fetch('/api/raids/tax-rate'),
                fetch('/api/auth/search-members')
            ]);
            raidTimes = (await timeRes.json()).times;
            currentTaxRate = (await taxRes.json()).tax_rate ?? 20;
            allMembers = await memRes.json();

            document.getElementById('taxRateDisplay').textContent = `${currentTaxRate}%`;
            document.getElementById('taxRateInput').value = currentTaxRate;

            const now = new Date();
            document.getElementById('statusMonth').value = ClanApp.formatYM(now);
            selectedDateStr = ClanApp.formatYMD(now);

            applyAdminUI();
            await refreshMonthAndDay();
        };

        function applyAdminUI() {
            const isOn = ClanApp.isAdminModeOn;
            document.getElementById('statusAdminItemBar').classList.toggle('hidden', !isOn);
            document.getElementById('btnShowAddSingleItem').classList.toggle('hidden', !isOn);
            document.getElementById('btnShowAddMember').classList.toggle('hidden', !isOn);
            document.getElementById('superAdminTaxEditor').classList.toggle('hidden', !(isOn && ClanApp.isSuperAdmin));
        }

        function toggleCalendarSection() {
            const area = document.getElementById('calendarCollapsibleArea');
            const hidden = area.classList.toggle('hidden');
            document.getElementById('toggleCalendarBtn').textContent = hidden ? '달력 펼치기 ▼' : '달력 닫기 ▲';
        }

        function toggleDailyDropSummary() {
            const body = document.getElementById('dailyDropSummaryBody');
            const hidden = body.classList.toggle('hidden');
            document.getElementById('toggleSummaryBtn').textContent = hidden ? '펼치기 ▼' : '감추기 ▲';
        }

        async function saveTaxRate() {
            const val = parseFloat(document.getElementById('taxRateInput').value);
            if (isNaN(val) || val < 0 || val > 100) return alert('0~100 사이 숫자를 입력하세요.');
            const res = await fetch('/api/raids/tax-rate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ tax_rate: val, requester_role: ClanApp.role })
            });
            if (res.ok) {
                currentTaxRate = val;
                document.getElementById('taxRateDisplay').textContent = `${val}%`;
                alert('혈비 공제율이 저장되었습니다.');
                renderDailyDropSummary();
                renderSelectedTimeDetail();
            }
        }

        async function onMonthChange() {
            const val = document.getElementById('statusMonth').value;
            if (!val) return;
            selectedDateStr = `${val}-01`;
            await refreshMonthAndDay();
        }

        async function refreshMonthAndDay() {
            const monthVal = document.getElementById('statusMonth').value;
            const res = await fetch(`/api/raids?month=${monthVal}`);
            monthRaidsData = await res.json();
            renderCalendar();
            dayRaidsData = monthRaidsData.filter(r => r.raid_date === selectedDateStr);
            renderDailyDropSummary();
            renderCircleTimeGrid();
            renderSelectedTimeDetail();
        }

        function renderCalendar() {
            document.getElementById('selectedDateLabel').textContent = selectedDateStr;
            const [year, monthNum] = document.getElementById('statusMonth').value.split('-').map(Number);
            const firstDay = new Date(year, monthNum - 1, 1);
            const lastDay = new Date(year, monthNum, 0);
            const startSunday = new Date(firstDay);
            startSunday.setDate(firstDay.getDate() - firstDay.getDay());

            const datesWithRecords = new Set(
                monthRaidsData.filter(r => (r.parties && r.parties.length > 0) || (r.dropped_items && r.dropped_items.trim())).map(r => r.raid_date)
            );

            const grid = document.getElementById('fullCalendarGrid');
            grid.innerHTML = '';
            let cursor = new Date(startSunday);
            while (cursor <= lastDay || cursor.getDay() !== 0) {
                const ymd = ClanApp.formatYMD(cursor);
                const isCur = cursor.getMonth() === (monthNum - 1);
                const cell = document.createElement('div');
                cell.className = `cal-day-cell ${cursor.getDay() === 0 ? 'sun' : ''} ${cursor.getDay() === 6 ? 'sat' : ''} ${!isCur ? 'other-month' : ''} ${ymd === selectedDateStr ? 'selected' : ''}`;
                cell.innerHTML = `<span>${cursor.getDate()}</span>${datesWithRecords.has(ymd) ? '<span class="cal-day-dot"></span>' : ''}`;
                cell.onclick = () => {
                    selectedDateStr = ymd;
                    if (!isCur) {
                        document.getElementById('statusMonth').value = ymd.slice(0, 7);
                        refreshMonthAndDay();
                    } else {
                        renderCalendar();
                        dayRaidsData = monthRaidsData.filter(r => r.raid_date === selectedDateStr);
                        renderDailyDropSummary();
                        renderCircleTimeGrid();
                        renderSelectedTimeDetail();
                    }
                };
                grid.appendChild(cell);
                cursor.setDate(cursor.getDate() + 1);
                if (cursor > lastDay && cursor.getDay() === 0) break;
            }
        }

        function renderDailyDropSummary() {
            const entries = [];
            let gross = 0;
            dayRaidsData.forEach(r => {
                ClanApp.extractItemDetails(r).forEach(d => {
                    gross += (d.price || 0);
                    entries.push(`<div>• <b style="color:var(--accent-gold);">[${r.raid_time}]</b> ${d.name} ${d.price > 0 ? `<b style="color:var(--accent-gold);">${d.price.toLocaleString()}</b>` : ''} ${d.winner ? `<span style="color:#a7f3d0;">(${d.winner})</span>` : ''} ${d.dist_date ? `<small style="color:#93c5fd;">[분배일:${d.dist_date}]</small>` : ''}</div>`);
                });
            });
            document.getElementById('dailyDropCount').textContent = entries.length;
            const body = document.getElementById('dailyDropSummaryBody');
            if (entries.length === 0) {
                body.innerHTML = `<span style="color:var(--text-muted);">득템 내역이 없습니다.</span>`;
            } else {
                const net = Math.floor(gross * (1 - currentTaxRate / 100));
                body.innerHTML = `<div style="margin-bottom:0.4rem;">총액: <b style="color:var(--accent-gold);">${gross.toLocaleString()}</b> | 혈비제외: <b style="color:#34d399;">${net.toLocaleString()} 아데나</b></div>` + entries.join('');
            }
        }

        function renderCircleTimeGrid() {
            const grid = document.getElementById('circleTimeGrid');
            grid.innerHTML = '';
            raidTimes.forEach(t => {
                const rec = dayRaidsData.find(r => r.raid_time === t);
                const hasParties = rec && rec.parties && rec.parties.length > 0;
                const hasDrop = ClanApp.extractItemDetails(rec).length > 0;
                const div = document.createElement('div');
                div.className = `time-circle ${hasParties || hasDrop ? 'has-record' : ''} ${hasDrop ? 'has-drop' : ''} ${t === selectedTime ? 'selected' : ''}`;
                div.innerHTML = t.replace('(', '<br>(');
                div.onclick = () => { selectedTime = t; renderCircleTimeGrid(); renderSelectedTimeDetail(); };
                grid.appendChild(div);
            });
        }

        function renderSelectedTimeDetail() {
            document.getElementById('detailSelectedTimeLabel').textContent = selectedTime;
            const record = dayRaidsData.find(r => r.raid_time === selectedTime);
            const itemsArea = document.getElementById('detailItemsArea');
            const membersArea = document.getElementById('detailMembersArea');
            const poolBox = document.getElementById('detailPoolSummaryBox');

            if (!record) {
                document.getElementById('statusDeleteRaidBtn').classList.add('hidden');
                poolBox.classList.add('hidden');
                document.getElementById('statusDroppedItemsInput').value = '';
                document.getElementById('detailMemberCount').textContent = '0';
                document.getElementById('detailPerPersonBadge').textContent = '';
                itemsArea.innerHTML = `<span style="color:var(--text-muted);">득템 내역이 없습니다.</span>`;
                membersArea.innerHTML = `<span style="color:var(--text-muted);">참여 기록이 없습니다.</span>`;
                return;
            }

            document.getElementById('statusDeleteRaidBtn').classList.toggle('hidden', !ClanApp.isAdminModeOn);
            activeItemDetails = ClanApp.extractItemDetails(record);
            document.getElementById('statusDroppedItemsInput').value = activeItemDetails.map(d => d.name).join(' ');

            const gross = activeItemDetails.reduce((a, c) => a + (Number(c.price) || 0), 0);
            const net = Math.floor(gross * (1 - currentTaxRate / 100));

            if (activeItemDetails.length > 0) {
                poolBox.classList.remove('hidden');
                document.getElementById('totalGrossAdena').textContent = `${gross.toLocaleString()} 아데나`;
                document.getElementById('appliedTaxRateLabel').textContent = currentTaxRate;
                document.getElementById('totalNetAdena').textContent = `${net.toLocaleString()} 아데나`;
            } else {
                poolBox.classList.add('hidden');
            }

            const participants = ClanApp.extractParticipants(record);
            document.getElementById('detailMemberCount').textContent = participants.length;
            const perShare = (participants.length > 0 && net > 0) ? Math.floor(net / participants.length) : 0;
            document.getElementById('detailPerPersonBadge').textContent = perShare > 0 ? `1인당 ${perShare.toLocaleString()} 아데나` : '';

            if (activeItemDetails.length === 0) {
                itemsArea.innerHTML = `<span style="color:var(--text-muted);">득템 내역이 없습니다.</span>`;
            } else {
                itemsArea.innerHTML = activeItemDetails.map((item, idx) => {
                    const priceStr = item.price > 0 ? `${item.price.toLocaleString()} 아데나` : '가격 미입력';
                    const subDates = [
                        item.taken_date ? `구매/수령일: ${item.taken_date}` : '',
                        item.dist_date ? `분배일자: ${item.dist_date}` : ''
                    ].filter(Boolean).join(' | ');

                    if (!ClanApp.isAdminModeOn) {
                        return `<div class="item-detail-card">
                            <div class="item-view-main-line">
                                <span class="item-view-name">${item.name}</span>
                                <span class="item-view-price">${priceStr}</span>
                                <span class="item-view-winner">${item.winner || ''}</span>
                            </div>
                            ${subDates ? `<div class="item-taken-date-sub">↳ ${subDates}</div>` : ''}
                        </div>`;
                    }

                    return `<div class="item-detail-card">
                        <div class="item-view-main-line">
                            <span class="item-view-name">${item.name}</span>
                            <span class="item-view-price">${priceStr}</span>
                            <span class="item-view-winner">${item.winner || ''}</span>
                        </div>
                        <div style="display:flex; gap:0.3rem; flex-wrap:wrap; margin-top:0.4rem; align-items:center;">
                            <input type="number" id="itemPrice_${idx}" value="${item.price || ''}" placeholder="판매가격" style="width:105px; padding:0.25rem 0.4rem; font-size:0.8rem;">
                            <input type="text" id="winnerSearch_${idx}" value="${item.winner || ''}" placeholder="구매자/당첨자" oninput="filterWinnerCandidates(${idx})" style="width:100px; padding:0.25rem 0.4rem; font-size:0.8rem;">
                            <button class="btn btn-red" style="padding:0.22rem 0.45rem; font-size:0.74rem;" onclick="deleteSingleItem(${record.id}, ${idx})">삭제</button>
                        </div>
                        <div id="winnerCandidates_${idx}" class="winner-search-chips"></div>
                        <div style="display:flex; gap:0.35rem; flex-wrap:wrap; margin-top:0.35rem; align-items:center; font-size:0.76rem; color:var(--text-muted);">
                            <span>수령일:</span>
                            <input type="date" id="takenDate_${idx}" value="${item.taken_date || ''}" style="width:125px; padding:0.2rem; font-size:0.75rem;">
                            <span>분배일:</span>
                            <input type="date" id="distDate_${idx}" value="${item.dist_date || ''}" style="width:125px; padding:0.2rem; font-size:0.75rem;">
                            <button class="btn btn-green" style="padding:0.25rem 0.6rem; font-size:0.76rem;" onclick="saveItemFullDetail(${record.id}, ${idx})">💾 저장</button>
                        </div>
                    </div>`;
                }).join('');
            }

            const distMap = record.distributions || {};
            membersArea.innerHTML = participants.length === 0
                ? `<span style="color:var(--text-muted);">참여 인원이 없습니다.</span>`
                : participants.map(m => {
                    const dInfo = distMap[m.id] || {};
                    const isPaid = dInfo.status === '분배완료';
                    const paidBadge = isPaid
                        ? `<span class="status-badge badge-done" style="margin-left:0.3rem;">분배완료(${dInfo.method || '본인수령'})</span>`
                        : '';
                    const delBtn = ClanApp.isAdminModeOn
                        ? `<button class="btn btn-red" style="padding:0.15rem 0.4rem; font-size:0.7rem;" onclick="removeMemberFromRaid('${m.id}')">삭제</button>`
                        : '';
                    return `<div class="member-share-row">
                        <span><b style="color:${m.isLeader ? '#a7f3d0' : 'var(--text-light)'};">${m.id}</b>${paidBadge}</span>
                        <div style="display:flex; align-items:center; gap:0.35rem;">
                            <span class="member-share-badge">${perShare > 0 ? perShare.toLocaleString() + ' 아데나' : '-'}</span>
                            ${delBtn}
                        </div>
                    </div>`;
                }).join('');
        }

        function filterWinnerCandidates(idx) {
            const val = document.getElementById(`winnerSearch_${idx}`).value.trim();
            const box = document.getElementById(`winnerCandidates_${idx}`);
            box.innerHTML = '';
            if (!val) return;

            const ext = document.createElement('span');
            ext.className = 'winner-chip';
            ext.style.background = '#1d4ed8';
            ext.textContent = '🌐 외판';
            ext.onclick = () => {
                document.getElementById(`winnerSearch_${idx}`).value = '외판';
                if (!document.getElementById(`takenDate_${idx}`).value) document.getElementById(`takenDate_${idx}`).value = ClanApp.formatYMD();
                box.innerHTML = '';
            };
            box.appendChild(ext);

            allMembers.filter(m => m.active_id.includes(val)).slice(0, 6).forEach(m => {
                const c = document.createElement('span');
                c.className = 'winner-chip';
                c.textContent = m.active_id;
                c.onclick = () => {
                    document.getElementById(`winnerSearch_${idx}`).value = m.active_id;
                    if (!document.getElementById(`takenDate_${idx}`).value) document.getElementById(`takenDate_${idx}`).value = ClanApp.formatYMD();
                    box.innerHTML = '';
                };
                box.appendChild(c);
            });
        }

        async function saveItemFullDetail(raidId, idx) {
            const price = Number(document.getElementById(`itemPrice_${idx}`).value.trim() || 0);
            const winner = document.getElementById(`winnerSearch_${idx}`).value.trim();
            const taken_date = document.getElementById(`takenDate_${idx}`).value || (winner ? ClanApp.formatYMD() : '');
            const dist_date = document.getElementById(`distDate_${idx}`).value || '';

            activeItemDetails[idx] = {
                ...activeItemDetails[idx],
                price,
                winner,
                taken_date,
                dist_date
            };

            const res = await fetch('/api/raids/item-details', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ raid_id: raidId, item_details: activeItemDetails, requester_role: ClanApp.role })
            });
            if (res.ok) {
                alert(`[${activeItemDetails[idx].name}] 정산 정보가 저장되었습니다.`);
                await refreshMonthAndDay();
            }
        }

        async function deleteSingleItem(raidId, idx) {
            if (!confirm(`[${activeItemDetails[idx].name}] 아이템을 삭제하시겠습니까?`)) return;
            activeItemDetails.splice(idx, 1);
            await fetch('/api/raids/item-details', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ raid_id: raidId, item_details: activeItemDetails, requester_role: ClanApp.role })
            });
            await refreshMonthAndDay();
        }

        async function addSingleItemToRaid() {
            const name = document.getElementById('newSingleItemName').value.trim();
            const price = Number(document.getElementById('newSingleItemPrice').value.trim() || 0);
            if (!name) return alert('아이템명을 입력하세요.');

            const record = dayRaidsData.find(r => r.raid_time === selectedTime);
            const updated = [...activeItemDetails, { name, price, winner: '', taken_date: '', dist_date: '' }];

            if (!record) {
                const cRes = await fetch('/api/raids', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        raid_date: selectedDateStr, raid_time: selectedTime, parties: [],
                        dropped_items: name, requester_role: ClanApp.role, requester_id: ClanApp.user.active_id
                    })
                });
                const created = (await cRes.json()).data;
                await fetch('/api/raids/item-details', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ raid_id: created.id, item_details: updated, requester_role: ClanApp.role })
                });
            } else {
                await fetch('/api/raids/item-details', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ raid_id: record.id, item_details: updated, requester_role: ClanApp.role })
                });
            }
            document.getElementById('newSingleItemName').value = '';
            document.getElementById('newSingleItemPrice').value = '';
            await refreshMonthAndDay();
        }

        async function saveDroppedItemsFromStatus() {
            const dropped_items = document.getElementById('statusDroppedItemsInput').value.trim();
            await fetch('/api/raids', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    raid_date: selectedDateStr, raid_time: selectedTime, parties: [],
                    dropped_items, requester_role: ClanApp.role, requester_id: ClanApp.user.active_id
                })
            });
            alert('아이템 목록이 저장되었습니다.');
            await refreshMonthAndDay();
        }

        function filterAddMemberCandidates() {
            const val = document.getElementById('addMemberSearchInput').value.trim();
            const box = document.getElementById('addMemberCandidates');
            box.innerHTML = '';
            if (!val) return;
            allMembers.filter(m => m.active_id.includes(val)).slice(0, 6).forEach(m => {
                const c = document.createElement('span');
                c.className = 'winner-chip';
                c.textContent = m.active_id;
                c.onclick = () => { document.getElementById('addMemberSearchInput').value = m.active_id; box.innerHTML = ''; };
                box.appendChild(c);
            });
        }

        async function addSelectedMemberToRaid() {
            const memberId = document.getElementById('addMemberSearchInput').value.trim();
            if (!allMembers.find(m => m.active_id === memberId)) return alert('등록된 혈맹원이 아닙니다.');
            const record = dayRaidsData.find(r => r.raid_time === selectedTime);
            const parties = record ? (record.parties || []) : [];
            const payload = parties.length > 0
                ? [{ leader: parties[0].leader, members: Array.from(new Set([parties[0].leader, ...(parties[0].members || []), memberId])) }]
                : [{ leader: memberId, members: [memberId] }];

            await fetch('/api/raids', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    raid_date: selectedDateStr, raid_time: selectedTime, parties: payload,
                    dropped_items: record ? (record.dropped_items || '') : '',
                    requester_role: ClanApp.role, requester_id: ClanApp.user.active_id
                })
            });
            document.getElementById('addMemberSearchInput').value = '';
            await refreshMonthAndDay();
        }

        async function removeMemberFromRaid(memberId) {
            const record = dayRaidsData.find(r => r.raid_time === selectedTime);
            if (!record || !confirm(`[${memberId}] 님을 명단에서 삭제하시겠습니까?`)) return;
            for (const p of (record.parties || [])) {
                const updated = (p.members || []).filter(m => m !== memberId);
                await fetch(`/api/raids/party?date=${selectedDateStr}&time=${encodeURIComponent(selectedTime)}&leader=${encodeURIComponent(p.leader)}&role=${encodeURIComponent(ClanApp.role)}`, { method: 'DELETE' });
                if (updated.length > 0) {
                    await fetch('/api/raids', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            raid_date: selectedDateStr, raid_time: selectedTime,
                            parties: [{ leader: p.leader === memberId ? updated[0] : p.leader, members: updated }],
                            dropped_items: record.dropped_items || '',
                            requester_role: ClanApp.role, requester_id: ClanApp.user.active_id
                        })
                    });
                }
            }
            await refreshMonthAndDay();
        }

        async function deleteCurrentTimeRaid() {
            const record = dayRaidsData.find(r => r.raid_time === selectedTime);
            if (!record || !confirm('이 시간 기록 전체를 삭제하시겠습니까?')) return;
            await fetch(`/api/raids/${record.id}?role=${encodeURIComponent(ClanApp.role)}`, { method: 'DELETE' });
            await refreshMonthAndDay();
        }
    </script>
</body>
</html>
