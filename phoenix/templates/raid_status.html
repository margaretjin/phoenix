<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>일별 기록 현황 - 혈맹 보스탐 체크기</title>
    <link rel="stylesheet" href="/static/common.css?v=53">
    <link rel="stylesheet" href="/static/raid_status.css?v=18">
</head>
<body>
    <nav class="navbar" id="appNavbar"></nav>

    <main class="main-container">
        <!-- 상단 타이틀 & 관리자 모드 전용 엑셀 다운로드 버튼 -->
        <div class="top-bar">
            <h1 class="page-title">📅 일별 기록 현황</h1>
            <div class="excel-btn-group admin-only">
                <button type="button" class="btn-excel-sm" onclick="downloadExcelRange('day')">📥 일별</button>
                <button type="button" class="btn-excel-sm" onclick="downloadExcelRange('week')">주별</button>
                <button type="button" class="btn-excel-sm" onclick="downloadExcelRange('month')">월별</button>
            </div>
        </div>

        <!-- 1. 날짜 선택 및 일별 요약 카드 (8칸 x 2줄 그리드) -->
        <section class="card-box">
            <div class="status-date-row">
                <div id="displaySelectedDate" class="status-selected-date">00-00-00 일 00시</div>
                <div class="status-date-controls">
                    <button type="button" class="btn-day-move" onclick="moveDay(-1)">◀ 전날</button>
                    <button type="button" class="btn-day-move today" onclick="setToday()">오늘</button>
                    <button type="button" class="btn-day-move" onclick="moveDay(1)">다음날 ▶</button>
                    <input type="date" id="statusDatePicker" class="date-picker-input" onchange="onDateInputChange()">
                </div>
            </div>

            <div class="day-summary-strip day-summary-split">
                <div class="summary-mini-box">
                    <div class="summary-mini-label">드랍 아이템</div>
                    <div id="sumDropCount" class="summary-mini-val">0개</div>
                </div>
                <div class="summary-mini-box summary-items-box">
                    <div class="summary-mini-label">이날 나온 아이템</div>
                    <div id="sumDropList" class="summary-drop-list"><span class="summary-none">없음</span></div>
                </div>
            </div>

            <!-- 고정 16개 보스탐 시간 선택 그리드 (8칸 x 2줄) -->
            <div id="statusTimeGrid" class="common-time-grid"></div>
        </section>

        <!-- 선택된 보스탐 상세: 왼쪽 드랍 아이템 / 오른쪽 파티원 -->
        <div class="raid-detail-columns">
            <!-- 왼쪽: 드랍 아이템 -->
            <section class="card-box raid-detail-items">
                <div class="item-section-header">
                    <span class="section-label">
                        🎁 드랍 아이템 내역
                        <span class="slot-gray-note" style="font-weight: normal; margin-left: 4px;">(실제 판매가는 변경될수있습니다)</span>
                    </span>
                    <span id="slotItemTotalBadge" class="slot-green-meta">총 0 (단위:아데나)</span>
                </div>

                <div id="slotItemList" class="item-list-wrap">
                    <div class="empty-party-msg">드랍된 아이템이 없습니다.</div>
                </div>

                <!-- 관리자 모드에서만 보이는 하단 아이템 추가 -->
                <div class="admin-item-add-row">
                    <input type="text" id="newDropItemName" class="input-common" placeholder="아이템명 (띄어쓰기로 여러 개)">
                    <button type="button" class="btn-sm btn-sm-blue" onclick="addDropItemRow()">+ 아이템 추가</button>
                </div>
            </section>

            <!-- 오른쪽: 파티원 명단(좌) + 혈비 20% 제외 분배금(우) -->
            <section class="card-box raid-detail-parties">
                <div class="item-section-header">
                    <span id="slotParticipantCount" class="section-label">총 0파티 (0명)</span>
                    <div class="header-right-group">
                        <span class="slot-gray-note">혈비 20% 제외 분배 <br> (실제 분배금은 변경될수있습니다)</span>
                        <button type="button" id="deleteEntireRaidBtn" class="btn-sm btn-sm-red admin-only" style="padding: 2px 6px; font-size: 10px;" onclick="deleteEntireRaidSlot()">
                            전체삭제
                        </button>
                    </div>
                </div>

                <div id="slotPartyList" class="party-list-stack">
                    <div class="empty-party-msg">해당 보스탐에 등록된 파티 기록이 없습니다.</div>
                </div>

                <!-- 관리자 모드에서만 보이는 하단 파티원 추가 -->
                <div class="admin-party-add">
                    <select id="addPartyTarget" class="input-common"></select>
                    <input type="text" id="addMemberInput" class="input-common" placeholder="아이디 (띄어쓰기로 여러 명)">
                    <button type="button" class="btn-sm btn-sm-blue" onclick="addPartyMembers()">+ 파티원 추가</button>
                </div>
            </section>
        </div>
    </main>

    <script src="/static/common.js?v=53"></script>
    <script>
        let selectedDate = '';
        let selectedTime = '';
        let dayRaids = [];
        let editableItems = [];
        let aliasMap = {};
        let itemAliasMap = {};
        let itemPriceMap = {};

        window.onload = async () => {
            const user = ClanApp.initPage('/raid-status', () => {
                renderTimeGrid();
                renderSlotDetails();
            });
            if (!user) return;

            const now = new Date();
            selectedDate = ClanApp.formatYMD(now);
            selectedTime = ClanApp.getDefaultRaidTime(now);

            document.getElementById('statusDatePicker').value = selectedDate;
            updateDateDisplay();
            await Promise.all([loadMemberDirectory(), loadItemDirectory()]);
            await loadDateRaids();
        };

        async function loadMemberDirectory() {
            aliasMap = {};
            try {
                const res = await fetch('/api/auth/search-members');
                const members = await res.json();
                members.forEach(m => {
                    const activeId = (m.active_id || '').trim();
                    if (!activeId) return;
                    aliasMap[activeId.toLowerCase()] = activeId;
                    (m.sub_chars || '').split(',').map(s => s.trim()).filter(Boolean).forEach(sub => {
                        aliasMap[sub.toLowerCase()] = activeId;
                    });
                });
            } catch (e) { aliasMap = {}; }
        }

        async function loadItemDirectory() {
            itemAliasMap = {};
            itemPriceMap = {};
            try {
                const res = await fetch('/api/items');
                if (!res.ok) return;
                const items = await res.json();
                ClanApp.setItemAliases(items);
                items.forEach(it => {
                    const name = (it.item_name || '').trim();
                    if (!name) return;
                    const price = Number(it.default_price || 0);
                    itemPriceMap[name] = price;
                    itemAliasMap[name.toLowerCase()] = name;
                    (it.aliases || '').split(/[,，]+/).map(s => s.trim()).filter(Boolean).forEach(a => {
                        itemAliasMap[a.toLowerCase()] = name;
                    });
                });
            } catch (e) {
                itemAliasMap = {};
                itemPriceMap = {};
            }
        }

        function formatHeaderLabel(dateStr, timeLabel) {
            const [y, m, d] = dateStr.split('-').map(Number);
            const wd = ['일', '월', '화', '수', '목', '금', '토'][new Date(y, m - 1, d).getDay()];
            return `${String(y).slice(2)}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')} ${wd} ${timeLabel}`;
        }

        function uniqueMembers(leader, members) {
            const seen = new Set([leader]);
            const out = [];
            (members || []).forEach(m => {
                if (m && !seen.has(m)) { seen.add(m); out.push(m); }
            });
            return out;
        }

        function updateDateDisplay() {
            document.getElementById('displaySelectedDate').textContent = formatHeaderLabel(selectedDate, selectedTime);
            document.getElementById('statusDatePicker').value = selectedDate;
        }

        function onDateInputChange() {
            const val = document.getElementById('statusDatePicker').value;
            if (!val) return;
            selectedDate = val;
            updateDateDisplay();
            loadDateRaids();
        }

        function moveDay(offset) {
            const [y, m, d] = selectedDate.split('-').map(Number);
            const target = new Date(y, m - 1, d);
            target.setDate(target.getDate() + offset);
            selectedDate = ClanApp.formatYMD(target);
            updateDateDisplay();
            loadDateRaids();
        }

        function setToday() {
            const now = new Date();
            selectedDate = ClanApp.formatYMD(now);
            selectedTime = ClanApp.getDefaultRaidTime(now);
            updateDateDisplay();
            loadDateRaids();
        }

        async function loadDateRaids() {
            const res = await fetch(`/api/raids?date=${encodeURIComponent(selectedDate)}`);
            dayRaids = await res.json();

            updateDaySummaryKPI();
            renderTimeGrid();
            syncEditableItemsFromRecord();
            renderSlotDetails();
        }

        function updateDaySummaryKPI() {
            const countMap = new Map();
            let totalDrops = 0;

            dayRaids.forEach(r => {
                ClanApp.extractItemDetails(r, itemPriceMap).forEach(it => {
                    totalDrops += 1;
                    countMap.set(it.name, (countMap.get(it.name) || 0) + 1);
                });
            });

            document.getElementById('sumDropCount').textContent = `${totalDrops}개`;

            const listEl = document.getElementById('sumDropList');
            if (countMap.size === 0) {
                listEl.innerHTML = `<span class="summary-none">없음</span>`;
            } else {
                listEl.innerHTML = [...countMap.entries()].map(([name, cnt]) =>
                    `<span class="summary-drop-chip">${ClanApp.itemNameHtml(name)}${cnt > 1 ? ` ×${cnt}` : ''}</span>`
                ).join('');
            }
        }

        function renderTimeGrid() {
            const grid = document.getElementById('statusTimeGrid');

            grid.innerHTML = ClanApp.RAID_TIMES.map(t => {
                const rec = dayRaids.find(r => r.raid_time === t);
                const participants = rec ? ClanApp.extractParticipants(rec) : [];
                const items = rec ? ClanApp.extractItemDetails(rec, itemPriceMap) : [];

                const hasRecord = participants.length > 0 || items.length > 0;
                const isActive = t === selectedTime;
                const subText = hasRecord ? `${participants.length}명` : '기록없음';

                return `
                    <button type="button"
                            class="common-time-btn status-time-btn ${hasRecord ? 'has-record' : ''} ${isActive ? 'active' : ''}"
                            onclick="selectRaidTime('${t}')">
                        <span>${t}</span>
                        <span class="common-time-sub status-time-sub">${subText}</span>
                    </button>
                `;
            }).join('');
        }

        function selectRaidTime(t) {
            selectedTime = t;
            updateDateDisplay();
            renderTimeGrid();
            syncEditableItemsFromRecord();
            renderSlotDetails();
        }

        function getCurrentRecord() {
            return dayRaids.find(r => r.raid_time === selectedTime) || null;
        }

        function syncEditableItemsFromRecord() {
            const rec = getCurrentRecord();
            editableItems = ClanApp.extractItemDetails(rec, itemPriceMap);
        }

        function getEffectiveItemPrice(item) {
            if (item.sale_type === '이벤트') return 0;
            const saved = Number(item.price || 0);
            return saved > 0 ? saved : Number(itemPriceMap[item.name] || 0);
        }

        function renderSlotDetails() {
            const rec = getCurrentRecord();
            const parties = (rec && rec.parties) ? rec.parties : [];
            const participants = ClanApp.extractParticipants(rec);
            const pCount = participants.length;

            document.getElementById('slotParticipantCount').textContent = `총 ${parties.length}파티 (${pCount}명)`;

            const totalItemPrice = editableItems.reduce((acc, it) => acc + getEffectiveItemPrice(it), 0);
            const netPool = Math.floor(totalItemPrice * 0.8);
            const perMemberShare = (pCount > 0 && netPool > 0) ? Math.floor(netPool / pCount) : 0;

            document.getElementById('slotItemTotalBadge').textContent = `총 ${totalItemPrice.toLocaleString()} (단위:아데나)`;

            const partyContainer = document.getElementById('slotPartyList');
            if (parties.length === 0) {
                partyContainer.innerHTML = `<div class="empty-party-msg">해당 보스탐에 등록된 파티 기록이 없습니다.</div>`;
            } else {
                partyContainer.innerHTML = parties.map(p => {
                    const names = [{ id: p.leader, isLeader: true }]
                        .concat(uniqueMembers(p.leader, p.members).map(m => ({ id: m, isLeader: false })));

                    const rows = names.map(n => {
                        const delBtn = ClanApp.isAdminModeOn
                            ? `<button type="button" class="btn-person-del" title="삭제" onclick="deleteMember('${n.id}')">✕</button>`
                            : '';
                        return `
                            <div class="party-person-row">
                                <span class="${n.isLeader ? 'party-leader-name' : 'party-member-name'}">${n.id}</span>
                                <span class="party-person-share">${perMemberShare.toLocaleString()}</span>
                                ${delBtn}
                            </div>`;
                    }).join('');

                    return `
                        <div class="party-row-item">
                            <div class="party-member-stack">${rows}</div>
                        </div>
                    `;
                }).join('');
            }

            renderPartyTargetOptions(parties);
            renderItemDetailsSection();
        }

        function renderPartyTargetOptions(parties) {
            const sel = document.getElementById('addPartyTarget');
            if (!sel) return;
            const prev = sel.value;
            sel.innerHTML = `<option value="">새 파티 만들기</option>` + parties.map(p =>
                `<option value="${p.leader}">${p.leader} 파티에 추가</option>`
            ).join('');
            if ([...sel.options].some(o => o.value === prev)) sel.value = prev;
        }

        function renderItemDetailsSection() {
            const itemContainer = document.getElementById('slotItemList');

            if (editableItems.length === 0) {
                itemContainer.innerHTML = `<div class="empty-party-msg">드랍된 아이템이 없습니다.</div>`;
                return;
            }

            itemContainer.innerHTML = editableItems.map((item, idx) => {
                const effectivePrice = getEffectiveItemPrice(item);
                const priceLabel = effectivePrice.toLocaleString();
                const delBtn = ClanApp.isAdminModeOn
                    ? `<button type="button" class="btn-sm btn-sm-red" style="padding: 2px 6px; font-size: 10px;" onclick="removeDropItemRow(${idx})">삭제</button>`
                    : '';
                return `
                    <div class="item-row-card">
                        <div class="item-view-line">
                            <span class="item-badge-name">🎁 ${ClanApp.itemNameHtml(item.name)}</span>
                            <span class="item-matched-price">${priceLabel}</span>
                            ${delBtn}
                        </div>
                    </div>
                `;
            }).join('');
        }

        function findSuggestedItem(token) {
            const lower = token.toLowerCase();
            for (const key of Object.keys(itemAliasMap)) {
                if (key.includes(lower) || lower.includes(key)) return itemAliasMap[key];
            }
            return null;
        }

        async function addDropItemRow() {
            if (!ClanApp.isAdminModeOn) return;
            const input = document.getElementById('newDropItemName');
            const tokens = input.value.split(/[\s,，]+/).map(t => t.trim()).filter(Boolean);
            if (tokens.length === 0) return alert('추가할 아이템 이름을 입력해 주세요.');

            const hasMaster = Object.keys(itemAliasMap).length > 0;
            const names = [];
            for (const tok of tokens) {
                const main = itemAliasMap[tok.toLowerCase()] || null;
                if (main) { names.push(main); continue; }
                if (!hasMaster) { names.push(tok); continue; }
                const sug = findSuggestedItem(tok);
                return alert(`[${tok}] 아이템은 아이템 목록에 없습니다.` + (sug ? `\n혹시 [${sug}] 인가요?` : ''));
            }

            const res = await fetch('/api/raids', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    raid_date: selectedDate,
                    raid_time: selectedTime,
                    parties: [],
                    add_items: names.join(' '),
                    requester_role: ClanApp.role,
                    requester_id: ClanApp.user.active_id
                })
            });
            if (res.ok) {
                input.value = '';
                await loadDateRaids();
            } else {
                const err = await res.json().catch(() => ({}));
                alert(err.detail || '아이템 추가 실패');
            }
        }

        async function removeDropItemRow(idx) {
            if (!ClanApp.isAdminModeOn) return;
            const rec = getCurrentRecord();
            const target = editableItems[idx];
            if (!rec || !target) return;
            if (!confirm(`[${target.name}] 아이템을 삭제하시겠습니까?`)) return;

            const remain = editableItems.filter((_, i) => i !== idx);
            const res = await fetch('/api/raids/item-details', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    raid_id: rec.id,
                    item_details: remain,
                    requester_role: ClanApp.role
                })
            });
            if (res.ok) {
                await loadDateRaids();
            } else {
                const err = await res.json().catch(() => ({}));
                alert(err.detail || '삭제 실패');
            }
        }

        async function deleteMember(name) {
            if (!ClanApp.isAdminModeOn) return;
            if (!confirm(`[${name}] 님을 이 보스탐 참여 명단에서 삭제하시겠습니까?`)) return;

            const params = new URLSearchParams({
                date: selectedDate,
                time: selectedTime,
                name: name,
                role: ClanApp.role
            });
            const res = await fetch(`/api/raids/member?${params.toString()}`, { method: 'DELETE' });
            if (res.ok) {
                await loadDateRaids();
            } else {
                const err = await res.json().catch(() => ({}));
                alert(err.detail || '삭제 실패');
            }
        }

        async function addPartyMembers() {
            if (!ClanApp.isAdminModeOn) return;
            const input = document.getElementById('addMemberInput');
            const tokens = input.value.split(/[\s,，]+/).map(t => t.trim()).filter(Boolean);
            if (tokens.length === 0) return alert('추가할 아이디를 입력해 주세요.');

            const names = [];
            for (const tok of tokens) {
                const main = aliasMap[tok.toLowerCase()];
                if (!main) return alert(`[${tok}] 아이디는 등록되지 않은 회원입니다.`);
                if (!names.includes(main)) names.push(main);
            }

            const rec = getCurrentRecord();
            const parties = (rec && rec.parties) || [];
            const targetLeader = document.getElementById('addPartyTarget').value;

            let partyToSave;
            if (!targetLeader) {
                const used = new Set(ClanApp.extractParticipants(rec).map(x => x.id));
                const dup = names.find(n => used.has(n));
                if (dup) return alert(`[${dup}] 님은 이미 이 보스탐에 등록되어 있습니다.`);
                if (names.length > 8) return alert('1파티에는 최대 8명까지만 들어갈 수 있습니다.');
                partyToSave = { leader: names[0], members: names.slice(1) };
            } else {
                const party = parties.find(p => p.leader === targetLeader);
                if (!party) return alert('대상 파티를 찾을 수 없습니다.');
                const inParty = new Set([party.leader].concat(party.members || []));
                const others = new Set(ClanApp.extractParticipants({
                    parties: parties.filter(p => p.leader !== targetLeader)
                }).map(x => x.id));
                const dup = names.find(n => inParty.has(n) || others.has(n));
                if (dup) return alert(`[${dup}] 님은 이미 이 보스탐에 등록되어 있습니다.`);
                const members = uniqueMembers(party.leader, (party.members || []).concat(names));
                if (1 + members.length > 8) return alert('1파티에는 최대 8명까지만 들어갈 수 있습니다.');
                partyToSave = { leader: party.leader, members };
            }

            const res = await fetch('/api/raids', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    raid_date: selectedDate,
                    raid_time: selectedTime,
                    parties: [partyToSave],
                    requester_role: ClanApp.role,
                    requester_id: ClanApp.user.active_id
                })
            });
            if (res.ok) {
                input.value = '';
                await loadDateRaids();
            } else {
                const err = await res.json().catch(() => ({}));
                alert(err.detail || '추가 실패');
            }
        }

        async function deleteEntireRaidSlot() {
            if (!ClanApp.isAdminModeOn) return;
            const rec = getCurrentRecord();
            if (!rec) return alert('삭제할 보스탐 기록이 없습니다.');

            if (!confirm(`${selectedDate} ${selectedTime} 보스탐 전체 기록을 삭제하시겠습니까?`)) return;

            const res = await fetch(`/api/raids/${rec.id}?role=${encodeURIComponent(ClanApp.role)}`, {
                method: 'DELETE'
            });
            if (res.ok) {
                await loadDateRaids();
            } else {
                const err = await res.json().catch(() => ({}));
                alert(err.detail || '삭제 실패');
            }
        }

        function downloadExcelRange(kind) {
            if (!ClanApp.isAdminModeOn) return;
            if (kind === 'day') {
                ClanApp.downloadExcel({ date: selectedDate });
            } else if (kind === 'week') {
                const { start, end } = ClanApp.getWeekRange(selectedDate);
                ClanApp.downloadExcel({ start, end });
            } else {
                ClanApp.downloadExcel({ month: selectedDate.slice(0, 7) });
            }
        }
    </script>
</body>
</html>
