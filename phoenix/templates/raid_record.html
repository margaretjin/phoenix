<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>보스탐 기록 - 혈맹 보스탐 체크기</title>
    <link rel="stylesheet" href="/static/style.css?v=5">
</head>
<body>
    <nav class="navbar">
        <div class="nav-left">
            <a href="/raid-record" class="nav-link active">보스탐 기록</a>
            <a href="/raid-status" class="nav-link">일별기록현황</a>
            <a href="/item-status" class="nav-link">템 보유현황</a>
            <a href="/my-history" class="nav-link" id="navMyId">참여내역</a>
        </div>
        <div class="nav-right">
            <span id="navUserInfo" style="color: var(--accent-gold); font-weight: 700; font-size: 0.9rem; margin-right: 0.4rem;"></span>
            <button id="adminModeBtn" onclick="toggleAdminMode()" class="admin-mode-toggle hidden">👑 관리자 모드: OFF</button>
            <a href="/admin" class="nav-link admin-btn hidden" id="navAdminBtn">회원관리</a>
            <button onclick="logoutUser()" class="btn" style="padding: 0.3rem 0.6rem; background: #334155; color: #fff; font-size: 0.8rem;">로그아웃</button>
        </div>
    </nav>

    <main class="container">
        <div class="card">
            <h2 class="section-title">⚔️ 보스탐 참여 인원 입력</h2>

            <!-- 1. 관리자 모드 ON 전용 날짜 선택 UI -->
            <div id="adminDateControls" style="display: none; gap: 1rem; flex-wrap: wrap; margin-bottom: 1rem;">
                <div style="flex: 1; min-width: 150px;">
                    <label>기준 월 선택 (관리자 모드)</label>
                    <input type="month" id="raidMonth" onchange="onAdminMonthChange()">
                </div>
                <div style="flex: 1.5; min-width: 230px;">
                    <label>보스탐 날짜 선택 (관리자 모드)</label>
                    <div style="display: flex; gap: 0.3rem;">
                        <input type="date" id="raidDate" onchange="onAdminDateChange()" style="flex: 1;">
                        <button type="button" class="btn" style="padding: 0 0.6rem; background: #334155; color: #fff; font-size: 0.8rem; white-space: nowrap;" onclick="setYesterdayDate(true)">전날</button>
                        <button type="button" class="btn" style="padding: 0 0.6rem; background: #334155; color: #fff; font-size: 0.8rem; white-space: nowrap;" onclick="setTodayDate(true)">오늘</button>
                    </div>
                </div>
                <div style="flex: 1; min-width: 140px;">
                    <label>선택된 보스탐 시간</label>
                    <input type="text" id="selectedTimeViewAdmin" readonly style="color: var(--accent-gold); font-weight: 800;">
                </div>
            </div>

            <!-- 2. 일반 모드(일반회원 또는 관리자 모드 OFF) 날짜 선택 UI -->
            <div id="memberDateControls" style="display: none; gap: 1rem; flex-wrap: wrap; margin-bottom: 1rem;">
                <div style="flex: 1.4; min-width: 220px;">
                    <label>보스탐 날짜 구분 (<span id="memberSelectedDateText" style="color:var(--accent-gold);"></span>)</label>
                    <div style="display: flex; gap: 0.5rem;">
                        <button type="button" id="btnYesterday" class="day-toggle-btn" onclick="selectMemberDay('yesterday')">전날</button>
                        <button type="button" id="btnToday" class="day-toggle-btn active" onclick="selectMemberDay('today')">오늘</button>
                    </div>
                </div>
                <div style="flex: 1; min-width: 140px;">
                    <label>선택된 보스탐 시간</label>
                    <input type="text" id="selectedTimeViewMember" readonly style="color: var(--accent-gold); font-weight: 800;">
                </div>
            </div>

            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.4rem; flex-wrap: wrap; gap: 0.5rem;">
                <label style="margin-bottom: 0;">보스탐 시간 선택</label>
                <div style="font-size: 0.78rem; color: var(--text-muted); display: flex; gap: 0.8rem;">
                    <span><span style="display:inline-block; width:10px; height:10px; background:#475569; border:1px solid #94a3b8; border-radius:2px;"></span> 입력 가능(3시간 내)</span>
                    <span><span style="color:#34d399; font-weight:900;">✔</span> 입력중</span>
                    <span><span style="display:inline-block; width:10px; height:10px; background:#0f172a; border:1px solid #1e293b; border-radius:2px;"></span> 진행 전(입력 불가)</span>
                </div>
            </div>
            <div id="timeGrid" class="time-grid"></div>

            <!-- 입력 불가 안내 멘트 박스 -->
            <div id="timeLimitNotice" class="hidden" style="margin: 1rem 0; padding: 1rem; background: rgba(239, 68, 68, 0.2); border: 2px solid var(--accent-red); border-radius: 8px; text-align: center; color: #fca5a5; font-weight: 700;">
                <div id="timeLimitTitle">⏳ 입력할 수 없는 시간입니다.</div>
                <span id="timeLimitSub" style="font-size: 0.9rem; color: #fff;">3시간 내에 입력하려면 관리자에 문의하세요.</span>
            </div>

            <!-- 참여자 텍스트 입력창 -->
            <div id="inputSectionWrapper" style="margin: 1.2rem 0; padding: 1.2rem; background: var(--bg-input); border: 1px solid var(--border-color); border-radius: 8px;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;">
                    <label style="font-weight: 700; color: var(--text-light); margin-bottom: 0;">참여자 아이디 입력 (본인 아이디 포함 시 자동 파티장, 미포함 시 첫 번째 아이디가 파티장)</label>
                    <button class="btn btn-red" style="padding: 0.3rem 0.7rem; font-size: 0.8rem;" onclick="clearInputBox()">🔄 새로고침 (입력창 비우기)</button>
                </div>
                <p style="font-size: 0.8rem; color: var(--text-muted); margin-bottom: 0.6rem;">
                    예: <code style="background:#1e293b; padding:2px 6px; border-radius:4px; color:var(--accent-gold);">월은 투헤븐 김스턴 꽃씨</code> (득템 아이템 등록 및 정산은 [일별기록현황]에서 관리)
                </p>
                <textarea id="participantInputText" rows="3" placeholder="여기에 참여자 아이디들을 입력하세요..." oninput="parseAndMatchTokens()" style="font-size: 0.95rem;"></textarea>
            </div>

            <!-- 실시간 매칭 결과 -->
            <div style="margin-bottom: 1.2rem;">
                <label style="margin-bottom: 0.5rem;">실시간 매칭 결과 (초록: 명단 일치 / <span style="color: var(--accent-red); font-weight:700;">빨강: 미매칭 - 클릭하여 선택</span>)</label>
                <div id="tokenContainer" class="token-list"></div>
            </div>

            <!-- 올리시겠습니까 버튼 -->
            <div style="margin-bottom: 1.5rem;">
                <button id="submitRaidBtn" class="btn btn-green" style="width: 100%; font-size: 1.05rem;" disabled onclick="confirmAndSubmitRaid()">
                    올리시겠습니까 (참여 인원을 입력해 주세요)
                </button>
            </div>

            <!-- 하단: 현재 DB에 저장된 해당 시간 참여 명단 -->
            <div style="padding: 1rem; background: var(--bg-input); border: 1px solid var(--border-color); border-radius: 8px;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.6rem;">
                    <label style="color: var(--accent-gold); font-weight: 700; margin-bottom: 0; font-size: 1rem;">📋 현재 DB에 저장된 해당 시간 참여 명단</label>
                    <button id="deleteEntireRaidBtn" class="btn btn-red hidden" style="padding: 0.3rem 0.7rem; font-size: 0.8rem;" onclick="deleteEntireRaid()">🗑️ 이 시간 전체 기록 삭제</button>
                </div>
                <div id="currentRegisteredInfo" style="font-size: 0.9rem; color: var(--text-muted);">
                    조회 중...
                </div>
            </div>
        </div>
    </main>

    <!-- 근접 아이디 선택 모달 -->
    <div id="matchModal" class="modal-backdrop hidden">
        <div class="modal-content">
            <h3 class="section-title" style="font-size: 1.05rem;">🎯 올바른 혈맹원 아이디 선택</h3>
            <p id="modalTargetText" style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 0.8rem;"></p>
            <div id="candidateList" style="display: flex; flex-direction: column; gap: 0.45rem; max-height: 260px; overflow-y: auto;"></div>
            <div style="display: flex; justify-content: space-between; margin-top: 1rem;">
                <button class="btn btn-red" onclick="removeCurrentToken()">이 단어 지우기</button>
                <button class="btn" style="background:#475569; color:#fff;" onclick="closeModal()">닫기</button>
            </div>
        </div>
    </div>

    <script>
        let currentUser = null;
        let hasAdminPrivilege = false;
        let isAdminModeOn = false;
        let allMembers = [];
        let raidTimes = [];
        let selectedTime = "09시";
        let currentTargetDate = "";
        let dayRaidsCache = [];
        let parsedTokens = [];
        let editingTokenIndex = null;
        let currentRaidLogId = null;
        let isTimeBlocked = false;
        let blockReasonMessage = "";
        let editingTargetLeader = null;

        window.onload = async () => {
            const saved = localStorage.getItem('clan_user');
            if (!saved) {
                window.location.href = '/login';
                return;
            }
            currentUser = JSON.parse(saved);
            const roleStr = (currentUser.role || '').trim();
            hasAdminPrivilege = roleStr === '관리자' || roleStr === '슈퍼관리자';
            isAdminModeOn = hasAdminPrivilege && (localStorage.getItem('clan_admin_mode') === 'true');

            document.getElementById('navMyId').textContent = `(${currentUser.active_id})참여내역`;
            document.getElementById('navUserInfo').textContent = `${currentUser.active_id} (${roleStr})`;

            if (hasAdminPrivilege) {
                document.getElementById('adminModeBtn').classList.remove('hidden');
            }

            applyAdminModeUI();
            setTodayDate(false);

            const [timeRes, memRes] = await Promise.all([
                fetch('/api/raids/times'),
                fetch('/api/auth/search-members')
            ]);
            raidTimes = (await timeRes.json()).times;
            allMembers = await memRes.json();

            const now = new Date();
            autoSelectCurrentRaidTime(now.getHours());
            adjustDateForLateNightRaid(selectedTime);
            await refreshDateAndRaids();
        };

        function toggleAdminMode() {
            if (!hasAdminPrivilege) return;
            isAdminModeOn = !isAdminModeOn;
            localStorage.setItem('clan_admin_mode', isAdminModeOn ? 'true' : 'false');
            editingTargetLeader = null;
            applyAdminModeUI();
            if (!isAdminModeOn) {
                setTodayDate(false);
                adjustDateForLateNightRaid(selectedTime);
            }
            refreshDateAndRaids();
        }

        function applyAdminModeUI() {
            const toggleBtn = document.getElementById('adminModeBtn');
            const navAdminBtn = document.getElementById('navAdminBtn');

            if (isAdminModeOn) {
                toggleBtn.textContent = '👑 관리자 모드: ON';
                toggleBtn.classList.add('active');
                navAdminBtn.classList.remove('hidden');
                document.getElementById('adminDateControls').style.display = 'flex';
                document.getElementById('memberDateControls').style.display = 'none';
            } else {
                toggleBtn.textContent = '👑 관리자 모드: OFF';
                toggleBtn.classList.remove('active');
                navAdminBtn.classList.add('hidden');
                document.getElementById('adminDateControls').style.display = 'none';
                document.getElementById('memberDateControls').style.display = 'flex';
            }
        }

        function logoutUser() {
            if (confirm('로그아웃 하시겠습니까?')) {
                localStorage.removeItem('clan_user');
                localStorage.removeItem('clan_admin_mode');
                window.location.href = '/login';
            }
        }

        function formatDateStr(dateObj) {
            const yyyy = dateObj.getFullYear();
            const mm = String(dateObj.getMonth() + 1).padStart(2, '0');
            const dd = String(dateObj.getDate()).padStart(2, '0');
            return { ym: `${yyyy}-${mm}`, ymd: `${yyyy}-${mm}-${dd}` };
        }

        function applyDateToInputs(dateObj) {
            const f = formatDateStr(dateObj);
            currentTargetDate = f.ymd;
            document.getElementById('raidMonth').value = f.ym;
            document.getElementById('raidDate').value = f.ymd;
            document.getElementById('memberSelectedDateText').textContent = f.ymd;

            const todayStr = formatDateStr(new Date()).ymd;
            if (f.ymd === todayStr) {
                document.getElementById('btnToday').classList.add('active');
                document.getElementById('btnYesterday').classList.remove('active');
            } else {
                document.getElementById('btnYesterday').classList.add('active');
                document.getElementById('btnToday').classList.remove('active');
            }
        }

        function setYesterdayDate(shouldRefresh = true) {
            const d = new Date();
            d.setDate(d.getDate() - 1);
            applyDateToInputs(d);
            if (shouldRefresh) refreshDateAndRaids();
        }

        function setTodayDate(shouldRefresh = true) {
            const d = new Date();
            applyDateToInputs(d);
            if (shouldRefresh) refreshDateAndRaids();
        }

        function selectMemberDay(type) {
            if (type === 'yesterday') setYesterdayDate(true);
            else setTodayDate(true);
        }

        function onAdminMonthChange() {
            const ymVal = document.getElementById('raidMonth').value;
            if (!ymVal) return;
            const prevDay = currentTargetDate ? currentTargetDate.slice(8, 10) : '01';
            const newDate = `${ymVal}-${prevDay}`;
            currentTargetDate = newDate;
            document.getElementById('raidDate').value = newDate;
            refreshDateAndRaids();
        }

        function onAdminDateChange() {
            const val = document.getElementById('raidDate').value;
            if (val) {
                currentTargetDate = val;
                document.getElementById('raidMonth').value = val.slice(0, 7);
                refreshDateAndRaids();
            }
        }

        function adjustDateForLateNightRaid(timeLabel) {
            const now = new Date();
            const currentHour = now.getHours();
            const isNightSlot = timeLabel.includes('22시') || timeLabel.includes('23시') || timeLabel.includes('24시');

            if (currentHour >= 0 && currentHour <= 2) {
                if (isNightSlot) setYesterdayDate(false);
                else setTodayDate(false);
            }
        }

        function autoSelectCurrentRaidTime(currentHour) {
            const hourMap = [
                { h: 9, label: "09시" }, { h: 11, label: "11시" }, { h: 12, label: "12시" },
                { h: 13, label: "13시" }, { h: 15, label: "15시" }, { h: 17, label: "17시" },
                { h: 18, label: "18시" }, { h: 19, label: "19시" }, { h: 21, label: "21시" },
                { h: 22, label: "22시(오만)" }, { h: 23, label: "23시" }, { h: 24, label: "24시" },
                { h: 1, label: "01시" }, { h: 3, label: "03시" }, { h: 5, label: "05시" }, { h: 7, label: "07시" }
            ];
            let best = hourMap[0].label;
            let minDiff = 99;
            hourMap.forEach(item => {
                const compareH = item.h === 24 ? 0 : item.h;
                let diff = Math.abs(currentHour - compareH);
                if (diff > 12) diff = 24 - diff;
                if (diff < minDiff) {
                    minDiff = diff;
                    best = item.label;
                }
            });
            updateSelectedTimeUI(best);
        }

        function updateSelectedTimeUI(timeLabel) {
            selectedTime = timeLabel;
            document.getElementById('selectedTimeViewAdmin').value = timeLabel;
            document.getElementById('selectedTimeViewMember').value = timeLabel;
        }

        function getTimeDiffHours(dateStr, timeLabel) {
            const raidHourMatch = timeLabel.match(/\d+/);
            const raidHour = raidHourMatch ? parseInt(raidHourMatch[0], 10) : 9;
            let raidDateTime;
            if (timeLabel.includes('24')) {
                raidDateTime = new Date(`${dateStr}T00:00:00`);
                raidDateTime.setDate(raidDateTime.getDate() + 1);
            } else {
                raidDateTime = new Date(`${dateStr}T${String(raidHour).padStart(2, '0')}:00:00`);
            }
            const now = new Date();
            return (now - raidDateTime) / (1000 * 60 * 60);
        }

        async function refreshDateAndRaids() {
            if (!currentTargetDate) return;
            const res = await fetch(`/api/raids?date=${currentTargetDate}`);
            dayRaidsCache = await res.json();
            renderTimeGrid();
            checkExistingRaid();
        }

        function renderTimeGrid() {
            const grid = document.getElementById('timeGrid');
            grid.innerHTML = '';

            const completedTimes = new Set(
                dayRaidsCache
                    .filter(r => (r.parties && r.parties.length > 0) || (r.dropped_items && r.dropped_items.trim() !== ''))
                    .map(r => r.raid_time)
            );

            raidTimes.forEach(t => {
                const div = document.createElement('div');
                const diffHours = getTimeDiffHours(currentTargetDate, t);
                const isFuture = diffHours < 0;
                const isAvailable = diffHours >= 0 && diffHours <= 3;
                const isCompleted = completedTimes.has(t);

                let classes = ['time-box'];
                if (t === selectedTime) classes.push('selected');
                if (isFuture) classes.push('future-slot');
                else if (isAvailable) classes.push('available-slot');
                if (isCompleted) classes.push('completed-slot');

                div.className = classes.join(' ');
                div.textContent = t;
                div.onclick = () => {
                    updateSelectedTimeUI(t);
                    editingTargetLeader = null;
                    renderTimeGrid();
                    checkExistingRaid();
                };
                grid.appendChild(div);
            });
        }

        async function checkExistingRaid() {
            if (!currentTargetDate) return;

            const diffHours = getTimeDiffHours(currentTargetDate, selectedTime);
            const noticeBox = document.getElementById('timeLimitNotice');
            const noticeTitle = document.getElementById('timeLimitTitle');
            const noticeSub = document.getElementById('timeLimitSub');
            const inputWrapper = document.getElementById('inputSectionWrapper');

            if (diffHours < 0) {
                isTimeBlocked = true;
                blockReasonMessage = "⏳ 아직 진행되지 않은 보스탐 시간입니다 (입력 불가)";
                noticeTitle.textContent = "⏳ 아직 진행되지 않은 미래의 보스탐 시간입니다.";
                noticeSub.textContent = "보스탐 시작 시간이 지난 후에 기록을 입력할 수 있습니다.";
                noticeBox.classList.remove('hidden');
                inputWrapper.style.opacity = '0.4';
                inputWrapper.style.pointerEvents = 'none';
            }
            else if (!isAdminModeOn && diffHours > 3) {
                isTimeBlocked = true;
                blockReasonMessage = "⏳ 입력 제한 시간(3시간) 경과 (관리자 모드 필요)";
                noticeTitle.textContent = "⏳ 해당 보스탐 시간으로부터 3시간이 경과하여 입력할 수 없습니다.";
                noticeSub.textContent = hasAdminPrivilege
                    ? "상단의 [👑 관리자 모드: OFF] 버튼을 눌러 ON으로 켜면 추가/수정이 가능합니다."
                    : "3시간 내에 입력하려면 관리자에 문의하세요.";
                noticeBox.classList.remove('hidden');
                inputWrapper.style.opacity = '0.4';
                inputWrapper.style.pointerEvents = 'none';
            }
            else {
                isTimeBlocked = false;
                blockReasonMessage = "";
                noticeBox.classList.add('hidden');
                inputWrapper.style.opacity = '1';
                inputWrapper.style.pointerEvents = 'auto';
            }

            const existingRow = dayRaidsCache.find(r => r.raid_time === selectedTime);
            const infoBox = document.getElementById('currentRegisteredInfo');
            const delAllBtn = document.getElementById('deleteEntireRaidBtn');

            if (existingRow) {
                currentRaidLogId = existingRow.id;
                if (isAdminModeOn) delAllBtn.classList.remove('hidden');
                else delAllBtn.classList.add('hidden');

                const parties = existingRow.parties || [];
                let partiesHtml = '';

                if (parties.length > 0) {
                    parties.forEach(p => {
                        const leader = p.leader;
                        const members = (p.members || []).filter(m => m !== leader);
                        const fullLine = [leader, ...members].join(' ');
                        const membersStr = members.length > 0 ? ` ${members.join(' ')}` : '';
                        
                        const adminBtns = isAdminModeOn ? `
                            <div class="admin-action-btns">
                                <button class="btn btn-blue" style="padding:0.25rem 0.6rem; font-size:0.75rem;" onclick="loadPartyToEdit('${leader}', '${fullLine}')">수정</button>
                                <button class="btn btn-red" style="padding:0.25rem 0.6rem; font-size:0.75rem;" onclick="deleteSingleParty('${leader}')">삭제</button>
                            </div>
                        ` : '';

                        partiesHtml += `
                            <div class="party-card">
                                <span class="party-text-line"><span class="party-leader-soft-green">${leader}</span>${membersStr}</span>
                                ${adminBtns}
                            </div>
                        `;
                    });
                } else {
                    partiesHtml = `<div style="color:var(--text-muted);">등록된 파티 명단이 없습니다.</div>`;
                }

                infoBox.innerHTML = partiesHtml;
            } else {
                currentRaidLogId = null;
                delAllBtn.classList.add('hidden');
                infoBox.innerHTML = `<span style="color:var(--text-muted);">아직 해당 시간에 등록된 기록이 없습니다.</span>`;
            }
            updateSubmitButtonState();
        }

        function loadPartyToEdit(leader, fullLineStr) {
            if (!isAdminModeOn) return;
            editingTargetLeader = leader;
            document.getElementById('participantInputText').value = fullLineStr;
            parseAndMatchTokens();
            document.getElementById('participantInputText').focus();
        }

        async function deleteSingleParty(leader) {
            if (!isAdminModeOn) return;
            if (!confirm(`[${leader}] 파티장의 파티 명단을 삭제하시겠습니까?`)) return;
            const res = await fetch(`/api/raids/party?date=${currentTargetDate}&time=${encodeURIComponent(selectedTime)}&leader=${encodeURIComponent(leader)}&role=${encodeURIComponent(currentUser.role)}`, {
                method: 'DELETE'
            });
            if (res.ok) {
                alert('해당 파티 명단이 삭제되었습니다.');
                await refreshDateAndRaids();
            }
        }

        async function deleteEntireRaid() {
            if (!isAdminModeOn || !currentRaidLogId) return;
            if (!confirm(`선택된 시간(${selectedTime})의 모든 파티 기록과 드랍 아이템을 완전히 삭제하시겠습니까?`)) return;
            const res = await fetch(`/api/raids/${currentRaidLogId}?role=${encodeURIComponent(currentUser.role)}`, {
                method: 'DELETE'
            });
            if (res.ok) {
                alert('전체 기록이 삭제되었습니다.');
                clearInputBox();
                await refreshDateAndRaids();
            }
        }

        function clearInputBox() {
            editingTargetLeader = null;
            document.getElementById('participantInputText').value = '';
            parsedTokens = [];
            renderTokens();
        }

        function parseAndMatchTokens() {
            const text = document.getElementById('participantInputText').value;
            const rawWords = text.split(/[\s,，\n]+/).map(w => w.trim()).filter(Boolean);
            const activeIds = allMembers.map(m => m.active_id);

            parsedTokens = rawWords.map(w => {
                const exact = activeIds.includes(w);
                let bestMatch = null;
                let minScore = 999;

                if (!exact) {
                    allMembers.forEach(m => {
                        const score = getSimilarityScore(w, m.active_id);
                        if (score < minScore) {
                            minScore = score;
                            bestMatch = m.active_id;
                        }
                    });
                }

                return {
                    raw: w,
                    matchedId: exact ? w : bestMatch,
                    isMatched: exact
                };
            });

            renderTokens();
        }

        function getSimilarityScore(a, b) {
            const matrix = Array.from({ length: a.length + 1 }, (_, i) => [i]);
            for (let j = 1; j <= b.length; j++) matrix[0][j] = j;
            for (let i = 1; i <= a.length; i++) {
                for (let j = 1; j <= b.length; j++) {
                    const cost = a[i - 1] === b[j - 1] ? 0 : 1;
                    matrix[i][j] = Math.min(
                        matrix[i - 1][j] + 1,
                        matrix[i][j - 1] + 1,
                        matrix[i - 1][j - 1] + cost
                    );
                }
            }
            return matrix[a.length][b.length];
        }

        function determinePartyLeader(matchedIds) {
            if (editingTargetLeader) return editingTargetLeader;
            if (matchedIds.includes(currentUser.active_id)) {
                return currentUser.active_id;
            }
            return matchedIds[0] || currentUser.active_id;
        }

        function renderTokens() {
            const container = document.getElementById('tokenContainer');
            container.innerHTML = '';

            if (parsedTokens.length === 0) {
                container.innerHTML = '<span style="color:var(--text-muted); font-size:0.85rem;">입력창에 참여자 아이디를 적으면 이곳에 실시간 매칭 상태가 표시됩니다.</span>';
                updateSubmitButtonState();
                return;
            }

            const matchedIds = parsedTokens.filter(t => t.isMatched).map(t => t.matchedId);
            const activeLeader = determinePartyLeader(matchedIds);

            parsedTokens.forEach((tk, idx) => {
                const span = document.createElement('span');
                span.className = `ocr-token ${tk.isMatched ? 'matched' : 'unmatched'}`;
                const isLeaderToken = tk.isMatched && tk.matchedId === activeLeader;

                if (tk.isMatched) {
                    span.innerHTML = `${isLeaderToken ? '[파티장] ' : ''}${tk.matchedId} <small style="cursor:pointer; margin-left:4px;" onclick="deleteToken(event, ${idx})">✕</small>`;
                } else {
                    span.innerHTML = `❗ ${tk.raw} ➡️ <b>${tk.matchedId || '선택필요'}</b> (클릭수정)`;
                }
                
                span.onclick = () => openCandidateModal(idx);
                container.appendChild(span);
            });

            updateSubmitButtonState();
        }

        function deleteToken(e, idx) {
            e.stopPropagation();
            parsedTokens.splice(idx, 1);
            syncTokensToTextarea();
            renderTokens();
        }

        function openCandidateModal(tokenIndex) {
            editingTokenIndex = tokenIndex;
            const rawWord = parsedTokens[tokenIndex].raw;
            document.getElementById('modalTargetText').textContent = `입력한 [${rawWord}] 에 매칭할 올바른 혈맹원 아이디를 선택하세요:`;

            const sortedMembers = [...allMembers].sort((m1, m2) => {
                return getSimilarityScore(rawWord, m1.active_id) - getSimilarityScore(rawWord, m2.active_id);
            });

            const list = document.getElementById('candidateList');
            list.innerHTML = '';
            sortedMembers.forEach((m, i) => {
                const btn = document.createElement('button');
                btn.className = 'btn';
                btn.style.textAlign = 'left';
                btn.style.background = i === 0 ? 'var(--accent-gold)' : '#334155';
                btn.style.color = i === 0 ? '#000' : '#fff';
                btn.textContent = `${i === 0 ? '⭐ [추천] ' : ''}${m.active_id} (${m.char_class} / ${m.clan})`;
                btn.onclick = () => {
                    parsedTokens[editingTokenIndex].matchedId = m.active_id;
                    parsedTokens[editingTokenIndex].isMatched = true;
                    closeModal();
                    syncTokensToTextarea();
                    renderTokens();
                };
                list.appendChild(btn);
            });

            document.getElementById('matchModal').classList.remove('hidden');
        }

        function removeCurrentToken() {
            if (editingTokenIndex !== null) {
                parsedTokens.splice(editingTokenIndex, 1);
                closeModal();
                syncTokensToTextarea();
                renderTokens();
            }
        }

        function closeModal() {
            document.getElementById('matchModal').classList.add('hidden');
            editingTokenIndex = null;
        }

        function syncTokensToTextarea() {
            document.getElementById('participantInputText').value = parsedTokens.map(t => t.matchedId).join(' ');
        }

        function updateSubmitButtonState() {
            const btn = document.getElementById('submitRaidBtn');
            const hasTokens = parsedTokens.length > 0;
            const allMatched = parsedTokens.every(t => t.isMatched);

            if (isTimeBlocked) {
                btn.disabled = true;
                btn.textContent = blockReasonMessage;
                return;
            }

            if (hasTokens && allMatched) {
                const matchedIds = parsedTokens.map(t => t.matchedId);
                const activeLeader = determinePartyLeader(matchedIds);
                const uniqueCount = new Set([activeLeader, ...matchedIds]).size;
                btn.disabled = false;
                btn.textContent = `✅ 올리시겠습니까 (파티장: ${activeLeader} / 총 ${uniqueCount}명 반영)`;
                return;
            }

            btn.disabled = true;
            btn.textContent = hasTokens 
                ? `올리시겠습니까 (빨간색 항목을 클릭하여 확인 및 수정해 주세요)`
                : `올리시겠습니까 (참여 인원을 입력해 주세요)`;
        }

        async function confirmAndSubmitRaid() {
            if (isTimeBlocked) return alert(blockReasonMessage);

            const matchedIds = parsedTokens.map(t => t.matchedId);
            if (matchedIds.length === 0) return;

            const effectiveRole = isAdminModeOn ? (currentUser.role || '').trim() : '일반회원';
            const leader = determinePartyLeader(matchedIds);
            const uniqueMembers = Array.from(new Set([leader, ...matchedIds]));
            const partyMembersOnly = uniqueMembers.filter(id => id !== leader);

            // 기존에 일별기록현황에서 등록된 드랍 아이템이 날아가지 않도록 유지
            const existingRow = dayRaidsCache.find(r => r.raid_time === selectedTime);
            const preserveItems = existingRow ? (existingRow.dropped_items || '') : '';

            const parties = [{ leader: leader, members: uniqueMembers }];
            const confirmMsg = `[${currentTargetDate} ${selectedTime}]\n파티장: ${leader}\n파티원: ${partyMembersOnly.join(' ') || '없음'}\n이 내용을 반영하시겠습니까?`;

            if (!confirm(confirmMsg)) return;

            const res = await fetch('/api/raids', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    raid_date: currentTargetDate,
                    raid_time: selectedTime,
                    parties,
                    dropped_items: preserveItems,
                    requester_role: effectiveRole,
                    requester_id: currentUser.active_id
                })
            });

            if (res.ok) {
                alert('성공적으로 등록/반영되었습니다!');
                clearInputBox();
                await refreshDateAndRaids();
            } else {
                const err = await res.json();
                alert(err.detail || '저장 중 오류가 발생했습니다.');
            }
        }
    </script>
</body>
</html>
