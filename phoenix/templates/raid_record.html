<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>보스탐 기록 - 혈맹 보스탐 체크기</title>
    <link rel="stylesheet" href="/static/style.css?v=7">
</head>
<body>
    <nav class="navbar" id="appNavbar"></nav>

    <main class="container">
        <div class="card">
            <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 0.9rem;">
                <h2 class="section-title" style="margin-bottom: 0;">⚔️ 보스탐 참여 인원 입력</h2>
                <button type="button" class="btn btn-blue" style="font-size: 0.8rem; padding: 0.4rem 0.75rem;" onclick="ClanApp.downloadExcel({ date: currentTargetDate })">
                    📥 선택일 엑셀 다운로드
                </button>
            </div>

            <!-- 관리자 모드 ON 날짜 선택 -->
            <div id="adminDateControls" style="display: none; gap: 0.75rem; flex-wrap: wrap; margin-bottom: 1rem;">
                <div style="flex: 1; min-width: 140px;">
                    <label>기준 월 (관리자)</label>
                    <input type="month" id="raidMonth" onchange="onAdminMonthChange()">
                </div>
                <div style="flex: 1.5; min-width: 220px;">
                    <label>보스탐 날짜 (관리자)</label>
                    <div style="display: flex; gap: 0.3rem;">
                        <input type="date" id="raidDate" onchange="onAdminDateChange()" style="flex: 1;">
                        <button type="button" class="btn btn-dark" onclick="setDayOffset(-1)">전날</button>
                        <button type="button" class="btn btn-dark" onclick="setDayOffset(0)">오늘</button>
                    </div>
                </div>
                <div style="flex: 1; min-width: 120px;">
                    <label>선택된 시간</label>
                    <input type="text" id="selectedTimeViewAdmin" readonly style="color: var(--accent-gold); font-weight: 800;">
                </div>
            </div>

            <!-- 일반 모드 날짜 선택 -->
            <div id="memberDateControls" style="display: none; gap: 0.75rem; flex-wrap: wrap; margin-bottom: 1rem;">
                <div style="flex: 1.4; min-width: 200px;">
                    <label>보스탐 날짜 (<span id="memberSelectedDateText" style="color:var(--accent-gold);"></span>)</label>
                    <div style="display: flex; gap: 0.45rem;">
                        <button type="button" id="btnYesterday" class="day-toggle-btn" onclick="setDayOffset(-1)">전날</button>
                        <button type="button" id="btnToday" class="day-toggle-btn active" onclick="setDayOffset(0)">오늘</button>
                    </div>
                </div>
                <div style="flex: 1; min-width: 120px;">
                    <label>선택된 시간</label>
                    <input type="text" id="selectedTimeViewMember" readonly style="color: var(--accent-gold); font-weight: 800;">
                </div>
            </div>

            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.4rem; flex-wrap: wrap; gap: 0.4rem;">
                <label style="margin-bottom: 0;">보스탐 시간 선택 (16타임)</label>
                <div style="font-size: 0.75rem; color: var(--text-muted); display: flex; gap: 0.6rem;">
                    <span>⬜ 3시간 내 입력가능</span>
                    <span><b style="color:#34d399;">✔</b> 입력완료</span>
                </div>
            </div>
            <div id="timeGrid" class="time-grid"></div>

            <div id="timeLimitNotice" class="hidden" style="margin: 0.8rem 0; padding: 0.85rem; background: rgba(239, 68, 68, 0.2); border: 1.5px solid var(--accent-red); border-radius: 8px; text-align: center; color: #fca5a5; font-weight: 700;">
                <div id="timeLimitTitle">⏳ 입력할 수 없는 시간입니다.</div>
                <span id="timeLimitSub" style="font-size: 0.84rem; color: #fff;"></span>
            </div>

            <div id="inputSectionWrapper" style="margin: 1rem 0; padding: 1rem; background: var(--bg-input); border: 1px solid var(--border-color); border-radius: 8px;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.45rem; flex-wrap: wrap; gap: 0.4rem;">
                    <label style="font-weight: 700; color: var(--text-light); margin-bottom: 0;">참여자 아이디 입력 (보조캐릭 입력 시 본캐릭으로 자동 변환)</label>
                    <button class="btn btn-red" style="padding: 0.28rem 0.6rem; font-size: 0.76rem;" onclick="clearInputBox()">🔄 비우기</button>
                </div>
                <textarea id="participantInputText" rows="3" placeholder="예: 월은 꽃씨 검성 (띄어쓰기로 입력)" oninput="parseAndMatchTokens()"></textarea>
            </div>

            <div style="margin-bottom: 1rem;">
                <label>실시간 매칭 결과 (초록: 일치 / <span style="color: var(--accent-red);">빨강: 클릭하여 선택</span>)</label>
                <div id="tokenContainer" class="token-list"></div>
            </div>

            <button id="submitRaidBtn" class="btn btn-green" style="width: 100%; font-size: 1rem; padding: 0.75rem; margin-bottom: 1.2rem;" disabled onclick="confirmAndSubmitRaid()">
                참여 인원을 입력해 주세요
            </button>

            <div style="padding: 0.9rem; background: var(--bg-input); border: 1px solid var(--border-color); border-radius: 8px;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;">
                    <label style="color: var(--accent-gold); font-weight: 800; margin-bottom: 0;">📋 현재 시간 등록된 참여 명단</label>
                    <button id="deleteEntireRaidBtn" class="btn btn-red hidden" style="padding: 0.25rem 0.6rem; font-size: 0.76rem;" onclick="deleteEntireRaid()">🗑️ 전체 삭제</button>
                </div>
                <div id="currentRegisteredInfo" style="font-size: 0.88rem; color: var(--text-muted);">조회 중...</div>
            </div>
        </div>
    </main>

    <!-- 근접 아이디 선택 모달 -->
    <div id="matchModal" class="modal-backdrop hidden">
        <div class="modal-content">
            <h3 class="section-title" style="font-size: 1rem;">🎯 혈맹원 아이디 선택</h3>
            <p id="modalTargetText" style="font-size: 0.84rem; color: var(--text-muted); margin-bottom: 0.7rem;"></p>
            <div id="candidateList" style="display: flex; flex-direction: column; gap: 0.4rem; max-height: 240px; overflow-y: auto;"></div>
            <div style="display: flex; justify-content: space-between; margin-top: 0.9rem;">
                <button class="btn btn-red" onclick="removeCurrentToken()">단어 삭제</button>
                <button class="btn btn-dark" onclick="closeModal()">닫기</button>
            </div>
        </div>
    </div>

    <script src="/static/common.js?v=7"></script>
    <script>
        let allMembers = [];
        let subCharToMainMap = {}; // 보조캐릭 -> 본캐릭 매핑
        let raidTimes = [];
        let selectedTime = "09시";
        let currentTargetDate = "";
        let dayRaidsCache = [];
        let parsedTokens = [];
        let editingTokenIndex = null;
        let currentRaidLogId = null;
        let isTimeBlocked = false;
        let blockReasonMessage = "";
        let editingTargetLeader = null;

        window.onload = async () => {
            const user = ClanApp.initPage('/raid-record', () => {
                editingTargetLeader = null;
                applyDateControlsUI();
                refreshDateAndRaids();
            });
            if (!user) return;

            applyDateControlsUI();
            setDayOffset(0, false);

            const [timeRes, memRes] = await Promise.all([
                fetch('/api/raids/times'),
                fetch('/api/auth/search-members')
            ]);
            raidTimes = (await timeRes.json()).times;
            allMembers = await memRes.json();

            // 보조캐릭 매핑 생성
            subCharToMainMap = {};
            allMembers.forEach(m => {
                (m.sub_chars || '').split(',').map(s => s.trim()).filter(Boolean).forEach(sub => {
                    subCharToMainMap[sub] = m.active_id;
                });
            });

            autoSelectCurrentRaidTime(new Date().getHours());
            await refreshDateAndRaids();
        };

        function applyDateControlsUI() {
            const isOn = ClanApp.isAdminModeOn;
            document.getElementById('adminDateControls').style.display = isOn ? 'flex' : 'none';
            document.getElementById('memberDateControls').style.display = isOn ? 'none' : 'flex';
        }

        function setDayOffset(offset, shouldRefresh = true) {
            const d = new Date();
            d.setDate(d.getDate() + offset);
            currentTargetDate = ClanApp.formatYMD(d);
            document.getElementById('raidMonth').value = ClanApp.formatYM(d);
            document.getElementById('raidDate').value = currentTargetDate;
            document.getElementById('memberSelectedDateText').textContent = currentTargetDate;

            document.getElementById('btnToday').classList.toggle('active', offset === 0);
            document.getElementById('btnYesterday').classList.toggle('active', offset === -1);
            if (shouldRefresh) refreshDateAndRaids();
        }

        function onAdminMonthChange() {
            const ym = document.getElementById('raidMonth').value;
            if (!ym) return;
            currentTargetDate = `${ym}-01`;
            document.getElementById('raidDate').value = currentTargetDate;
            refreshDateAndRaids();
        }

        function onAdminDateChange() {
            const val = document.getElementById('raidDate').value;
            if (!val) return;
            currentTargetDate = val;
            document.getElementById('raidMonth').value = val.slice(0, 7);
            refreshDateAndRaids();
        }

        function autoSelectCurrentRaidTime(currentHour) {
            const hourMap = [
                { h: 9, label: "09시" }, { h: 11, label: "11시" }, { h: 12, label: "12시" },
                { h: 13, label: "13시" }, { h: 15, label: "15시" }, { h: 17, label: "17시" },
                { h: 18, label: "18시" }, { h: 19, label: "19시" }, { h: 21, label: "21시" },
                { h: 22, label: "22시(오만)" }, { h: 23, label: "23시" }, { h: 24, label: "24시" },
                { h: 1, label: "01시" }, { h: 3, label: "03시" }, { h: 5, label: "05시" }, { h: 7, label: "07시" }
            ];
            let best = hourMap[0].label, minDiff = 99;
            hourMap.forEach(item => {
                const compareH = item.h === 24 ? 0 : item.h;
                let diff = Math.abs(currentHour - compareH);
                if (diff > 12) diff = 24 - diff;
                if (diff < minDiff) { minDiff = diff; best = item.label; }
            });
            selectedTime = best;
            document.getElementById('selectedTimeViewAdmin').value = best;
            document.getElementById('selectedTimeViewMember').value = best;
        }

        function getTimeDiffHours(dateStr, timeLabel) {
            const m = timeLabel.match(/\d+/);
            const raidHour = m ? parseInt(m[0], 10) : 9;
            let dt;
            if (timeLabel.includes('24')) {
                dt = new Date(`${dateStr}T00:00:00`);
                dt.setDate(dt.getDate() + 1);
            } else {
                dt = new Date(`${dateStr}T${String(raidHour).padStart(2, '0')}:00:00`);
            }
            return (new Date() - dt) / (1000 * 60 * 60);
        }

        async function refreshDateAndRaids() {
            const res = await fetch(`/api/raids?date=${currentTargetDate}`);
            dayRaidsCache = await res.json();
            renderTimeGrid();
            checkExistingRaid();
        }

        function renderTimeGrid() {
            const grid = document.getElementById('timeGrid');
            grid.innerHTML = '';
            const completed = new Set(
                dayRaidsCache.filter(r => (r.parties && r.parties.length > 0) || (r.dropped_items && r.dropped_items.trim())).map(r => r.raid_time)
            );

            raidTimes.forEach(t => {
                const div = document.createElement('div');
                const diff = getTimeDiffHours(currentTargetDate, t);
                const classes = ['time-box'];
                if (t === selectedTime) classes.push('selected');
                if (diff < 0) classes.push('future-slot');
                else if (diff <= 3) classes.push('available-slot');
                if (completed.has(t)) classes.push('completed-slot');

                div.className = classes.join(' ');
                div.textContent = t;
                div.onclick = () => {
                    selectedTime = t;
                    document.getElementById('selectedTimeViewAdmin').value = t;
                    document.getElementById('selectedTimeViewMember').value = t;
                    editingTargetLeader = null;
                    renderTimeGrid();
                    checkExistingRaid();
                };
                grid.appendChild(div);
            });
        }

        function checkExistingRaid() {
            const diff = getTimeDiffHours(currentTargetDate, selectedTime);
            const noticeBox = document.getElementById('timeLimitNotice');
            const inputWrapper = document.getElementById('inputSectionWrapper');

            if (diff < 0 && !ClanApp.isAdminModeOn) {
                isTimeBlocked = true;
                blockReasonMessage = "⏳ 아직 진행 전인 보스탐 시간입니다.";
                document.getElementById('timeLimitTitle').textContent = blockReasonMessage;
                document.getElementById('timeLimitSub').textContent = "보스탐 시작 후 입력할 수 있습니다.";
                noticeBox.classList.remove('hidden');
                inputWrapper.style.opacity = '0.4';
                inputWrapper.style.pointerEvents = 'none';
            } else if (!ClanApp.isAdminModeOn && diff > 3) {
                isTimeBlocked = true;
                blockReasonMessage = "⏳ 입력 제한 시간(3시간)이 지났습니다.";
                document.getElementById('timeLimitTitle').textContent = blockReasonMessage;
                document.getElementById('timeLimitSub').textContent = ClanApp.hasAdminPrivilege
                    ? "상단의 [👑 관리자 모드]를 켜면 입력/수정이 가능합니다."
                    : "추가 등록은 관리자에게 문의하세요.";
                noticeBox.classList.remove('hidden');
                inputWrapper.style.opacity = '0.4';
                inputWrapper.style.pointerEvents = 'none';
            } else {
                isTimeBlocked = false;
                blockReasonMessage = "";
                noticeBox.classList.add('hidden');
                inputWrapper.style.opacity = '1';
                inputWrapper.style.pointerEvents = 'auto';
            }

            const existingRow = dayRaidsCache.find(r => r.raid_time === selectedTime);
            const infoBox = document.getElementById('currentRegisteredInfo');
            const delAllBtn = document.getElementById('deleteEntireRaidBtn');

            if (existingRow) {
                currentRaidLogId = existingRow.id;
                delAllBtn.classList.toggle('hidden', !ClanApp.isAdminModeOn);
                const parties = existingRow.parties || [];
                if (parties.length > 0) {
                    infoBox.innerHTML = parties.map(p => {
                        const leader = p.leader;
                        const others = (p.members || []).filter(m => m !== leader);
                        const fullLine = [leader, ...others].join(' ');
                        const adminBtns = ClanApp.isAdminModeOn ? `
                            <div class="admin-action-btns">
                                <button class="btn btn-blue" style="padding:0.2rem 0.5rem; font-size:0.74rem;" onclick="loadPartyToEdit('${leader}', '${fullLine}')">수정</button>
                                <button class="btn btn-red" style="padding:0.2rem 0.5rem; font-size:0.74rem;" onclick="deleteSingleParty('${leader}')">삭제</button>
                            </div>` : '';
                        return `<div class="party-card">
                            <span class="party-text-line"><span class="party-leader-soft-green">${leader}</span> ${others.join(' ')}</span>
                            ${adminBtns}
                        </div>`;
                    }).join('');
                } else {
                    infoBox.innerHTML = `<span style="color:var(--text-muted);">등록된 파티 명단이 없습니다.</span>`;
                }
            } else {
                currentRaidLogId = null;
                delAllBtn.classList.add('hidden');
                infoBox.innerHTML = `<span style="color:var(--text-muted);">아직 등록된 기록이 없습니다.</span>`;
            }
            updateSubmitButtonState();
        }

        function loadPartyToEdit(leader, fullLine) {
            editingTargetLeader = leader;
            document.getElementById('participantInputText').value = fullLine;
            parseAndMatchTokens();
        }

        async function deleteSingleParty(leader) {
            if (!confirm(`[${leader}] 파티를 삭제하시겠습니까?`)) return;
            const res = await fetch(`/api/raids/party?date=${currentTargetDate}&time=${encodeURIComponent(selectedTime)}&leader=${encodeURIComponent(leader)}&role=${encodeURIComponent(ClanApp.role)}`, { method: 'DELETE' });
            if (res.ok) await refreshDateAndRaids();
        }

        async function deleteEntireRaid() {
            if (!currentRaidLogId || !confirm(`[${selectedTime}] 전체 기록을 삭제하시겠습니까?`)) return;
            const res = await fetch(`/api/raids/${currentRaidLogId}?role=${encodeURIComponent(ClanApp.role)}`, { method: 'DELETE' });
            if (res.ok) { clearInputBox(); await refreshDateAndRaids(); }
        }

        function clearInputBox() {
            editingTargetLeader = null;
            document.getElementById('participantInputText').value = '';
            parsedTokens = [];
            renderTokens();
        }

        function getSimilarity(a, b) {
            const m = Array.from({ length: a.length + 1 }, (_, i) => [i]);
            for (let j = 1; j <= b.length; j++) m[0][j] = j;
            for (let i = 1; i <= a.length; i++) {
                for (let j = 1; j <= b.length; j++) {
                    m[i][j] = Math.min(m[i - 1][j] + 1, m[i][j - 1] + 1, m[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
                }
            }
            return m[a.length][b.length];
        }

        function parseAndMatchTokens() {
            const text = document.getElementById('participantInputText').value;
            const words = text.split(/[\s,，\n]+/).map(w => w.trim()).filter(Boolean);
            const activeIds = allMembers.map(m => m.active_id);

            parsedTokens = words.map(w => {
                // 본캐릭 일치 또는 보조캐릭 일치 확인
                if (activeIds.includes(w)) {
                    return { raw: w, matchedId: w, isMatched: true };
                }
                if (subCharToMainMap[w]) {
                    return { raw: w, matchedId: subCharToMainMap[w], isMatched: true };
                }
                let best = null, minScore = 999;
                allMembers.forEach(m => {
                    const sc = getSimilarity(w, m.active_id);
                    if (sc < minScore) { minScore = sc; best = m.active_id; }
                });
                return { raw: w, matchedId: best, isMatched: false };
            });
            renderTokens();
        }

        function determinePartyLeader(ids) {
            if (editingTargetLeader) return editingTargetLeader;
            if (ids.includes(ClanApp.user.active_id)) return ClanApp.user.active_id;
            return ids[0] || ClanApp.user.active_id;
        }

        function renderTokens() {
            const container = document.getElementById('tokenContainer');
            container.innerHTML = '';
            if (parsedTokens.length === 0) {
                container.innerHTML = '<span style="color:var(--text-muted); font-size:0.82rem;">참여자 아이디를 입력하면 매칭 결과가 표시됩니다.</span>';
                updateSubmitButtonState();
                return;
            }

            const matchedIds = parsedTokens.filter(t => t.isMatched).map(t => t.matchedId);
            const leader = determinePartyLeader(matchedIds);

            parsedTokens.forEach((tk, idx) => {
                const span = document.createElement('span');
                span.className = `ocr-token ${tk.isMatched ? 'matched' : 'unmatched'}`;
                if (tk.isMatched) {
                    const subLabel = tk.raw !== tk.matchedId ? `(${tk.raw})` : '';
                    span.innerHTML = `${tk.matchedId === leader ? '[파티장] ' : ''}${tk.matchedId}${subLabel} <small onclick="deleteToken(event, ${idx})">✕</small>`;
                } else {
                    span.innerHTML = `❗ ${tk.raw} ➡️ <b>${tk.matchedId || '선택'}</b>`;
                }
                span.onclick = () => openCandidateModal(idx);
                container.appendChild(span);
            });
            updateSubmitButtonState();
        }

        function deleteToken(e, idx) {
            e.stopPropagation();
            parsedTokens.splice(idx, 1);
            document.getElementById('participantInputText').value = parsedTokens.map(t => t.matchedId).join(' ');
            renderTokens();
        }

        function openCandidateModal(idx) {
            editingTokenIndex = idx;
            const raw = parsedTokens[idx].raw;
            document.getElementById('modalTargetText').textContent = `[${raw}] 에 매칭할 캐릭터를 선택하세요:`;
            const sorted = [...allMembers].sort((a, b) => getSimilarity(raw, a.active_id) - getSimilarity(raw, b.active_id));
            const list = document.getElementById('candidateList');
            list.innerHTML = '';
            sorted.forEach((m, i) => {
                const btn = document.createElement('button');
                btn.className = `btn ${i === 0 ? 'btn-primary' : 'btn-dark'}`;
                btn.style.justifyContent = 'flex-start';
                btn.textContent = `${i === 0 ? '⭐ ' : ''}${m.active_id} (${m.char_class}${m.sub_chars ? ' / 보조:' + m.sub_chars : ''})`;
                btn.onclick = () => {
                    parsedTokens[editingTokenIndex].matchedId = m.active_id;
                    parsedTokens[editingTokenIndex].isMatched = true;
                    closeModal();
                    document.getElementById('participantInputText').value = parsedTokens.map(t => t.matchedId).join(' ');
                    renderTokens();
                };
                list.appendChild(btn);
            });
            document.getElementById('matchModal').classList.remove('hidden');
        }

        function removeCurrentToken() {
            if (editingTokenIndex !== null) {
                parsedTokens.splice(editingTokenIndex, 1);
                closeModal();
                document.getElementById('participantInputText').value = parsedTokens.map(t => t.matchedId).join(' ');
                renderTokens();
            }
        }

        function closeModal() {
            document.getElementById('matchModal').classList.add('hidden');
            editingTokenIndex = null;
        }

        function updateSubmitButtonState() {
            const btn = document.getElementById('submitRaidBtn');
            if (isTimeBlocked) {
                btn.disabled = true;
                btn.textContent = blockReasonMessage;
                return;
            }
            if (parsedTokens.length > 0 && parsedTokens.every(t => t.isMatched)) {
                const ids = parsedTokens.map(t => t.matchedId);
                const leader = determinePartyLeader(ids);
                const count = new Set([leader, ...ids]).size;
                btn.disabled = false;
                btn.textContent = `✅ 등록하기 (파티장: ${leader} / 총 ${count}명)`;
            } else {
                btn.disabled = true;
                btn.textContent = parsedTokens.length > 0 ? '빨간색 미매칭 아이디를 클릭해 수정해 주세요' : '참여 인원을 입력해 주세요';
            }
        }

        async function confirmAndSubmitRaid() {
            if (isTimeBlocked) return;
            const ids = parsedTokens.map(t => t.matchedId);
            const leader = determinePartyLeader(ids);
            const uniqueMembers = Array.from(new Set([leader, ...ids]));
            const existingRow = dayRaidsCache.find(r => r.raid_time === selectedTime);

            if (!confirm(`[${currentTargetDate} ${selectedTime}]\n파티장: ${leader} (총 ${uniqueMembers.length}명)\n등록하시겠습니까?`)) return;

            const res = await fetch('/api/raids', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    raid_date: currentTargetDate,
                    raid_time: selectedTime,
                    parties: [{ leader, members: uniqueMembers }],
                    dropped_items: existingRow ? (existingRow.dropped_items || '') : '',
                    requester_role: ClanApp.isAdminModeOn ? ClanApp.role : '일반회원',
                    requester_id: ClanApp.user.active_id
                })
            });

            if (res.ok) {
                alert('등록되었습니다!');
                clearInputBox();
                await refreshDateAndRaids();
            } else {
                const err = await res.json();
                alert(err.detail || '저장 실패');
            }
        }
    </script>
</body>
</html>
