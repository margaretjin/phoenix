<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>분배관리 - 혈맹 보스탐 체크기</title>
    <link rel="stylesheet" href="/static/common.css?v=48">
    <link rel="stylesheet" href="/static/distribution.css?v=47">
</head>
<body>
    <nav class="navbar" id="appNavbar"></nav>

    <main class="main-container">
        <!-- 상단 타이틀 & 관리자 전용 엑셀 다운로드 -->
        <div class="top-bar">
            <h1 class="page-title">💰 보스탐 분배관리</h1>
            <div class="excel-btn-group admin-only">
                <button type="button" class="btn-excel-sm" onclick="exportDistExcel('day')">📥 일별</button>
                <button type="button" class="btn-excel-sm" onclick="exportDistExcel('week')">주별(+7일)</button>
                <button type="button" class="btn-excel-sm" onclick="exportDistExcel('month')">월별</button>
            </div>
        </div>

        <!-- 1. 상단 조회 기준 : 월별 디폴트 -->
        <section class="card-box">
            <div class="dist-filter-grid">
                <div class="dist-filter-field">
                    <label>조회기준 : 혈분배일</label>
                    <select id="distPeriodMode" class="input-common" onchange="onPeriodModeChange()">
                        <option value="month" selected>월별</option>
                        <option value="all">전체 기간</option>
                        <option value="week">주별 (+7일)</option>
                        <option value="day">일별</option>
                    </select>
                </div>

                <div id="distMonthBox" class="dist-filter-field">
                    <label>혈분배 월 선택</label>
                    <input type="month" id="distMonthFilter" class="input-common" onchange="onTopMonthOrDateFilterChange()">
                </div>

                <div id="distAllBox" class="dist-filter-field hidden">
                    <label>혈분배일 범위</label>
                    <input type="text" class="input-common" value="전체 분배 내역" disabled>
                </div>

                <div id="distDateBox" class="dist-filter-field hidden">
                    <label><span id="distDateLabel">혈분배일 선택</span><span id="topWeekRangeHint" class="week-range-hint"></span></label>
                    <input type="date" id="distDateFilter" class="input-common" onchange="onTopMonthOrDateFilterChange()">
                </div>

                <div class="dist-filter-field">
                    <label>아이템 상태 보기</label>
                    <select id="distStatusFilter" class="input-common" onchange="onItemStatusFilterChange(this.value)">
                        <option value="all">전체 분배</option>
                        <option value="wait">분배 대기</option>
                        <option value="done">분배 완료</option>
                    </select>
                </div>

                <div class="dist-filter-field">
                    <label>분배 아이템 검색</label>
                    <input type="search" id="distItemSearch" class="input-common" placeholder="아이템명 검색" oninput="renderAllDistViews()">
                </div>
            </div>
        </section>

        <!-- 2. 💎 분배해야 할 아이템 및 혈분배일 설정 -->
        <section class="card-box">
            <div class="checked-item-header">
                <span class="section-label">💎 분배해야 할 아이템 및 혈분배일 설정</span>
                <div class="status-tab-bar">
                    <button type="button" id="tabBtn_all" class="status-tab-btn active" onclick="setItemStatusFilter('all')">전체 분배</button>
                    <button type="button" id="tabBtn_wait" class="status-tab-btn" onclick="setItemStatusFilter('wait')">분배 대기</button>
                    <button type="button" id="tabBtn_done" class="status-tab-btn" onclick="setItemStatusFilter('done')">분배 완료</button>
                </div>
            </div>

            <div class="dist-table-wrap">
                <table class="checked-item-table">
                    <thead>
                        <tr>
                            <th>획득일시</th>
                            <th>아이템</th>
                            <th>가격</th>
                            <th>혈비제외가</th>
                            <th>인당분배금</th>
                            <th>분배인원</th>
                            <th>분배상태</th>
                            <th>혈분배일</th>
                            <th id="checkedItemSaveHeader" class="hidden">관리</th>
                        </tr>
                    </thead>
                    <tbody id="checkedItemTableBody">
                        <tr><td colspan="9" class="empty-party-msg">불러오는 중...</td></tr>
                    </tbody>
                </table>
            </div>
        </section>

        <!-- 3. 혈분배일 선택 (기준일) 칩 리스트 + 요약 KPI 5칸 -->
        <section class="card-box">
            <div class="dist-date-selector-bar">
                <div class="dist-date-selector-top">
                    <span class="dist-date-selector-title">📅 혈분배일 선택 (해당 월 기준 목록)</span>
                    <span id="distDateCountHint" class="dist-date-selector-sub">혈분배일 0회</span>
                </div>
                <div id="distDateChipContainer" class="dist-date-chips-wrap"></div>
            </div>

            <div class="dist-kpi-strip-5">
                <div class="dist-kpi-box">
                    <div class="dist-kpi-label">현재 선택된 혈분배일</div>
                    <div id="kpiSelectedDateText" class="dist-kpi-val selected-date">전체보기</div>
                </div>
                <div class="dist-kpi-box">
                    <div class="dist-kpi-label">혈비 제외 총 분배금</div>
                    <div id="kpiNetPoolTotal" class="dist-kpi-val net-pool">0</div>
                </div>
                <div class="dist-kpi-box">
                    <div class="dist-kpi-label">분배 하는 템 (선택 기준)</div>
                    <div id="kpiDistItemsList" class="dist-kpi-val items-list">-</div>
                </div>
                <div class="dist-kpi-box">
                    <div class="dist-kpi-label">분배 완료 인원</div>
                    <div id="kpiDoneCount" class="dist-kpi-val done">0명</div>
                </div>
                <div class="dist-kpi-box">
                    <div class="dist-kpi-label">미분배 인원</div>
                    <div id="kpiWaitCount" class="dist-kpi-val wait">0명</div>
                </div>
            </div>
        </section>

        <!-- 4. 👥 참여자별 개별 분배금 수령 현황 -->
        <section class="card-box">
            <div class="dist-member-header">
                <span class="section-label">👥 참여자별 개별 분배금 수령 현황</span>
                <div id="distBulkActionBox" class="admin-only">
                    <button type="button" class="btn-sm btn-sm-blue" onclick="markAllMergedParticipantsDone()">✔ 전체 분배 완료</button>
                </div>
            </div>

            <div class="dist-member-oneline-bar">
                <input type="search" id="participantSearchInput" class="input-common member-search-left"
                       placeholder="캐릭/아이템 검색" oninput="renderMergedParticipantsTable()">
                <div class="status-tab-bar">
                    <button type="button" id="memTab_all" class="status-tab-btn" onclick="setMemberStatusFilter('all')">전체 보기</button>
                    <button type="button" id="memTab_wait" class="status-tab-btn active" onclick="setMemberStatusFilter('wait')">분배 대기</button>
                    <button type="button" id="memTab_done" class="status-tab-btn" onclick="setMemberStatusFilter('done')">분배 완료</button>
                </div>
            </div>

            <div class="dist-table-wrap dist-member-table-wrap">
                <table class="dist-member-table">
                    <thead>
                        <tr>
                            <th>참여캐릭</th>
                            <th>분배 아이템 (개별 분배금)</th>
                            <th>1인당<br>분배금</th>
                            <th>분배<br>상태</th>
                            <th>수령방식</th>
                            <th>수령 아이디<br><span class="th-sub-label">(본캐/쫄/대리)</span></th>
                            <th>분배받아간일</th>
                        </tr>
                    </thead>
                    <tbody id="distParticipantTableBody">
                        <tr><td colspan="7" class="empty-party-msg">분배할 아이템 내역이 없습니다.</td></tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="/static/common.js?v=48"></script>
    <script>
        let currentTaxRate = 20;
        let itemPriceMap = {};
        let memberSubMap = {};
        let clanCharPool = [];
        let allRaids = [];
        let checkedEntries = [];
        let editingDistDateKeys = new Set();
        let unlockedMembers = new Set();
        let expandedItemMembers = new Set();
        let memberInputDrafts = {};
        let memberStatusFilter = 'wait';
        let activeReceiverSuggestIdx = {};
        let selectedKpiDistDate = 'all';

        window.onload = async () => {
            const user = ClanApp.initPage('/distribution', () => {
                applyDistAdminUI();
                renderAllDistViews();
            });
            if (!user) return;

            const now = new Date();
            const todayStr = ClanApp.formatYMD(now);
            const ymStr = ClanApp.formatYM(now);

            document.getElementById('distMonthFilter').value = ymStr;
            document.getElementById('distDateFilter').value = todayStr;

            document.addEventListener('click', (e) => {
                if (!e.target.closest('.receiver-autocomplete-wrap')) {
                    document.querySelectorAll('.receiver-suggest-list').forEach(el => el.classList.add('hidden'));
                }
            });

            await Promise.all([loadTaxRate(), loadItemMasterPrices(), loadMembersSubChars()]);
            applyDistAdminUI();
            await loadAllRaidsForDistribution();
        };

        function toShortDate(dateStr) {
            if (!dateStr || dateStr.length < 8) return '-';
            return dateStr.length >= 10 ? dateStr.slice(2, 10) : dateStr;
        }

        function getPlusSevenDaysRange(startDateStr) {
            const [y, m, d] = startDateStr.split('-').map(Number);
            const startObj = new Date(y, m - 1, d);
            const endObj = new Date(y, m - 1, d + 7);
            const start = ClanApp.formatYMD(startObj);
            const end = ClanApp.formatYMD(endObj);
            const shortLabel = `${start.slice(2).replace(/-/g, '.')}~${end.slice(2).replace(/-/g, '.')}`;
            return { start, end, shortLabel };
        }

        async function loadTaxRate() {
            try {
                const res = await fetch('/api/raids/tax-rate');
                currentTaxRate = Number((await res.json()).tax_rate ?? 20);
            } catch (e) {
                currentTaxRate = 20;
            }
        }

        async function loadItemMasterPrices() {
            itemPriceMap = {};
            try {
                const res = await fetch('/api/items');
                if (!res.ok) return;
                const items = await res.json();
                ClanApp.setItemAliases(items);
                items.forEach(it => {
                    if (it.item_name) itemPriceMap[it.item_name] = Number(it.default_price || 0);
                });
            } catch (e) {
                itemPriceMap = {};
            }
        }

        async function loadMembersSubChars() {
            memberSubMap = {};
            clanCharPool = [];
            const seenChar = new Set();

            try {
                const res = await fetch('/api/auth/search-members');
                if (!res.ok) return;
                const members = await res.json();
                members.forEach(m => {
                    const mainId = (m.active_id || '').trim();
                    const cClass = m.char_class || '';
                    if (!mainId) return;

                    const subs = (m.sub_chars || '').split(',').map(s => s.trim()).filter(Boolean);
                    const ownList = [
                        {
                            charId: mainId,
                            labelInfo: `${cClass} · 본캐`,
                            searchKey: `${mainId} ${subs.join(' ')}`.toLowerCase()
                        },
                        ...subs.map(subId => ({
                            charId: subId,
                            labelInfo: `쫄 (본캐: ${mainId})`,
                            searchKey: `${subId} ${mainId}`.toLowerCase()
                        }))
                    ];
                    memberSubMap[mainId] = ownList;

                    ownList.forEach(entry => {
                        const low = entry.charId.toLowerCase();
                        if (!seenChar.has(low)) {
                            seenChar.add(low);
                            clanCharPool.push(entry);
                        }
                    });
                });
            } catch (e) {
                memberSubMap = {};
                clanCharPool = [];
            }
        }

        function applyDistAdminUI() {
            const isOn = ClanApp.isAdminModeOn;
            document.getElementById('checkedItemSaveHeader').classList.toggle('hidden', !isOn);
        }

        function onPeriodModeChange() {
            const mode = document.getElementById('distPeriodMode').value;
            const allBox = document.getElementById('distAllBox');
            const monthBox = document.getElementById('distMonthBox');
            const dateBox = document.getElementById('distDateBox');
            const dateLabel = document.getElementById('distDateLabel');
            const hintEl = document.getElementById('topWeekRangeHint');

            allBox.classList.add('hidden');
            monthBox.classList.add('hidden');
            dateBox.classList.add('hidden');
            hintEl.textContent = '';

            if (mode === 'all') {
                allBox.classList.remove('hidden');
            } else if (mode === 'month') {
                monthBox.classList.remove('hidden');
            } else if (mode === 'week') {
                dateLabel.textContent = '주간 시작일';
                dateBox.classList.remove('hidden');
                updateTopWeekHint();
            } else {
                dateLabel.textContent = '혈분배일 선택';
                dateBox.classList.remove('hidden');
            }
            selectedKpiDistDate = 'all';
            renderAllDistViews();
        }

        function onTopMonthOrDateFilterChange() {
            updateTopWeekHint();
            selectedKpiDistDate = 'all';
            renderAllDistViews();
        }

        function updateTopWeekHint() {
            const mode = document.getElementById('distPeriodMode').value;
            const hintEl = document.getElementById('topWeekRangeHint');
            if (mode !== 'week') {
                hintEl.textContent = '';
                return;
            }
            const dVal = document.getElementById('distDateFilter').value || ClanApp.formatYMD(new Date());
            const { shortLabel } = getPlusSevenDaysRange(dVal);
            hintEl.textContent = `(${shortLabel})`;
        }

        function setItemStatusFilter(statusVal) {
            document.getElementById('distStatusFilter').value = statusVal;
            syncItemStatusTabUI(statusVal);
            renderAllDistViews();
        }

        function onItemStatusFilterChange(statusVal) {
            syncItemStatusTabUI(statusVal);
            renderAllDistViews();
        }

        function syncItemStatusTabUI(statusVal) {
            ['all', 'wait', 'done'].forEach(k => {
                const btn = document.getElementById(`tabBtn_${k}`);
                if (btn) btn.classList.toggle('active', k === statusVal);
            });
        }

        function setMemberStatusFilter(statusVal) {
            memberStatusFilter = statusVal;
            ['all', 'wait', 'done'].forEach(k => {
                const btn = document.getElementById(`memTab_${k}`);
                if (btn) btn.classList.toggle('active', k === statusVal);
            });
            renderMergedParticipantsTable();
        }

        async function loadAllRaidsForDistribution() {
            const res = await fetch('/api/raids');
            allRaids = await res.json();
            buildCheckedEntries();
            renderAllDistViews();
        }

        function buildCheckedEntries() {
            checkedEntries = [];
            allRaids.forEach(r => {
                const details = ClanApp.extractItemDetails(r, itemPriceMap);
                const participants = ClanApp.extractParticipants(r);
                const pCount = participants.length;
                const distMap = r.distributions || {};

                let doneMemberCount = 0;
                participants.forEach(p => {
                    if ((distMap[p.id] || {}).status === '분배완료') doneMemberCount++;
                });
                const isFullyDone = (pCount > 0 && doneMemberCount === pCount);

                details.forEach((item, idx) => {
                    if (!item.dist_checked) return;

                    const price = Number(item.price || 0);
                    const netPool = Math.floor(price * (1 - currentTaxRate / 100));
                    const perItemShare = (pCount > 0 && netPool > 0) ? Math.floor(netPool / pCount) : 0;

                    checkedEntries.push({
                        key: `${r.id}_${idx}`,
                        raid_id: r.id,
                        item_idx: idx,
                        raid_date: r.raid_date,
                        raid_time: r.raid_time,
                        name: item.name,
                        price,
                        net_pool: netPool,
                        per_share: perItemShare,
                        dist_date: (item.dist_date || '').trim(),
                        is_done: isFullyDone,
                        done_count: doneMemberCount,
                        participants,
                        raid_ref: r,
                        full_details_ref: details
                    });
                });
            });
        }

        function getPeriodFilteredEntries() {
            const mode = document.getElementById('distPeriodMode').value;
            const mVal = document.getElementById('distMonthFilter').value || ClanApp.formatYM(new Date());
            const dVal = document.getElementById('distDateFilter').value || ClanApp.formatYMD(new Date());
            const kw = document.getElementById('distItemSearch').value.trim().toLowerCase();
            const todayStr = ClanApp.formatYMD(new Date());

            return checkedEntries.filter(entry => {
                const effectiveDistDate = entry.dist_date || todayStr;

                if (mode === 'month') {
                    if (!effectiveDistDate.startsWith(mVal)) return false;
                } else if (mode === 'week') {
                    const { start, end } = getPlusSevenDaysRange(dVal);
                    if (effectiveDistDate < start || effectiveDistDate > end) return false;
                } else if (mode === 'day') {
                    if (effectiveDistDate !== dVal) return false;
                }

                if (kw) {
                    const matchItem = entry.name.toLowerCase().includes(kw);
                    const matchMember = entry.participants.some(p => p.id.toLowerCase().includes(kw));
                    if (!matchItem && !matchMember) return false;
                }
                return true;
            });
        }

        function getStatusFilteredEntries() {
            const statusFilter = document.getElementById('distStatusFilter').value;
            const baseList = getPeriodFilteredEntries();

            return baseList.filter(entry => {
                if (statusFilter === 'wait') return !entry.is_done;
                if (statusFilter === 'done') return entry.is_done;
                return true;
            });
        }

        function renderDistDateSelectorChips() {
            const periodList = getPeriodFilteredEntries();
            const dateCountMap = new Map();
            let unconfirmedCount = 0;

            periodList.forEach(e => {
                if (e.dist_date) {
                    dateCountMap.set(e.dist_date, (dateCountMap.get(e.dist_date) || 0) + 1);
                } else {
                    unconfirmedCount++;
                }
            });

            const sortedDates = [...dateCountMap.keys()].sort((a, b) => b.localeCompare(a));

            if (selectedKpiDistDate !== 'all' && selectedKpiDistDate !== 'unconfirmed' && !dateCountMap.has(selectedKpiDistDate)) {
                selectedKpiDistDate = 'all';
            }
            if (selectedKpiDistDate === 'unconfirmed' && unconfirmedCount === 0) {
                selectedKpiDistDate = 'all';
            }

            document.getElementById('distDateCountHint').textContent =
                `조회 기간 내 혈분배일 총 ${sortedDates.length}회 (아이템 ${periodList.length}건)`;

            const chipsHtml = [];

            chipsHtml.push(`
                <button type="button" class="dist-date-chip ${selectedKpiDistDate === 'all' ? 'active' : ''}"
                        onclick="selectKpiDistDateChip('all')">
                    <span>전체보기</span>
                    <span class="chip-cnt">${periodList.length}건</span>
                </button>
            `);

            sortedDates.forEach(dStr => {
                const cnt = dateCountMap.get(dStr);
                chipsHtml.push(`
                    <button type="button" class="dist-date-chip ${selectedKpiDistDate === dStr ? 'active' : ''}"
                            onclick="selectKpiDistDateChip('${dStr}')">
                        <span>${toShortDate(dStr)}</span>
                        <span class="chip-cnt">${cnt}건</span>
                    </button>
                `);
            });

            if (unconfirmedCount > 0) {
                chipsHtml.push(`
                    <button type="button" class="dist-date-chip ${selectedKpiDistDate === 'unconfirmed' ? 'active' : ''}"
                            onclick="selectKpiDistDateChip('unconfirmed')">
                        <span>미확정</span>
                        <span class="chip-cnt">${unconfirmedCount}건</span>
                    </button>
                `);
            }

            document.getElementById('distDateChipContainer').innerHTML = chipsHtml.join('');
        }

        function selectKpiDistDateChip(targetVal) {
            selectedKpiDistDate = targetVal;
            expandedItemMembers.clear();
            renderDistDateSelectorChips();
            renderFiveKpiSummary();
            renderMergedParticipantsTable();
        }

        function getSelectedKpiDateEntries() {
            const periodList = getPeriodFilteredEntries();
            if (selectedKpiDistDate === 'all') {
                return periodList;
            }
            if (selectedKpiDistDate === 'unconfirmed') {
                return periodList.filter(e => !e.dist_date);
            }
            return periodList.filter(e => e.dist_date === selectedKpiDistDate);
        }

        function renderAllDistViews() {
            renderCheckedItemsTable();
            renderDistDateSelectorChips();
            renderFiveKpiSummary();
            renderMergedParticipantsTable();
        }

        function renderCheckedItemsTable() {
            const list = getStatusFilteredEntries();
            const tbody = document.getElementById('checkedItemTableBody');
            const isAdmin = ClanApp.isAdminModeOn;
            const defaultInputDate = (selectedKpiDistDate !== 'all' && selectedKpiDistDate !== 'unconfirmed')
                ? selectedKpiDistDate
                : ClanApp.formatYMD(new Date());

            if (list.length === 0) {
                tbody.innerHTML = `<tr><td colspan="${isAdmin ? 9 : 8}" class="empty-party-msg">해당 조건의 분배 아이템 내역이 없습니다.</td></tr>`;
                return;
            }

            tbody.innerHTML = list.map(entry => {
                const pCount = entry.participants.length;
                const hasDistDate = Boolean(entry.dist_date && entry.dist_date.trim());
                const isEditingDate = editingDistDateKeys.has(entry.key);
                const dateVal = entry.dist_date || defaultInputDate;
                const slotText = `${toShortDate(entry.raid_date)} ${entry.raid_time}`;
                const shortDistDate = hasDistDate ? toShortDate(entry.dist_date) : '미확정';

                const statusBadgeHtml = entry.is_done
                    ? `<span class="status-badge-done">분배완료 (${entry.done_count}/${pCount})</span>`
                    : `<span class="status-badge-wait">분배대기 (${entry.done_count}/${pCount})</span>`;

                if (!isAdmin) {
                    return `
                        <tr>
                            <td class="checked-item-slot">${slotText}</td>
                            <td class="checked-item-name">${ClanApp.itemNameHtml(entry.name)}</td>
                            <td class="checked-item-price">${entry.price.toLocaleString()}</td>
                            <td class="checked-item-net-price">${entry.net_pool.toLocaleString()}</td>
                            <td style="color:#fbbf24; font-weight:800;">${entry.per_share.toLocaleString()}</td>
                            <td class="checked-item-pcount">${pCount}명</td>
                            <td>${statusBadgeHtml}</td>
                            <td>${hasDistDate ? `<span class="confirmed-dist-date">${shortDistDate}</span>` : '미확정'}</td>
                        </tr>
                    `;
                }

                // [수정] 평소에는 [수정] 버튼만 노출, 수정 모드일 때만 [저장]과 [초기화] 노출
                if (hasDistDate && !isEditingDate) {
                    return `
                        <tr>
                            <td class="checked-item-slot">${slotText}</td>

        async function saveCheckedItemDistDate(key) {
            if (!ClanApp.isAdminModeOn) return;

            if (!entry) return;

            const dateEl = document.getElementById(`chkDistDate_${key}`);
            const dist_date = (dateEl && dateEl.value) ? dateEl.value : ClanApp.formatYMD(new Date());
            selectedKpiDistDate = dist_date;

            const updatedDetails = entry.full_details_ref.map((it, idx) => ({

                sale_type: it.sale_type || '보유중',

                winner: it.winner || '',
                taken_date: it.taken_date || '',
                dist_date: idx === entry.item_idx ? dist_date : (it.dist_date || ''),
                dist_checked: idx === entry.item_idx ? true : Boolean(it.dist_checked)
            }));

            const res = await fetch('/api/raids/item-details', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    raid_id: entry.raid_id,
                    item_details: updatedDetails,
                    requester_role: ClanApp.role

            if (res.ok) {

        function renderFiveKpiSummary() {
            const dateMatchedEntries = getSelectedKpiDateEntries();

            let selectedLabel = '전체보기';
            if (selectedKpiDistDate === 'unconfirmed') selectedLabel = '미확정 아이템';
            else if (selectedKpiDistDate !== 'all') selectedLabel = toShortDate(selectedKpiDistDate);
            document.getElementById('kpiSelectedDateText').textContent = selectedLabel;

            const totalNetPool = dateMatchedEntries.reduce((acc, e) => acc + Number(e.net_pool || 0), 0);
            document.getElementById('kpiNetPoolTotal').textContent = totalNetPool.toLocaleString();

            if (dateMatchedEntries.length === 0) {
                document.getElementById('kpiDistItemsList').textContent = '해당 기준 아이템 없음';
            } else {
                const countMap = new Map();
                dateMatchedEntries.forEach(e => countMap.set(e.name, (countMap.get(e.name) || 0) + 1));
                const itemsHtml = [...countMap.entries()]
                    .map(([n, c]) => `${ClanApp.itemNameHtml(n)}${c > 1 ? ` ×${c}` : ''}`)
                    .join(', ');
                document.getElementById('kpiDistItemsList').innerHTML = itemsHtml;
            }

            const allMemberStatus = new Map();
            dateMatchedEntries.forEach(entry => {
                const distObj = entry.raid_ref.distributions || {};
                entry.participants.forEach(p => {
                    const isDone = (distObj[p.id] || {}).status === '분배완료';
                    if (!allMemberStatus.has(p.id)) {
                        allMemberStatus.set(p.id, isDone);
                    } else if (!isDone) {
                        allMemberStatus.set(p.id, false);
                    }
                });
            });

            let done = 0;
            let wait = 0;
            allMemberStatus.forEach(isDone => {
                if (isDone) done++;
                else wait++;
            });

            document.getElementById('kpiDoneCount').textContent = `${done}명`;
            document.getElementById('kpiWaitCount').textContent = `${wait}명`;
        }

        function getEffectiveFallbackDate() {
            if (selectedKpiDistDate !== 'all' && selectedKpiDistDate !== 'unconfirmed') {
                return selectedKpiDistDate;
            }
            return ClanApp.formatYMD(new Date());
        }

        function buildMergedParticipantsList() {
            const targetEntries = getSelectedKpiDateEntries();
            const fallbackDate = getEffectiveFallbackDate();
            const memberMap = new Map();

            targetEntries.forEach(entry => {
                const raid = entry.raid_ref;
                const distObj = raid.distributions || {};

                entry.participants.forEach(p => {
                    const pDist = distObj[p.id] || {};
                    const isMemberDoneForThisRaid = (pDist.status === '분배완료');

                    if (!memberMap.has(p.id)) {
                        memberMap.set(p.id, {
                            id: p.id,
                            isLeader: p.isLeader,
                            itemDetails: [],
                            totalShare: 0,
                            raidIds: new Set(),
                            allDone: true,
                            method: '본인수령',
                            proxy_name: p.id,
                            paid_date: entry.dist_date || fallbackDate
                        });
                    }
                    const mData = memberMap.get(p.id);
                    if (p.isLeader) mData.isLeader = true;
                    mData.itemDetails.push({
                        name: entry.name,
                        share: entry.per_share,
                        raid_id: entry.raid_id
                    });
                    mData.totalShare += entry.per_share;
                    mData.raidIds.add(entry.raid_id);

                    if (!isMemberDoneForThisRaid) {
                        mData.allDone = false;
                    }
                    if (pDist.method) mData.method = pDist.method;
                    if (pDist.proxy_name) mData.proxy_name = pDist.proxy_name;
                    if (pDist.paid_date) mData.paid_date = pDist.paid_date;
                });
            });

            return [...memberMap.values()];
        }

            const moreBtnHtml = totalCount > maxInitialShow
                ? `<button type="button" class="btn-items-more" onclick="toggleMemberItemsExpand('${safeMemId}')">
                       ${isExpanded ? `▲ 접기` : `▼ +${hiddenCount}개 더보기 (전체 ${totalCount}개)`}

        function onReceiverInputSearch(memberId, rowIdx) {
            const inputEl = document.getElementById(`memProxy_${rowIdx}`);
            const methodEl = document.getElementById(`memMethod_${rowIdx}`);
            const suggestBox = document.getElementById(`memProxySuggest_${rowIdx}`);
            if (!inputEl || !suggestBox) return;

            document.querySelectorAll('.receiver-suggest-list').forEach(el => {
                if (el.id !== `memProxySuggest_${rowIdx}`) el.classList.add('hidden');
            });

            const val = inputEl.value.trim();
            onProxyInputSilent(memberId, val);

            const method = methodEl ? methodEl.value : '본인수령';
            const q = val.toLowerCase();
            let candidates = [];

            if (method === '본인수령') {
                const ownList = memberSubMap[memberId] || [{ charId: memberId, labelInfo: '본캐', searchKey: memberId.toLowerCase() }];
                if (!q || q === memberId.toLowerCase()) {
                    candidates = ownList;
                } else {
                    const ownMatches = ownList.filter(e => e.searchKey.includes(q));
                    candidates = ownMatches.length > 0
                        ? ownMatches
                        : clanCharPool.filter(e => e.searchKey.includes(q)).slice(0, 10);
                }
            } else {
                if (!q) {
                    suggestBox.innerHTML = '';
                    suggestBox.classList.add('hidden');
                    activeReceiverSuggestIdx[rowIdx] = -1;
                    return;
                }
                candidates = clanCharPool.filter(entry => entry.searchKey.includes(q))
                    .sort((a, b) => {
                        const aDirect = a.charId.toLowerCase().includes(q) ? 0 : 1;
                        const bDirect = b.charId.toLowerCase().includes(q) ? 0 : 1;
                        return aDirect - bDirect;
                    })
                    .slice(0, 12);
            }

            if (candidates.length === 0) {
                suggestBox.innerHTML = '';
                suggestBox.classList.add('hidden');
                activeReceiverSuggestIdx[rowIdx] = -1;
                return;
            }

            activeReceiverSuggestIdx[rowIdx] = 0;
            const safeMemId = memberId.replace(/'/g, "\\'");

            suggestBox.innerHTML = candidates.map((entry, idx) => {
                const safeCharId = entry.charId.replace(/'/g, "\\'");
                return `
                    <div class="receiver-suggest-item ${idx === 0 ? 'active' : ''}"
                         data-char-id="${entry.charId}"
                         onmousedown="selectReceiverSuggestion(event, '${safeMemId}', ${rowIdx}, '${safeCharId}')">
                        <span class="receiver-main-id">${entry.charId}</span>
                        <span class="receiver-sub-info">${entry.labelInfo}</span>
                    </div>
                `;
            }).join('');

            suggestBox.classList.remove('hidden');
        }

        function selectReceiverSuggestion(event, memberId, rowIdx, chosenCharId) {
            if (event) {
                event.preventDefault();
                event.stopPropagation();
            }
            const inputEl = document.getElementById(`memProxy_${rowIdx}`);
            const suggestBox = document.getElementById(`memProxySuggest_${rowIdx}`);
            if (inputEl) {
                inputEl.value = chosenCharId;
            }
            onProxyInputSilent(memberId, chosenCharId);
            if (suggestBox) {
                suggestBox.innerHTML = '';
                suggestBox.classList.add('hidden');
            }
        }

        function onReceiverKeydown(event, memberId, rowIdx) {
            if (event.isComposing || event.keyCode === 229) return;

            const suggestBox = document.getElementById(`memProxySuggest_${rowIdx}`);
            const items = suggestBox ? [...suggestBox.querySelectorAll('.receiver-suggest-item')] : [];
            const isOpen = suggestBox && !suggestBox.classList.contains('hidden') && items.length > 0;

            if (event.key === 'ArrowDown' && isOpen) {
                event.preventDefault();
                let cur = activeReceiverSuggestIdx[rowIdx] ?? 0;
                cur = (cur + 1) % items.length;
                activeReceiverSuggestIdx[rowIdx] = cur;
                items.forEach((el, idx) => el.classList.toggle('active', idx === cur));
                items[cur].scrollIntoView({ block: 'nearest' });
            } else if (event.key === 'ArrowUp' && isOpen) {
                event.preventDefault();
                let cur = activeReceiverSuggestIdx[rowIdx] ?? 0;
                cur = (cur - 1 + items.length) % items.length;
                activeReceiverSuggestIdx[rowIdx] = cur;
                items.forEach((el, idx) => el.classList.toggle('active', idx === cur));
                items[cur].scrollIntoView({ block: 'nearest' });
            } else if (event.key === 'Enter') {
                event.preventDefault();
                if (isOpen) {
                    const cur = (activeReceiverSuggestIdx[rowIdx] >= 0 && activeReceiverSuggestIdx[rowIdx] < items.length)
                        ? activeReceiverSuggestIdx[rowIdx]
                        : 0;
                    const chosenId = items[cur].getAttribute('data-char-id');
                    if (chosenId) {
                        selectReceiverSuggestion(null, memberId, rowIdx, chosenId);
                    }
                }
            } else if (event.key === 'Escape' && suggestBox) {
                suggestBox.classList.add('hidden');
            }
        }

        function onMethodSelectChange(memberId, rowIdx, val) {
            if (!memberInputDrafts[memberId]) {
                memberInputDrafts[memberId] = { method: '본인수령', proxy_name: memberId, paid_date: getEffectiveFallbackDate() };
            }
            memberInputDrafts[memberId].method = val;

            const proxyInput = document.getElementById(`memProxy_${rowIdx}`);
            if (!proxyInput) return;

            if (val === '대리수령') {
                memberInputDrafts[memberId].proxy_name = '';
                proxyInput.value = '';
                proxyInput.placeholder = '대리인';
                proxyInput.focus();
            } else {
                memberInputDrafts[memberId].proxy_name = memberId;
                proxyInput.value = memberId;
                proxyInput.placeholder = '본캐/쫄';
                onReceiverInputSearch(memberId, rowIdx);
            }
        }

        function onProxyInputSilent(memberId, val) {
            if (!memberInputDrafts[memberId]) {
                memberInputDrafts[memberId] = { method: '본인수령', proxy_name: memberId, paid_date: getEffectiveFallbackDate() };
            }
            memberInputDrafts[memberId].proxy_name = val.trim();
        }

        function onPaidDateChangeSilent(memberId, val) {
            if (!memberInputDrafts[memberId]) {
                memberInputDrafts[memberId] = { method: '본인수령', proxy_name: memberId, paid_date: val };
            }
            memberInputDrafts[memberId].paid_date = val;
        }

        function unlockMemberRow(memberId) {
            if (!ClanApp.isAdminModeOn) return;
            unlockedMembers.add(memberId);
            renderMergedParticipantsTable();
        }

        async function saveMergedMemberRow(memberId, rowIdx) {
            if (!ClanApp.isAdminModeOn) return;

            const fallbackDate = getEffectiveFallbackDate();
            const methodEl = document.getElementById(`memMethod_${rowIdx}`);
            const proxyEl = document.getElementById(`memProxy_${rowIdx}`);
            const dateEl = document.getElementById(`memPaidDate_${rowIdx}`);

            const method = methodEl ? methodEl.value : '본인수령';
            const rawReceiver = proxyEl ? proxyEl.value.trim() : '';
            const proxy_name = (method === '대리수령') ? rawReceiver : (rawReceiver || memberId);
            const paid_date = (dateEl && dateEl.value) ? dateEl.value : fallbackDate;

            if (method === '대리수령' && !proxy_name) {
                alert('대리수령을 선택한 경우 대리수령 아이디를 입력해 주세요.');
                return;
            }

            memberInputDrafts[memberId] = { method, proxy_name, paid_date };

            const targetEntries = getSelectedKpiDateEntries();
            const targetRaidIds = [...new Set(
                targetEntries.filter(e => e.participants.some(p => p.id === memberId)).map(e => e.raid_id)
            )];

            for (const rId of targetRaidIds) {
                const raid = allRaids.find(r => r.id === rId);
                if (!raid) continue;

                const distMap = JSON.parse(JSON.stringify(raid.distributions || {}));
                distMap[memberId] = {
                    status: '분배완료',
                    method,
                    proxy_name,
                    paid_date
                };

                await fetch('/api/raids/distributions', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        raid_id: rId,
                        distributions: distMap,
                        requester_role: ClanApp.role
                    })
                });

                await ensureRaidItemsDistDateFilled(raid, paid_date);
            }

            unlockedMembers.delete(memberId);
            await loadAllRaidsForDistribution();
        }

        async function resetMergedMemberRow(memberId) {
            if (!ClanApp.isAdminModeOn) return;
            if (!confirm(`[${memberId}] 참여자의 분배 완료 상태를 초기화하시겠습니까?\n(초기화 시 분배금을 안 받아간 상태로 돌아갑니다.)`)) return;

            const targetEntries = getSelectedKpiDateEntries();
            const targetRaidIds = [...new Set(
                targetEntries.filter(e => e.participants.some(p => p.id === memberId)).map(e => e.raid_id)
            )];

            for (const rId of targetRaidIds) {
                const raid = allRaids.find(r => r.id === rId);
                if (!raid) continue;

                const distMap = JSON.parse(JSON.stringify(raid.distributions || {}));
                distMap[memberId] = {
                    status: '분배대기',
                    method: '본인수령',
                    proxy_name: memberId,
                    paid_date: ''
                };

                await fetch('/api/raids/distributions', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        raid_id: rId,
                        distributions: distMap,
                        requester_role: ClanApp.role
                    })
                });
            }

            unlockedMembers.delete(memberId);
            await loadAllRaidsForDistribution();
        }

        async function markAllMergedParticipantsDone() {
            if (!ClanApp.isAdminModeOn) return;
            const targetEntries = getSelectedKpiDateEntries();
            if (targetEntries.length === 0) return alert('선택한 기준에 분배 처리할 대상 아이템이 없습니다.');

            const selectedDistDate = getEffectiveFallbackDate();
            const labelStr = (selectedKpiDistDate === 'all') ? '현재 조회된 전체 목록' : toShortDate(selectedDistDate);
            if (!confirm(`${labelStr}의 모든 참여자를 [분배완료] 처리하시겠습니까?`)) return;

            const uniqueRaidIds = [...new Set(targetEntries.map(e => e.raid_id))];

            for (const rId of uniqueRaidIds) {
                const raid = allRaids.find(r => r.id === rId);
                if (!raid) continue;

                const distMap = JSON.parse(JSON.stringify(raid.distributions || {}));
                const participants = ClanApp.extractParticipants(raid);

                participants.forEach(p => {
                    const draft = memberInputDrafts[p.id] || distMap[p.id] || {};
                    const methodVal = draft.method || '본인수령';
                    const receiverVal = draft.proxy_name || p.id;
                    distMap[p.id] = {
                        status: '분배완료',
                        method: methodVal,
                        proxy_name: receiverVal,
                        paid_date: selectedDistDate
                    };
                    memberInputDrafts[p.id] = {
                        method: methodVal,
                        proxy_name: receiverVal,
                        paid_date: selectedDistDate
                    };
                });

                await fetch('/api/raids/distributions', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        raid_id: rId,
                        distributions: distMap,
                        requester_role: ClanApp.role
                    })
                });

                await ensureRaidItemsDistDateFilled(raid, selectedDistDate);
            }

            unlockedMembers.clear();
            await loadAllRaidsForDistribution();
            alert(`${labelStr} 기준 전체 분배 완료 처리되었습니다.`);
        }

        async function ensureRaidItemsDistDateFilled(raid, fallbackDate) {
            const details = ClanApp.extractItemDetails(raid, itemPriceMap);
            let changed = false;
            const updated = details.map(it => {
                if (it.dist_checked && (!it.dist_date || !it.dist_date.trim())) {
                    changed = true;
                    return { ...it, dist_date: fallbackDate };
                }
                return it;
            });

            if (changed) {
                await fetch('/api/raids/item-details', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        raid_id: raid.id,
                        item_details: updated,
                        requester_role: ClanApp.role
                    })
                });
            }
        }

        function exportDistExcel(kind) {
            if (!ClanApp.isAdminModeOn) return;
            const refDate = document.getElementById('distDateFilter').value || ClanApp.formatYMD(new Date());
            const refMonth = document.getElementById('distMonthFilter').value || ClanApp.formatYM(new Date());

            if (kind === 'day') {
                ClanApp.downloadExcel({ date: refDate });
            } else if (kind === 'week') {
                const { start, end } = getPlusSevenDaysRange(refDate);
                ClanApp.downloadExcel({ start, end });
            } else {
                ClanApp.downloadExcel({ month: refMonth });
            }
        }
    </script>
</body>
