<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>분배금 관리 - 혈맹 보스탐 체크기</title>
    <link rel="stylesheet" href="/static/style.css?v=7">
</head>
<body>
    <nav class="navbar" id="appNavbar"></nav>

    <main class="container">
        <div class="card">
            <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 0.9rem;">
                <h2 class="section-title" style="margin-bottom: 0;">💰 보스탐 분배금 설정 및 수령 관리</h2>
                <div style="display: flex; gap: 0.4rem; flex-wrap: wrap;">
                    <button class="btn btn-blue" style="font-size: 0.8rem; padding: 0.4rem 0.75rem;" onclick="ClanApp.downloadExcel({ date: document.getElementById('distDateFilter').value })">
                        📥 선택일 엑셀 다운로드
                    </button>
                    <button class="btn btn-dark" style="font-size: 0.8rem; padding: 0.4rem 0.75rem;" onclick="ClanApp.downloadExcel({ month: document.getElementById('distMonthFilter').value })">
                        📥 월 전체 엑셀
                    </button>
                </div>
            </div>

            <div id="distAdminNotice" class="hidden" style="margin-bottom: 1rem; padding: 0.75rem; background: rgba(245, 158, 11, 0.12); border: 1px solid var(--accent-gold); border-radius: 8px; font-size: 0.85rem; color: var(--accent-gold); font-weight: 700;">
                🔒 분배금 설정 및 수령 완료 처리는 관리자만 가능합니다. (관리자라면 우측 상단 [👑 관리자 모드: ON]을 켜주세요)
            </div>

            <!-- 날짜 및 필터 선택 -->
            <div style="display: flex; gap: 0.75rem; flex-wrap: wrap; align-items: flex-end; margin-bottom: 1rem;">
                <div>
                    <label>조회 월</label>
                    <input type="month" id="distMonthFilter" onchange="onDistMonthChange()" style="width: auto;">
                </div>
                <div>
                    <label>보스탐 날짜 선택</label>
                    <input type="date" id="distDateFilter" onchange="onDistDateChange()" style="width: auto;">
                </div>
                <div>
                    <label>보스탐 시간 선택 (득템/참여 있는 타임)</label>
                    <select id="distTimeSelect" onchange="renderSelectedRaidDistribution()" style="min-width: 160px;"></select>
                </div>
                <div style="flex: 1; min-width: 150px;">
                    <label>참여자 검색 필터</label>
                    <input type="search" id="participantFilterInput" placeholder="캐릭터명 검색" oninput="renderParticipantDistTable()">
                </div>
            </div>

            <!-- 1. 선택된 보스탐의 아이템별 가격 및 분배일자 설정 -->
            <div class="detail-col-box" style="margin-bottom: 1rem;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.6rem; flex-wrap: wrap; gap: 0.4rem;">
                    <span style="font-weight: 800; color: var(--accent-gold);">💎 드랍 아이템 및 아이템별 분배일자 설정</span>
                    <button id="saveItemDistDatesBtn" class="btn btn-green hidden" style="padding: 0.3rem 0.7rem; font-size: 0.78rem;" onclick="saveAllItemDistDates()">
                        💾 아이템 가격/분배일자 일괄 저장
                    </button>
                </div>
                <div id="distItemListArea" style="font-size: 0.88rem;"></div>
            </div>

            <!-- 2. 분배금 요약 KPI -->
            <div class="summary-kpi-grid">
                <div class="kpi-box">
                    <div class="kpi-label">총 판매액 / 혈비 제외 풀</div>
                    <div class="kpi-value" id="distKpiPool" style="font-size: 0.95rem;">0 / 0</div>
                </div>
                <div class="kpi-box">
                    <div class="kpi-label">참여 인원 / 1인당 분배금</div>
                    <div class="kpi-value" id="distKpiPerPerson" style="color: #34d399; font-size: 0.95rem;">0명 / 0</div>
                </div>
                <div class="kpi-box">
                    <div class="kpi-label">분배완료 인원</div>
                    <div class="kpi-value" id="distKpiDoneCount" style="color: #6ee7b7;">0명</div>
                </div>
                <div class="kpi-box">
                    <div class="kpi-label">미분배(대기) 인원</div>
                    <div class="kpi-value" id="distKpiWaitCount" style="color: #fbbf24;">0명</div>
                </div>
            </div>

            <!-- 3. 참여자별 분배금 수령 방식(본인/대리) 및 분배완료 설정 테이블 -->
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.6rem; flex-wrap: wrap; gap: 0.4rem;">
                <span style="font-weight: 800; color: #a7f3d0;">👥 참여자별 개별 분배금 수령 현황</span>
                <div id="distBulkActionBox" class="hidden" style="display: flex; gap: 0.4rem; flex-wrap: wrap;">
                    <button class="btn btn-blue" style="padding: 0.32rem 0.65rem; font-size: 0.78rem;" onclick="markAllParticipants('분배완료')">✔ 전체 분배완료 선택</button>
                    <button class="btn btn-dark" style="padding: 0.32rem 0.65rem; font-size: 0.78rem;" onclick="markAllParticipants('분배대기')">↺ 전체 대기 초기화</button>
                    <button class="btn btn-green" style="padding: 0.32rem 0.8rem; font-size: 0.82rem;" onclick="saveDistributionsToServer()">💾 분배 설정 전체 저장</button>
                </div>
            </div>

            <div class="table-scroll">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>참여 캐릭터</th>
                            <th>1인당 분배금</th>
                            <th>분배 상태</th>
                            <th>수령 방식 (본인/대리)</th>
                            <th>대리수령자 아이디</th>
                            <th>분배완료 일자</th>
                            <th id="distSingleSaveHeader" class="hidden">개별 저장</th>
                        </tr>
                    </thead>
                    <tbody id="distParticipantTableBody"></tbody>
                </table>
            </div>
        </div>
    </main>

    <script src="/static/common.js?v=7"></script>
    <script>
        let currentTaxRate = 20;
        let monthRaids = [];
        let dayRaids = [];
        let currentRaidRecord = null;
        let workingItems = [];
        let workingDistributions = {};

        window.onload = async () => {
            const user = ClanApp.initPage('/distribution', () => {
                applyDistAdminUI();
                renderSelectedRaidDistribution();
            });
            if (!user) return;

            const taxRes = await fetch('/api/raids/tax-rate');
            currentTaxRate = (await taxRes.json()).tax_rate ?? 20;

            const now = new Date();
            document.getElementById('distMonthFilter').value = ClanApp.formatYM(now);
            document.getElementById('distDateFilter').value = ClanApp.formatYMD(now);

            applyDistAdminUI();
            await loadMonthRaidsForDist();
        };

        function applyDistAdminUI() {
            const isOn = ClanApp.isAdminModeOn;
            document.getElementById('distAdminNotice').classList.toggle('hidden', isOn);
            document.getElementById('saveItemDistDatesBtn').classList.toggle('hidden', !isOn);
            document.getElementById('distBulkActionBox').classList.toggle('hidden', !isOn);
            document.getElementById('distSingleSaveHeader').classList.toggle('hidden', !isOn);
        }

        async function onDistMonthChange() {
            const ym = document.getElementById('distMonthFilter').value;
            if (!ym) return;
            document.getElementById('distDateFilter').value = `${ym}-01`;
            await loadMonthRaidsForDist();
        }

        async function onDistDateChange() {
            const d = document.getElementById('distDateFilter').value;
            if (!d) return;
            const ym = d.slice(0, 7);
            if (document.getElementById('distMonthFilter').value !== ym) {
                document.getElementById('distMonthFilter').value = ym;
                await loadMonthRaidsForDist();
            } else {
                filterDayAndPopulateTimes();
            }
        }

        async function loadMonthRaidsForDist() {
            const ym = document.getElementById('distMonthFilter').value;
            const res = await fetch(`/api/raids?month=${ym}`);
            monthRaids = await res.json();
            filterDayAndPopulateTimes();
        }

        function filterDayAndPopulateTimes() {
            const d = document.getElementById('distDateFilter').value;
            dayRaids = monthRaids.filter(r => r.raid_date === d);

            const select = document.getElementById('distTimeSelect');
            select.innerHTML = '';

            if (dayRaids.length === 0) {
                select.add(new Option('해당 날짜 기록 없음', ''));
                currentRaidRecord = null;
                renderSelectedRaidDistribution();
                return;
            }

            dayRaids.forEach(r => {
                const items = ClanApp.extractItemDetails(r);
                const pCount = ClanApp.extractParticipants(r).length;
                const label = `${r.raid_time} (참여 ${pCount}명 / 템 ${items.length}개)`;
                select.add(new Option(label, r.id));
            });

            select.selectedIndex = 0;
            renderSelectedRaidDistribution();
        }

        function renderSelectedRaidDistribution() {
            const raidId = Number(document.getElementById('distTimeSelect').value);
            currentRaidRecord = dayRaids.find(r => r.id === raidId) || null;

            const itemArea = document.getElementById('distItemListArea');
            const tbody = document.getElementById('distParticipantTableBody');

            if (!currentRaidRecord) {
                itemArea.innerHTML = `<span style="color:var(--text-muted);">선택된 날짜에 보스탐 기록이 없습니다.</span>`;
                tbody.innerHTML = `<tr><td colspan="7" style="text-align:center; color:var(--text-muted);">보스탐 기록이 없습니다.</td></tr>`;
                document.getElementById('distKpiPool').textContent = '0 / 0';
                document.getElementById('distKpiPerPerson').textContent = '0명 / 0';
                document.getElementById('distKpiDoneCount').textContent = '0명';
                document.getElementById('distKpiWaitCount').textContent = '0명';
                return;
            }

            workingItems = ClanApp.extractItemDetails(currentRaidRecord);
            workingDistributions = JSON.parse(JSON.stringify(currentRaidRecord.distributions || {}));

            // 1. 아이템 목록 및 아이템별 분배일자 렌더링
            if (workingItems.length === 0) {
                itemArea.innerHTML = `<span style="color:var(--text-muted);">해당 타임에 등록된 드랍 아이템이 없습니다.</span>`;
            } else {
                itemArea.innerHTML = workingItems.map((it, idx) => {
                    if (!ClanApp.isAdminModeOn) {
                        return `<div style="padding:0.4rem 0; border-bottom:1px solid rgba(255,255,255,0.06); display:flex; gap:0.75rem; flex-wrap:wrap;">
                            <b style="color:var(--text-light);">${it.name}</b>
                            <span style="color:var(--accent-gold); font-weight:700;">${it.price.toLocaleString()} 아데나</span>
                            <span style="color:#a7f3d0;">구매자: ${it.winner || '-'}</span>
                            <span style="color:#93c5fd; font-weight:700;">분배일자: ${it.dist_date || '미지정'}</span>
                        </div>`;
                    }
                    return `<div style="padding:0.45rem 0; border-bottom:1px solid rgba(255,255,255,0.08); display:flex; gap:0.5rem; align-items:center; flex-wrap:wrap;">
                        <b style="min-width:90px; color:var(--accent-gold);">${it.name}</b>
                        <span style="font-size:0.78rem; color:var(--text-muted);">판매가:</span>
                        <input type="number" id="distItemPrice_${idx}" value="${it.price || ''}" style="width:105px; padding:0.25rem 0.4rem; font-size:0.8rem;">
                        <span style="font-size:0.78rem; color:var(--text-muted);">구매자:</span>
                        <input type="text" id="distItemWinner_${idx}" value="${it.winner || ''}" style="width:90px; padding:0.25rem 0.4rem; font-size:0.8rem;">
                        <span style="font-size:0.78rem; color:#93c5fd; font-weight:700;">분배일자:</span>
                        <input type="date" id="distItemDate_${idx}" value="${it.dist_date || ''}" style="width:135px; padding:0.22rem 0.4rem; font-size:0.8rem;">
                    </div>`;
                }).join('');
            }

            renderParticipantDistTable();
        }

        function renderParticipantDistTable() {
            if (!currentRaidRecord) return;
            const participants = ClanApp.extractParticipants(currentRaidRecord);
            const taxRate = currentRaidRecord.clan_tax_rate ?? currentTaxRate;
            const gross = workingItems.reduce((a, c) => a + (Number(c.price) || 0), 0);
            const net = Math.floor(gross * (1 - taxRate / 100));
            const perShare = (participants.length > 0 && net > 0) ? Math.floor(net / participants.length) : 0;

            let doneCount = 0;
            participants.forEach(p => {
                if ((workingDistributions[p.id] || {}).status === '분배완료') doneCount++;
            });

            document.getElementById('distKpiPool').textContent = `${gross.toLocaleString()} / ${net.toLocaleString()}`;
            document.getElementById('distKpiPerPerson').textContent = `${participants.length}명 / ${perShare.toLocaleString()} 아데나`;
            document.getElementById('distKpiDoneCount').textContent = `${doneCount}명`;
            document.getElementById('distKpiWaitCount').textContent = `${participants.length - doneCount}명`;

            const kw = document.getElementById('participantFilterInput').value.trim().toLowerCase();
            const filtered = participants.filter(p => !kw || p.id.toLowerCase().includes(kw));

            const tbody = document.getElementById('distParticipantTableBody');
            if (filtered.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" style="text-align:center; color:var(--text-muted);">참여 인원이 없습니다.</td></tr>`;
                return;
            }

            tbody.innerHTML = filtered.map(p => {
                const info = workingDistributions[p.id] || { status: '분배대기', method: '본인수령', proxy_name: '', paid_date: '' };
                const isDone = info.status === '분배완료';
                const statusBadge = isDone
                    ? `<span class="status-badge badge-done">분배완료</span>`
                    : `<span class="status-badge badge-wait">분배대기</span>`;

                if (!ClanApp.isAdminModeOn) {
                    return `<tr>
                        <td style="font-weight:800; color:${p.isLeader ? '#a7f3d0' : 'var(--text-light)'};">${p.id}</td>
                        <td style="color:var(--accent-gold); font-weight:800;">${perShare.toLocaleString()} 아데나</td>
                        <td>${statusBadge}</td>
                        <td>${info.method || '본인수령'}</td>
                        <td>${info.method === '대리수령' ? (info.proxy_name || '-') : '-'}</td>
                        <td>${info.paid_date || '-'}</td>
                    </tr>`;
                }

                return `<tr>
                    <td style="font-weight:800; color:${p.isLeader ? '#a7f3d0' : 'var(--text-light)'};">${p.id}</td>
                    <td style="color:var(--accent-gold); font-weight:800;">${perShare.toLocaleString()} 아데나</td>
                    <td>
                        <select onchange="onMemberDistFieldChange('${p.id}', 'status', this.value)" style="width:105px; padding:0.25rem; font-size:0.8rem; font-weight:700; color:${isDone ? '#34d399' : '#94a3b8'};">
                            <option value="분배대기" ${!isDone ? 'selected' : ''}>분배대기</option>
                            <option value="분배완료" ${isDone ? 'selected' : ''}>분배완료</option>
                        </select>
                    </td>
                    <td>
                        <select onchange="onMemberDistFieldChange('${p.id}', 'method', this.value)" style="width:105px; padding:0.25rem; font-size:0.8rem;">
                            <option value="본인수령" ${info.method !== '대리수령' ? 'selected' : ''}>본인수령</option>
                            <option value="대리수령" ${info.method === '대리수령' ? 'selected' : ''}>대리수령</option>
                        </select>
                    </td>
                    <td>
                        <input type="text" value="${info.proxy_name || ''}" placeholder="${info.method === '대리수령' ? '대리인 아이디' : '-'}"
                               ${info.method === '대리수령' ? '' : 'disabled'}
                               oninput="onMemberDistFieldChange('${p.id}', 'proxy_name', this.value)"
                               style="width:110px; padding:0.25rem 0.4rem; font-size:0.8rem;">
                    </td>
                    <td>
                        <input type="date" value="${info.paid_date || ''}"
                               onchange="onMemberDistFieldChange('${p.id}', 'paid_date', this.value)"
                               style="width:130px; padding:0.22rem; font-size:0.78rem;">
                    </td>
                    <td>
                        <button class="btn btn-green" style="padding:0.25rem 0.55rem; font-size:0.75rem;" onclick="saveDistributionsToServer('${p.id}')">저장</button>
                    </td>
                </tr>`;
            }).join('');
        }

        function onMemberDistFieldChange(memberId, field, value) {
            if (!workingDistributions[memberId]) {
                workingDistributions[memberId] = { status: '분배대기', method: '본인수령', proxy_name: '', paid_date: '' };
            }
            workingDistributions[memberId][field] = value;

            if (field === 'status' && value === '분배완료' && !workingDistributions[memberId].paid_date) {
                workingDistributions[memberId].paid_date = ClanApp.formatYMD();
            }
            if (field === 'method' && value === '본인수령') {
                workingDistributions[memberId].proxy_name = '';
            }
            renderParticipantDistTable();
        }

        function markAllParticipants(statusVal) {
            if (!currentRaidRecord) return;
            const today = ClanApp.formatYMD();
            ClanApp.extractParticipants(currentRaidRecord).forEach(p => {
                const prev = workingDistributions[p.id] || { method: '본인수령', proxy_name: '' };
                workingDistributions[p.id] = {
                    status: statusVal,
                    method: prev.method || '본인수령',
                    proxy_name: prev.proxy_name || '',
                    paid_date: statusVal === '분배완료' ? (prev.paid_date || today) : ''
                };
            });
            renderParticipantDistTable();
        }

        async function saveAllItemDistDates() {
            if (!currentRaidRecord || !ClanApp.isAdminModeOn) return;
            workingItems.forEach((it, idx) => {
                it.price = Number(document.getElementById(`distItemPrice_${idx}`).value.trim() || 0);
                it.winner = document.getElementById(`distItemWinner_${idx}`).value.trim();
                it.dist_date = document.getElementById(`distItemDate_${idx}`).value || '';
            });

            const res = await fetch('/api/raids/item-details', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    raid_id: currentRaidRecord.id,
                    item_details: workingItems,
                    requester_role: ClanApp.role
                })
            });
            if (res.ok) {
                alert('아이템 가격 및 분배일자가 저장되었습니다.');
                await loadMonthRaidsForDist();
            }
        }

        async function saveDistributionsToServer(singleMemberId = null) {
            if (!currentRaidRecord || !ClanApp.isAdminModeOn) return;
            const res = await fetch('/api/raids/distributions', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    raid_id: currentRaidRecord.id,
                    distributions: workingDistributions,
                    requester_role: ClanApp.role
                })
            });
            if (res.ok) {
                alert(singleMemberId ? `[${singleMemberId}] 분배 상태가 저장되었습니다.` : '전체 분배 설정이 저장되었습니다.');
                await loadMonthRaidsForDist();
            } else {
                const err = await res.json();
                alert(err.detail || '저장 실패');
            }
        }
    </script>
</body>
</html>
