<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 - 혈맹 보스탐 체크기</title>
    <link rel="stylesheet" href="{{ asset('common.css') }}">
    <link rel="stylesheet" href="{{ asset('login.css') }}">
</head>
<body>
    <nav class="navbar">
        <div class="nav-inner-container">
            <span class="login-brand">⚔️ 피닉스 혈맹 보스탐 시스템</span>
        </div>
    </nav>

    <main class="main-container login-container">
        <div class="card-box">
            <h2 class="login-title">🔐 혈맹원 로그인 / 이메일 등록</h2>
            <p class="login-guide">
                1. 본인의 캐릭터 아이디를 검색하여 클릭하세요.<br>
                2. <span class="c-gold">이메일 주소(비밀번호 대체)</span>를 입력하면 로그인됩니다.<br>
                <small class="c-mint">(로그아웃을 누르기 전까지 로그인 상태가 계속 유지됩니다)</small>
            </p>

            <!-- 1단계: 회원 아이디 검색 및 클릭 선택 -->
            <div class="login-field">
                <label for="memberSearchBox">1️⃣ 회원 아이디 검색 (본인 아이디 클릭)</label>
                <input type="search" id="memberSearchBox" class="input-common" placeholder="캐릭터명 또는 보조캐릭 검색 (예: 월은)" oninput="renderSearchChips()" autocomplete="off">
                <div id="memberChipList" class="login-chip-list">불러오는 중...</div>
            </div>

            <form onsubmit="handleEmailLogin(event)">
                <div class="login-field">
                    <label for="selectedActiveId">선택된 캐릭터 아이디</label>
                    <input type="text" id="selectedActiveId" class="input-common selected-id-input" readonly placeholder="위 목록에서 본인 아이디를 클릭하세요" required>
                    <div id="selectedIdStatus" class="selected-id-status"></div>
                </div>

                <!-- 2단계: 이메일 주소 입력 (비밀번호 대체) -->
                <div class="login-field">
                    <label for="loginEmail">2️⃣ 이메일 주소 입력 (비밀번호 대체)</label>
                    <input type="email" id="loginEmail" class="input-common" placeholder="example@gmail.com" autocomplete="email" required>
                </div>

                <p id="loginMessage" class="login-message"></p>
                <button id="loginBtn" type="submit" class="btn-primary btn-login" disabled>아이디를 먼저 선택해 주세요</button>
            </form>
        </div>
    </main>

    <script src="{{ asset('login.js') }}"></script>
</body>
</html>
