<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>로그인 - 혈맹 보스탐 체크기</title>
    <link rel="stylesheet" href="/static/style.css?v=5">
</head>
<body>
    <nav class="navbar">
        <div class="nav-left">
    <a href="/raid-record" class="nav-link">보스탐 기록</a>
    <a href="/raid-status" class="nav-link">일별기록현황</a>
    <a href="/item-status" class="nav-link">템 보유현황</a>
    <a href="/my-history" class="nav-link" id="navMyId">참여내역</a>
        </div>
        <div class="nav-right">
            <a href="/login" class="nav-link active">로그인</a>
        </div>
    </nav>

    <main class="container" style="max-width: 440px; margin-top: 3rem;">
        <div class="card">
            <h2 class="section-title" style="text-align: center;">🔐 혈맹원 로그인 / 비밀번호 설정</h2>
            <p style="font-size: 0.85rem; color: var(--text-muted); text-align: center; margin-bottom: 1.5rem; line-height: 1.5;">
                회원 아이디와 이메일을 연결한 뒤 로그인하세요.<br>
                <span style="color: var(--accent-gold);">최초 로그인 또는 관리자가 비밀번호를 재설정한 경우</span><br>
                비밀번호를 두 번 입력해 새 비밀번호를 설정합니다.
            </p>

            <form onsubmit="handleLogin(event)">
                <div style="margin-bottom: 1rem;">
                    <label for="loginMemberId">회원 아이디</label>
                    <select id="loginMemberId" required>
                        <option value="">회원 명단 불러오는 중...</option>
                    </select>
                </div>

                <div style="margin-bottom: 1rem;">
                    <label for="loginEmail">이메일 주소</label>
                    <input type="email" id="loginEmail" placeholder="example@gmail.com" autocomplete="email" required>
                </div>

                <div style="margin-bottom: 1rem;">
                    <label for="loginPassword">비밀번호</label>
                    <input type="password" id="loginPassword" placeholder="비밀번호 입력" autocomplete="current-password" required>
                </div>

                <div style="margin-bottom: 1rem;">
                    <label for="loginPasswordConfirmation">비밀번호 재확인</label>
                    <input type="password" id="loginPasswordConfirmation" placeholder="비밀번호를 다시 입력하세요" autocomplete="new-password" required>
                </div>

                <p id="loginMessage" role="status" style="min-height: 1.3rem; margin-bottom: 0.75rem; color: var(--text-muted); font-size: 0.85rem;"></p>
                <button id="loginButton" type="submit" class="btn btn-green" style="width: 100%; font-size: 1rem;" disabled>로그인 / 비밀번호 설정</button>
            </form>
        </div>
    </main>

    <script>
        window.onload = async () => {
            const saved = localStorage.getItem('clan_user');
            if (saved) {
                window.location.href = '/raid-record';
                return;
            }
            await loadMemberOptions();
        };

        function setLoginMessage(message, isError = false) {
            const messageElement = document.getElementById('loginMessage');
            messageElement.textContent = message;
            messageElement.style.color = isError ? 'var(--accent-red)' : 'var(--text-muted)';
        }

        async function loadMemberOptions() {
            const memberSelect = document.getElementById('loginMemberId');
            try {
                const res = await fetch('/api/auth/search-members');
                const members = await res.json();
                if (!res.ok) {
                    throw new Error(members.detail || '회원 명단을 불러오지 못했습니다.');
                }

                memberSelect.replaceChildren(new Option('회원 아이디를 선택하세요', ''));
                members
                    .slice()
                    .sort((a, b) => (a.active_id || '').localeCompare(b.active_id || '', 'ko'))
                    .forEach(member => {
                        const option = new Option(
                            member.unique_id ? `${member.active_id} (${member.unique_id})` : member.active_id,
                            member.active_id
                        );
                        memberSelect.add(option);
                    });

                document.getElementById('loginButton').disabled = members.length === 0;
                setLoginMessage(members.length ? '' : '등록된 회원이 없습니다. 관리자에게 문의하세요.', members.length === 0);
            } catch (error) {
                memberSelect.replaceChildren(new Option('회원 명단을 불러오지 못했습니다', ''));
                setLoginMessage(error.message || '회원 명단을 불러오지 못했습니다.', true);
            }
        }

        async function handleLogin(event) {
            event.preventDefault();
            const active_id = document.getElementById('loginMemberId').value;
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;
            const password_confirmation = document.getElementById('loginPasswordConfirmation').value;

            if (!active_id || !email || !password || !password_confirmation) {
                setLoginMessage('회원 아이디, 이메일, 비밀번호를 모두 입력해 주세요.', true);
                return;
            }
            if (password !== password_confirmation) {
                setLoginMessage('비밀번호 확인이 일치하지 않습니다.', true);
                document.getElementById('loginPasswordConfirmation').focus();
                return;
            }

            const loginButton = document.getElementById('loginButton');
            loginButton.disabled = true;
            setLoginMessage('로그인 정보를 확인하고 있습니다.');

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ active_id, email, password, password_confirmation })
                });

                const data = await res.json();
                if (!res.ok) {
                    setLoginMessage(data.detail || '로그인에 실패했습니다.', true);
                    return;
                }

                if (data.status === 'password_set') {
                    alert(`비밀번호가 설정되었습니다.\n[${data.user.active_id}]님 환영합니다.`);
                } else if (data.status === 'email_linked') {
                    alert(`이메일이 [${data.user.active_id}] 아이디에 연결되었습니다.`);
                }

                localStorage.setItem('clan_user', JSON.stringify(data.user));
                window.location.href = '/raid-record';
            } catch (error) {
                setLoginMessage(error.message || '로그인 요청 중 오류가 발생했습니다.', true);
            } finally {
                loginButton.disabled = false;
            }
        }
    </script>
</body>
</html>
