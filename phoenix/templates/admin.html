<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원관리 - 혈맹 보스탐 체크기</title>
    <link rel="stylesheet" href="/static/style.css?v=7">
</head>
<body>
    <nav class="navbar" id="appNavbar"></nav>

    <main class="container">
        <div id="adminOffWarning" class="card hidden" style="border-color: var(--accent-gold); text-align: center;">
            <p style="color: var(--accent-gold); font-weight: 800; font-size: 0.95rem;">
                🔒 현재 [관리자 모드: OFF] 상태입니다. 회원 추가·수정·삭제를 하려면 우측 상단의 [👑 관리자 모드] 버튼을 켜주세요.
            </p>
        </div>

        <!-- 신규 혈맹원 추가 / 수정 폼 -->
        <div id="memberFormCard" class="card hidden">
            <h2 class="section-title" id="formTitle">➕ 혈맹원 추가 / 수정</h2>
            <input type="hidden" id="editMemberId">

            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 0.75rem; margin-bottom: 0.9rem;">
                <div>
                    <label>고유 아이디 (UID)</label>
                    <input type="text" id="memUniqueId" placeholder="예: UID_004">
                </div>
                <div>
                    <label>사용중인 아이디 (본캐릭)</label>
                    <input type="text" id="memActiveId" placeholder="예: 투헤븐">
                </div>
                <div>
                    <label>이메일 주소 (비밀번호 대체)</label>
                    <input type="email" id="memEmail" placeholder="미입력 시 회원 직접 등록">
                </div>
                <div>
                    <label>클래스</label>
                    <select id="memClass" onchange="renderSkillOptions()">
                        <option value="기사">기사</option>
                        <option value="요정">요정</option>
                        <option value="법사">법사</option>
                        <option value="군주">군주</option>
                        <option value="다크엘프">다크엘프</option>
                    </select>
                </div>
                <div>
                    <label>혈맹</label>
                    <select id="memClan">
                        <option value="피닉스">피닉스</option>
                        <option value="미가입">미가입</option>
                        <option value="보류">보류</option>
                    </select>
                </div>
                <div>
                    <label>권한 (슈퍼관리자만 슈퍼관리자 부여 가능)</label>
                    <select id="memRole"></select>
                </div>
            </div>

            <!-- 보조캐릭 1~3개 입력란 -->
            <div style="margin-bottom: 0.9rem;">
                <label>보조캐릭 아이디 (최대 3개 입력 가능)</label>
                <div class="sub-char-grid">
                    <input type="text" id="subChar1" placeholder="보조캐릭 1 (예: 월은쫄1)">
                    <input type="text" id="subChar2" placeholder="보조캐릭 2 (예: 월은법사)">
                    <input type="text" id="subChar3" placeholder="보조캐릭 3">
                </div>
            </div>

            <div style="margin-bottom: 1rem;">
                <label>보유 중요 스킬</label>
                <div id="memSkills" class="skill-chips"></div>
            </div>

            <div style="display: flex; gap: 0.5rem; flex-wrap: wrap;">
                <button class="btn btn-green" onclick="saveMember()">💾 저장하기</button>
                <button class="btn btn-dark" onclick="resetMemberForm()">입력 초기화</button>
            </div>
        </div>

        <!-- 혈맹원 전체 목록 -->
        <div class="card">
            <h2 class="section-title">👥 등록된 혈맹원 명단</h2>
            <div style="display: flex; align-items: flex-end; gap: 0.75rem; margin-bottom: 0.9rem; flex-wrap: wrap;">
                <div style="flex: 1; min-width: 220px;">
                    <label for="memberSearchInput">회원 검색 (본캐릭 / 고유ID / 보조캐릭 / 이메일)</label>
                    <input type="search" id="memberSearchInput" placeholder="아이디 또는 보조캐릭 검색" oninput="renderMembersTable()">
                </div>
                <span id="memberSearchResultCount" style="color: var(--accent-gold); font-weight: 800; font-size: 0.88rem; padding-bottom: 0.5rem;"></span>
            </div>

            <div class="table-scroll">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>고유ID</th>
                            <th>본캐릭명</th>
                            <th>보조캐릭 (1~3)</th>
                            <th>클래스</th>
                            <th>보유 스킬</th>
                            <th>혈맹</th>
                            <th>권한</th>
                            <th>등록 이메일 (비밀번호)</th>
                            <th id="memberActionHeader" class="hidden">관리</th>
                        </tr>
                    </thead>
                    <tbody id="memberTableBody">
                        <tr><td colspan="9" style="text-align: center;">조회 중...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script src="/static/common.js?v=7"></script>
    <script>
        let membersList = [];
        const MEMBER_SKILLS = {
            기사: ['스턴', '리덕', '솔캐', '바운스', '카베', '투망'],
            요정: ['소울', '트리플', '왕바람', '왕어스', '소프', '씽', '게일', '어바', '똥물', '캔슬', '투망'],
            법사: ['뮨', '캔슬', '미티어', '라톰', '파톰', '블리자드', '인비지', '투망']
        };

        window.onload = async () => {
            const user = ClanApp.initPage('/admin', () => {
                applyAdminUI();
                renderMembersTable();
            });
            if (!user) return;

            if (!ClanApp.hasAdminPrivilege) {
                alert('관리자 권한이 없습니다.');
                window.location.href = '/raid-record';
                return;
            }

            populateRoleOptions();
            renderSkillOptions();
            applyAdminUI();
            await loadMembers();
        };

        // 권한 선택 옵션: 슈퍼관리자는 모두 선택 가능, 일반 관리자는 관리자/일반회원만 선택 가능
        function populateRoleOptions(selectedRole = '일반회원') {
            const roleSelect = document.getElementById('memRole');
            roleSelect.innerHTML = '';
            const roles = ClanApp.isSuperAdmin
                ? ['일반회원', '관리자', '슈퍼관리자']
                : ['일반회원', '관리자'];

            roles.forEach(r => {
                const opt = new Option(r, r);
                if (r === selectedRole) opt.selected = true;
                roleSelect.add(opt);
            });
        }

        function applyAdminUI() {
            const isOn = ClanApp.isAdminModeOn;
            document.getElementById('adminOffWarning').classList.toggle('hidden', isOn);
            document.getElementById('memberFormCard').classList.toggle('hidden', !isOn);
            document.getElementById('memberActionHeader').classList.toggle('hidden', !isOn);
        }

        async function loadMembers() {
            const res = await fetch('/api/auth/search-members');
            membersList = await res.json();
            renderMembersTable();
        }

        function renderMembersTable() {
            const tbody = document.getElementById('memberTableBody');
            const keyword = document.getElementById('memberSearchInput').value.trim().toLowerCase();

            const filtered = membersList.filter(m => {
                if (!keyword) return true;
                return [m.active_id, m.unique_id, m.sub_chars, m.google_email]
                    .some(v => String(v || '').toLowerCase().includes(keyword));
            });

            document.getElementById('memberSearchResultCount').textContent = `총 ${filtered.length}명`;

            if (filtered.length === 0) {
                tbody.innerHTML = `<tr><td colspan="9" style="text-align: center; color: var(--text-muted);">검색 결과가 없습니다.</td></tr>`;
                return;
            }

            tbody.innerHTML = filtered.map(m => {
                const skills = Array.isArray(m.skills) ? m.skills.join(', ') : (m.skills || '');
                const subCharsDisplay = m.sub_chars
                    ? `<span style="color:#a7f3d0; font-weight:700;">${m.sub_chars}</span>`
                    : `<span style="color:var(--text-muted);">-</span>`;
                const emailDisplay = m.google_email
                    ? `<span style="color:#6ee7b7; font-weight:700;">${m.google_email}</span>`
                    : `<span style="color:var(--accent-gold);">미등록</span>`;

                // 일반 관리자는 슈퍼관리자 계정을 수정/삭제할 수 없음
                const isTargetSuper = m.role === '슈퍼관리자';
                const canModify = ClanApp.isSuperAdmin || !isTargetSuper;

                let actionCell = '';
                if (ClanApp.isAdminModeOn) {
                    actionCell = canModify ? `
                        <td>
                            <div style="display: flex; gap: 0.3rem; flex-wrap: wrap;">
                                <button class="btn btn-blue" style="padding: 0.22rem 0.5rem; font-size: 0.75rem;" onclick="editMember(${m.id})">수정</button>
                                <button class="btn btn-primary" style="padding: 0.22rem 0.5rem; font-size: 0.75rem;" onclick="resetEmail(${m.id}, '${m.active_id}')">이메일초기화</button>
                                <button class="btn btn-red" style="padding: 0.22rem 0.5rem; font-size: 0.75rem;" onclick="deleteMember(${m.id}, '${m.active_id}')">삭제</button>
                            </div>
                        </td>
                    ` : `<td><span style="color:var(--text-muted); font-size:0.78rem;">슈퍼관리자 전용</span></td>`;
                }

                return `
                    <tr>
                        <td style="color:var(--text-muted); font-size:0.8rem;">${m.unique_id}</td>
                        <td style="font-weight: 800; color: var(--accent-gold);">${m.active_id}</td>
                        <td>${subCharsDisplay}</td>
                        <td>${m.char_class}</td>
                        <td>${skills || '-'}</td>
                        <td>${m.clan}</td>
                        <td style="font-weight:700;">${m.role}</td>
                        <td>${emailDisplay}</td>
                        ${actionCell}
                    </tr>
                `;
            }).join('');
        }

        function renderSkillOptions(selectedSkills = []) {
            const container = document.getElementById('memSkills');
            container.innerHTML = '';
            const skills = MEMBER_SKILLS[document.getElementById('memClass').value] || [];

            if (skills.length === 0) {
                container.textContent = '이 클래스는 선택 가능한 스킬이 없습니다.';
                return;
            }

            skills.forEach(skill => {
                const label = document.createElement('label');
                label.className = `skill-chip ${selectedSkills.includes(skill) ? 'selected' : ''}`;
                const checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkbox.name = 'memberSkill';
                checkbox.value = skill;
                checkbox.checked = selectedSkills.includes(skill);
                checkbox.onchange = () => label.classList.toggle('selected', checkbox.checked);
                label.append(checkbox, document.createTextNode(skill));
                container.appendChild(label);
            });
        }

        function editMember(id) {
            if (!ClanApp.isAdminModeOn) return;
            const m = membersList.find(x => x.id === id);
            if (!m) return;

            if (m.role === '슈퍼관리자' && !ClanApp.isSuperAdmin) {
                return alert('슈퍼관리자 정보는 슈퍼관리자만 수정할 수 있습니다.');
            }

            document.getElementById('editMemberId').value = m.id;
            document.getElementById('memUniqueId').value = m.unique_id || '';
            document.getElementById('memActiveId').value = m.active_id || '';
            document.getElementById('memEmail').value = m.google_email || '';
            document.getElementById('memClass').value = m.char_class || '기사';
            document.getElementById('memClan').value = m.clan || '피닉스';
            populateRoleOptions(m.role);

            // 보조캐릭 1~3 분리 세팅
            const subs = (m.sub_chars || '').split(',').map(s => s.trim()).filter(Boolean);
            document.getElementById('subChar1').value = subs[0] || '';
            document.getElementById('subChar2').value = subs[1] || '';
            document.getElementById('subChar3').value = subs[2] || '';

            const skills = Array.isArray(m.skills) ? m.skills : String(m.skills || '').split(',').map(s => s.trim()).filter(Boolean);
            renderSkillOptions(skills);
            document.getElementById('formTitle').textContent = `✏️ [${m.active_id}] 회원 정보 수정`;
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function resetMemberForm() {
            document.getElementById('editMemberId').value = '';
            document.getElementById('memUniqueId').value = '';
            document.getElementById('memActiveId').value = '';
            document.getElementById('memEmail').value = '';
            document.getElementById('subChar1').value = '';
            document.getElementById('subChar2').value = '';
            document.getElementById('subChar3').value = '';
            populateRoleOptions('일반회원');
            renderSkillOptions([]);
            document.getElementById('formTitle').textContent = '➕ 혈맹원 추가 / 수정';
        }

        async function saveMember() {
            if (!ClanApp.isAdminModeOn) return;
            const editId = document.getElementById('editMemberId').value;

            const subList = [
                document.getElementById('subChar1').value.trim(),
                document.getElementById('subChar2').value.trim(),
                document.getElementById('subChar3').value.trim()
            ].filter(Boolean);

            const payload = {
                unique_id: document.getElementById('memUniqueId').value.trim(),
                active_id: document.getElementById('memActiveId').value.trim(),
                google_email: document.getElementById('memEmail').value.trim() || null,
                char_class: document.getElementById('memClass').value,
                clan: document.getElementById('memClan').value,
                role: document.getElementById('memRole').value,
                sub_chars: subList.join(', '),
                skills: [...document.querySelectorAll('#memSkills input[name="memberSkill"]:checked')].map(i => i.value),
                requester_role: ClanApp.role
            };

            if (!payload.unique_id || !payload.active_id) {
                return alert('고유 아이디(UID)와 본캐릭명을 입력해 주세요.');
            }

            const url = editId ? `/api/admin/members/${editId}` : '/api/admin/members';
            const method = editId ? 'PUT' : 'POST';

            const res = await fetch(url, {
                method,
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (res.ok) {
                alert('회원 정보가 저장되었습니다.');
                resetMemberForm();
                await loadMembers();
            } else {
                const err = await res.json();
                alert(err.detail || '저장 중 오류가 발생했습니다.');
            }
        }

        async function resetEmail(memberId, activeId) {
            if (!ClanApp.isAdminModeOn) return;
            if (!confirm(`[${activeId}] 회원의 등록된 이메일을 초기화하시겠습니까?\n초기화 후 해당 회원이 로그인 화면에서 새 이메일을 직접 등록할 수 있습니다.`)) return;

            const res = await fetch(`/api/auth/reset-email/${memberId}?requester_role=${encodeURIComponent(ClanApp.role)}`, {
                method: 'POST'
            });
            if (res.ok) {
                alert(`[${activeId}] 이메일이 초기화되었습니다.`);
                await loadMembers();
            } else {
                const err = await res.json();
                alert(err.detail || '초기화 실패');
            }
        }

        async function deleteMember(memberId, activeId) {
            if (!ClanApp.isAdminModeOn) return;
            if (!confirm(`[${activeId}] 회원을 명단에서 삭제하시겠습니까?`)) return;

            const res = await fetch(`/api/admin/members/${memberId}?requester_role=${encodeURIComponent(ClanApp.role)}`, {
                method: 'DELETE'
            });
            if (res.ok) {
                alert('삭제되었습니다.');
                await loadMembers();
            } else {
                const err = await res.json();
                alert(err.detail || '삭제 실패');
            }
        }
    </script>
</body>
</html>
