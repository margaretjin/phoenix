<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>참여내역 - 혈맹 보스탐 체크기</title>
    <link rel="stylesheet" href="/static/style.css?v=7">
</head>
<body>
    <nav class="navbar" id="appNavbar"></nav>

    <main class="container">
        <!-- 1. 상단 내 캐릭터 정보 & 보조캐릭 표시 -->
        <div class="card">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.8rem; flex-wrap: wrap; gap: 0.5rem;">
                <h2 class="section-title" style="margin-bottom: 0;">🛡️ 내 캐릭터 및 참여·분배금 수령 내역</h2>

                <div style="display: flex; gap: 0.4rem; align-items: center; flex-wrap: wrap;">
                    <div id="adminMemberSearchBox" class="hidden" style="display: flex; gap: 0.35rem; align-items: center;">
                        <span style="color: var(--accent-gold); font-size: 0.8rem; font-weight: 700;">👑 조회 대상:</span>
                        <input type="text" id="targetMemberIdInput" placeholder="아이디" style="width: 110px; padding: 0.3rem 0.5rem; font-size: 0.82rem;">
                        <button class="btn btn-green" style="padding: 0.3rem 0.6rem; font-size: 0.8rem;" onclick="reloadProfileAndHistory()">조회</button>
                    </div>
                    <button class="btn btn-blue" style="padding: 0.32rem 0.65rem; font-size: 0.78rem;" onclick="ClanApp.downloadExcel({ date: document.getElementById('historyDate').value })">
                        📥 선택일 엑셀 다운로드
                    </button>
                </div>
            </div>

            <div class="profile-header-grid">
                <div>
                    <div class="profile-item-label">고유 아이디</div>
                    <div class="profile-item-val" id="profUniqueId">-</div>
                </div>
                <div>
                    <div class="profile-item-label">본캐릭터</div>
                    <div class="profile-item-val" style="color: var(--accent-gold);" id="profActiveId">-</div>
                </div>
                <div>
                    <div class="profile-item-label">보조캐릭 (1~3)</div>
                    <div class="profile-item-val" style="color: #a7f3d0;" id="profSubChars">-</div>
                </div>
                <div>
                    <div class="profile-item-label">클래스 / 스킬</div>
                    <div class="profile-item-val" style="color: #6ee7b7;" id="profClassSkills">-</div>
                </div>
            </div>

            <div style="display: flex; gap: 0.8rem; flex-wrap: wrap; align-items: flex-end;">
                <div>
                    <label>조회 기준 월</label>
                    <input type="month" id="historyMonth" onchange="onHistoryMonthChange()" style="width: auto;">
                </div>
                <div>
                    <label>일별 상세 날짜 선택</label>
                    <input type="date" id="historyDate" onchange="onHistoryDateChange()" style="width: auto;">
                </div>
                <div style="margin-left: auto; text-align: right;">
                    <div style="font-size: 0.78rem; color: var(--text-muted);">선택일 참여 / 월 누적 참여</div>
                    <div style="font-size: 1rem; font-weight: 800; color: var(--accent-gold);">
                        <span id="dayParticipatedCount">0</span>회 / 월 <span id="monthParticipatedCount">0</span>회
                    </div>
                </div>
            </div>
        </div>

        <!-- 2. 선택일 16타임 참여 원형 그리드 + 개별 분배금 및 분배완료 표기 -->
        <div class="card">
            <h3 class="section-title" style="font-size: 1rem;">⏱️ <span id="selectedHistoryDateLabel">-</span> 참여 타임 및 분배금 수령 상태</h3>
            <div id="myCircleTimeGrid" class="my-circle-grid"></div>

            <div class="table-scroll" style="margin-top: 0.9rem;">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>보스탐</th>
                            <th>인원</th>
                            <th>드랍 아이템 (분배일자)</th>
                            <th>내 개별 분배금</th>
                            <th>분배금 수령 상태</th>
                        </tr>
                    </thead>
                    <tbody id="dailyIndividualShareBody"></tbody>
                </table>
            </div>
        </div>

        <!-- 3. 일별 / 주별 분배금 합산표 -->
        <div class="settlement-two-col">
            <div class="card">
                <h3 class="section-title" style="font-size: 0.98rem;">📅 일별 분배금 합산표</h3>
                <div class="table-scroll" style="max-height: 340px;">
                    <table class="data-table" style="min-width: 320px;">
                        <thead>
                            <tr>
                                <th>날짜</th>
                                <th>참여</th>
                                <th>내 분배금 합계</th>
                                <th>수령 상태</th>
                            </tr>
                        </thead>
                        <tbody id="dailySummaryTableBody"></tbody>
                    </table>
                </div>
            </div>

            <div class="card">
                <h3 class="section-title" style="font-size: 0.98rem;">📊 주별 분배금 합산표</h3>
                <div class="table-scroll">
                    <table class="data-table" style="min-width: 320px;">
                        <thead>
                            <tr>
                                <th>주차</th>
                                <th>참여</th>
                                <th>주별 내 분배금 합계</th>
                            </tr>
                        </thead>
                        <tbody id="weeklySummaryTableBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <script src="/static/common.js?v=7"></script>
    <script>
        let currentTaxRate = 20;
        let raidTimes = [];
        let allMembers = [];
        let monthRaidsCache = [];

        window.onload = async () => {
            const user = ClanApp.initPage('/my-history', () => {
                document.getElementById('adminMemberSearchBox').classList.toggle('hidden', !ClanApp.isAdminModeOn);
                if (!ClanApp.isAdminModeOn) {
                    document.getElementById('targetMemberIdInput').value = ClanApp.user.active_id;
                    reloadProfileAndHistory();
                }
            });
            if (!user) return;

            document.getElementById('targetMemberIdInput').value = user.active_id;
            document.getElementById('adminMemberSearchBox').classList.toggle('hidden', !ClanApp.isAdminModeOn);

            const [timeRes, taxRes, memRes] = await Promise.all([
                fetch('/api/raids/times'),
                fetch('/api/raids/tax-rate'),
                fetch('/api/auth/search-members')
            ]);
            raidTimes = (await timeRes.json()).times;
            currentTaxRate = (await taxRes.json()).tax_rate ?? 20;
            allMembers = await memRes.json();

            const now = new Date();
            document.getElementById('historyMonth').value = ClanApp.formatYM(now);
            document.getElementById('historyDate').value = ClanApp.formatYMD(now);

            await reloadProfileAndHistory();
        };

        function getTargetMemberId() {
            if (ClanApp.isAdminModeOn) {
                return document.getElementById('targetMemberIdInput').value.trim() || ClanApp.user.active_id;
            }
            return ClanApp.user.active_id;
        }

        function renderProfileCard(targetId) {
            const m = allMembers.find(x => x.active_id === targetId) || ClanApp.user;
            document.getElementById('profUniqueId').textContent = m.unique_id || '-';
            document.getElementById('profActiveId').textContent = m.active_id || targetId;
            document.getElementById('profSubChars').textContent = m.sub_chars || '없음';
            const skills = Array.isArray(m.skills) ? m.skills.join(', ') : (m.skills || '');
            document.getElementById('profClassSkills').textContent = `${m.char_class || '-'} (${skills || '스킬없음'})`;
        }

        async function onHistoryMonthChange() {
            const ym = document.getElementById('historyMonth').value;
            if (!ym) return;
            if (!document.getElementById('historyDate').value.startsWith(ym)) {
                document.getElementById('historyDate').value = `${ym}-01`;
            }
            await reloadProfileAndHistory();
        }

        async function onHistoryDateChange() {
            const d = document.getElementById('historyDate').value;
            if (!d) return;
            const ym = d.slice(0, 7);
            if (document.getElementById('historyMonth').value !== ym) {
                document.getElementById('historyMonth').value = ym;
                await reloadProfileAndHistory();
            } else {
                renderAllHistoryViews();
            }
        }

        function analyzeRaidForMember(record, targetId) {
            const participants = ClanApp.extractParticipants(record).map(p => p.id);
            const isParticipated = participants.includes(targetId);
            const details = ClanApp.extractItemDetails(record);
            const gross = details.reduce((a, c) => a + (Number(c.price) || 0), 0);
            const taxRate = record.clan_tax_rate ?? currentTaxRate;
            const netPool = Math.floor(gross * (1 - taxRate / 100));
            const myShare = (isParticipated && participants.length > 0 && netPool > 0)
                ? Math.floor(netPool / participants.length)
                : 0;

            const distInfo = ((record.distributions || {})[targetId]) || { status: '분배대기', method: '본인수령', proxy_name: '', paid_date: '' };

            return {
                isParticipated,
                memberCount: participants.length,
                details,
                netPool,
                myShare,
                distInfo
            };
        }

        async function reloadProfileAndHistory() {
            const targetId = getTargetMemberId();
            renderProfileCard(targetId);
            const ym = document.getElementById('historyMonth').value;
            const res = await fetch(`/api/raids?month=${ym}`);
            monthRaidsCache = await res.json();
            renderAllHistoryViews();
        }

        function renderAllHistoryViews() {
            const targetId = getTargetMemberId();
            const dateVal = document.getElementById('historyDate').value;
            document.getElementById('selectedHistoryDateLabel').textContent = dateVal;

            const dayRecords = monthRaidsCache.filter(r => r.raid_date === dateVal);
            const circleGrid = document.getElementById('myCircleTimeGrid');
            circleGrid.innerHTML = '';

            let dayPartCount = 0;
            const rowsHtml = [];

            raidTimes.forEach(t => {
                const rec = dayRecords.find(r => r.raid_time === t);
                let participated = false;

                if (rec) {
                    const info = analyzeRaidForMember(rec, targetId);
                    participated = info.isParticipated;

                    if (participated) {
                        dayPartCount++;
                        const itemsText = info.details.length > 0
                            ? info.details.map(d => `${d.name}${d.price > 0 ? `(${d.price.toLocaleString()})` : ''}${d.dist_date ? ` <small style="color:#93c5fd;">[분배일:${d.dist_date}]</small>` : ''}`).join(', ')
                            : '득템 없음';

                        let statusHtml = `<span class="status-badge badge-wait">분배대기</span>`;
                        if (info.distInfo.status === '분배완료') {
                            const methodLabel = info.distInfo.method === '대리수령' && info.distInfo.proxy_name
                                ? `대리수령:${info.distInfo.proxy_name}`
                                : (info.distInfo.method || '본인수령');
                            const dateSub = info.distInfo.paid_date ? ` <small style="color:var(--text-muted);">(${info.distInfo.paid_date})</small>` : '';
                            statusHtml = `<span class="status-badge badge-done">✔ 분배완료 (${methodLabel})</span>${dateSub}`;
                        } else if (info.myShare === 0) {
                            statusHtml = `<span style="color:var(--text-muted); font-size:0.78rem;">분배금 없음</span>`;
                        }

                        rowsHtml.push(`<tr>
                            <td style="color:var(--accent-gold); font-weight:800;">${t}</td>
                            <td>${info.memberCount}명</td>
                            <td>${itemsText}</td>
                            <td style="color:var(--accent-gold); font-weight:900;">${info.myShare.toLocaleString()} 아데나</td>
                            <td>${statusHtml}</td>
                        </tr>`);
                    }
                }

                const c = document.createElement('div');
                c.className = `my-time-circle ${participated ? 'participated' : ''}`;
                c.innerHTML = t.replace('(', '<br>(');
                circleGrid.appendChild(c);
            });

            document.getElementById('dayParticipatedCount').textContent = dayPartCount;
            const tbody = document.getElementById('dailyIndividualShareBody');
            if (rowsHtml.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; color:var(--text-muted);">선택한 날짜에 참여한 보스탐 기록이 없습니다.</td></tr>`;
            } else {
                const daySum = dayRecords.reduce((a, r) => a + analyzeRaidForMember(r, targetId).myShare, 0);
                tbody.innerHTML = rowsHtml.join('') + `<tr style="background:rgba(245,158,11,0.12);">
                    <td colspan="3" style="text-align:right; font-weight:800;">선택일 내 분배금 합계:</td>
                    <td colspan="2" style="color:var(--accent-gold); font-weight:900;">${daySum.toLocaleString()} 아데나</td>
                </tr>`;
            }

            // 월간 일별 & 주별 합산
            const dailyMap = {};
            const weeklyMap = { 1: { c: 0, s: 0 }, 2: { c: 0, s: 0 }, 3: { c: 0, s: 0 }, 4: { c: 0, s: 0 }, 5: { c: 0, s: 0 } };
            let monthPartTotal = 0, monthShareTotal = 0;

            monthRaidsCache.forEach(r => {
                const info = analyzeRaidForMember(r, targetId);
                if (!info.isParticipated) return;
                monthPartTotal++;
                monthShareTotal += info.myShare;

                if (!dailyMap[r.raid_date]) dailyMap[r.raid_date] = { count: 0, share: 0, paidCount: 0, shareRaidCount: 0 };
                dailyMap[r.raid_date].count++;
                dailyMap[r.raid_date].share += info.myShare;
                if (info.myShare > 0) {
                    dailyMap[r.raid_date].shareRaidCount++;
                    if (info.distInfo.status === '분배완료') dailyMap[r.raid_date].paidCount++;
                }

                const w = Math.min(5, Math.ceil(parseInt(r.raid_date.slice(8, 10), 10) / 7));
                weeklyMap[w].c++;
                weeklyMap[w].s += info.myShare;
            });

            document.getElementById('monthParticipatedCount').textContent = monthPartTotal;

            const sortedDates = Object.keys(dailyMap).sort((a, b) => b.localeCompare(a));
            const dailyBody = document.getElementById('dailySummaryTableBody');
            dailyBody.innerHTML = sortedDates.length === 0
                ? `<tr><td colspan="4" style="text-align:center; color:var(--text-muted);">월 참여 내역 없음</td></tr>`
                : sortedDates.map(d => {
                    const dm = dailyMap[d];
                    let badge = `<span style="color:var(--text-muted); font-size:0.75rem;">-</span>`;
                    if (dm.shareRaidCount > 0) {
                        badge = dm.paidCount === dm.shareRaidCount
                            ? `<span class="status-badge badge-done">분배완료</span>`
                            : `<span class="status-badge badge-wait">대기(${dm.paidCount}/${dm.shareRaidCount})</span>`;
                    }
                    return `<tr style="cursor:pointer;" onclick="document.getElementById('historyDate').value='${d}'; onHistoryDateChange();">
                        <td style="font-weight:700;">${d}</td>
                        <td>${dm.count}회</td>
                        <td style="color:var(--accent-gold); font-weight:800;">${dm.share.toLocaleString()}</td>
                        <td>${badge}</td>
                    </tr>`;
                }).join('');

            const weekLabels = { 1: "1주차 (1~7일)", 2: "2주차 (8~14일)", 3: "3주차 (15~21일)", 4: "4주차 (22~28일)", 5: "5주차 (29일~)" };
            document.getElementById('weeklySummaryTableBody').innerHTML = [1, 2, 3, 4, 5].map(w => `
                <tr>
                    <td style="font-weight:700;">${weekLabels[w]}</td>
                    <td>${weeklyMap[w].c}회</td>
                    <td style="color:var(--accent-gold); font-weight:800;">${weeklyMap[w].s.toLocaleString()} 아데나</td>
                </tr>
            `).join('') + `<tr style="background:rgba(16,185,129,0.12);">
                <td style="font-weight:800;">월 총합계</td>
                <td style="font-weight:800;">${monthPartTotal}회</td>
                <td style="color:#34d399; font-weight:900;">${monthShareTotal.toLocaleString()} 아데나</td>
            </tr>`;
        }
    </script>
</body>
</html>
