<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>참여내역 - 혈맹 보스탐 체크기</title>
    <link rel="stylesheet" href="{{ asset('common.css') }}">
    <link rel="stylesheet" href="{{ asset('my_history.css') }}">
</head>
<body>
    <nav class="navbar" id="appNavbar"></nav>

    <main class="main-container">
        <!-- 상단 타이틀 & 관리자 조회대상 검색 / 엑셀 다운로드 -->
        <div class="top-bar">
            <h1 class="page-title">🛡️ 캐릭터 및 참여·분배금 수령 내역</h1>
            <div class="top-tools">
                <div class="admin-target-search admin-only">
                    <span class="admin-target-label">👑 조회 캐릭터:</span>
                    <input type="text" id="targetMemberIdInput" class="input-common admin-target-input" placeholder="아이디">
                    <button type="button" class="btn-sm btn-sm-blue" onclick="reloadProfileAndHistory()">조회</button>
                </div>
                <div class="excel-btn-group admin-only">
                    <button type="button" class="btn-excel-sm" onclick="exportHistoryExcel('month')">📥 월별</button>
                    <button type="button" class="btn-excel-sm" onclick="exportHistoryExcel('day')">일별</button>
                    <button type="button" class="btn-excel-sm" onclick="exportHistoryExcel('all')">전체</button>
                </div>
            </div>
        </div>

        <!-- 1. 캐릭터 프로필 & 조회 조건 -->
        <section class="card-box">
            <div class="history-profile-grid">
                <div>
                    <div class="prof-box-label">고유 아이디</div>
                    <div class="prof-box-val" id="profUniqueId">-</div>
                </div>
                <div>
                    <div class="prof-box-label">본캐릭터</div>
                    <div class="prof-box-val c-gold" id="profActiveId">-</div>
                </div>
                <div>
                    <div class="prof-box-label">보조캐릭 (1~3)</div>
                    <div class="prof-box-val c-mint" id="profSubChars">-</div>
                </div>
                <div>
                    <div class="prof-box-label">클래스 / 스킬</div>
                    <div class="prof-box-val c-money" id="profClassSkills">-</div>
                </div>
            </div>

            <div class="filter-grid history-filter-grid">
                <div class="filter-field">
                    <label>날짜 검색 기준</label>
                    <select id="historyDateBasis" class="input-common" onchange="renderAllHistoryViews()">
                        <option value="raid_date">보스탐 일자 기준</option>
                        <option value="dist_date">혈분배일 기준</option>
                        <option value="paid_date">본인수령일 기준</option>
                    </select>
                </div>

                <div class="filter-field">
                    <label>조회 단위</label>
                    <select id="historyPeriodMode" class="input-common" onchange="onHistoryPeriodModeChange()">
                        <option value="month" selected>월별</option>
                        <option value="day">일별</option>
                        <option value="all">전체</option>
                    </select>
                </div>

                <div id="historyMonthBox" class="filter-field">
                    <label>조회 월 선택</label>
                    <input type="month" id="historyMonth" class="input-common" onchange="onHistoryMonthChange()">
                </div>

                <div id="historyDateBox" class="filter-field hidden">
                    <label>기준 일자</label>
                    <input type="date" id="historyDate" class="input-common" onchange="onHistoryDateChange()">
                </div>

                <div id="historyAllBox" class="filter-field hidden">
                    <label>기간 범위</label>
                    <input type="text" class="input-common" value="전체 누적 내역" disabled>
                </div>

                <div class="filter-field">
                    <label>아이템별 검색</label>
                    <input type="search" id="historyItemSearch" class="input-common" placeholder="아이템명 입력" oninput="renderHistoryItemsTable()">
                </div>

                <div class="participation-kpi-group">
                    <div class="kpi-box part-kpi-badge">
                        <div class="kpi-label">해당 일 참여횟수</div>
                        <div class="kpi-val day-val"><span id="dayParticipatedCount">0</span>회</div>
                    </div>
                    <div class="kpi-box part-kpi-badge">
                        <div class="kpi-label">월별 보스탐 참여횟수</div>
                        <div class="kpi-val"><span id="monthParticipatedCount">0</span>회</div>
                    </div>
                </div>
            </div>
        </section>

        <!-- 2. 선택일 보스탐 참여 타임 그리드 -->
        <section class="card-box">
            <div class="section-head">
                <span class="section-label">⏱️ <span id="selectedHistoryDateLabel" class="history-selected-date">00-00-00</span> 보스탐 참여 타임</span>
                <div class="row-actions">
                    <button type="button" class="btn-sm btn-sm-dark" onclick="moveHistoryDay(-1)">◀ 전날</button>
                    <button type="button" class="btn-sm btn-sm-blue" onclick="moveHistoryDay(0)">오늘</button>
                    <button type="button" class="btn-sm btn-sm-dark" onclick="moveHistoryDay(1)">다음날 ▶</button>
                </div>
            </div>

            <div id="myCommonTimeGrid" class="common-time-grid"></div>
        </section>

        <!-- 3. 참여 보스탐 아이템 및 분배금 수령 내역 -->
        <section class="card-box">
            <div class="section-head">
                <span class="section-label">💎 참여 보스탐 아이템 및 분배금 수령 내역</span>
                <div id="historyTabs" class="tab-bar">
                    <button type="button" data-tab="all" class="tab-btn active" onclick="setHistoryItemFilter('all')">전체 (<span id="cntAllItems">0</span>)</button>
                    <button type="button" data-tab="wait" class="tab-btn" onclick="setHistoryItemFilter('wait')">분배대기중인 아이템 (<span id="cntWaitItems">0</span>)</button>
                    <button type="button" data-tab="done" class="tab-btn" onclick="setHistoryItemFilter('done')">분배완료 아이템 (<span id="cntDoneItems">0</span>)</button>
                </div>
            </div>

            <div class="tbl-wrap">
                <table class="tbl history-item-table">
                    <thead>
                        <tr>
                            <th>보스탐</th>
                            <th>아이템</th>
                            <th>혈비제외가</th>
                            <th>참여인원</th>
                            <th>내분배금</th>
                            <th>혈분배일</th>
                            <th>분배금수령상태</th>
                        </tr>
                    </thead>
                    <tbody id="dailyIndividualShareBody">
                        <tr><td colspan="7" class="empty-party-msg">조회 중...</td></tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="{{ asset('common.js') }}"></script>
    <script src="{{ asset('my_history.js') }}"></script>
</body>
</html>
