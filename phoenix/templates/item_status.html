<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>혈맹 아이템 현황 - 혈맹 보스탐 체크기</title>
    <link rel="stylesheet" href="/static/common.css?v=59">
    <link rel="stylesheet" href="/static/item_status.css?v=59">
</head>
<body>
    <nav class="navbar" id="appNavbar"></nav>

    <main class="main-container">
        <!-- 상단 타이틀 & 관리자 전용 4종 엑셀 다운로드 -->
        <div class="top-bar">
            <h1 class="page-title">💎 혈맹 아이템 현황</h1>
            <div class="excel-btn-group admin-only">
                <button type="button" class="btn-excel-sm" onclick="exportItemExcel('day')">📥 일</button>
                <button type="button" class="btn-excel-sm" onclick="exportItemExcel('week')">주</button>
                <button type="button" class="btn-excel-sm" onclick="exportItemExcel('month')">월</button>
                <button type="button" class="btn-excel-sm" onclick="exportItemExcel('all')">전체목록</button>
            </div>
        </div>

        <!-- 1. 조회 기준 및 보유상태 / 분배상태 필터 -->
        <section class="card-box">
            <div class="filter-grid-box">
                <div class="filter-field">
                    <label>조회 기준 (5종)</label>
                    <select id="viewModeSelect" class="input-common" onchange="onViewModeChange()">
                        <option value="month">월별</option>
                        <option value="week">주별</option>
                        <option value="today">일별 (오늘)</option>
                        <option value="all">전체</option>
                        <option value="custom_date">특정일</option>
                    </select>
                </div>

                <div id="monthPickerBox" class="filter-field">
                    <label>기준 월 선택</label>
                    <input type="month" id="filterMonth" class="input-common" onchange="loadItemStatusData()">
                </div>

                <div id="datePickerBox" class="filter-field hidden">
                    <label id="datePickerLabel">기준 날짜 선택</label>
                    <input type="date" id="filterDate" class="input-common" onchange="loadItemStatusData()">
                </div>

                <div id="allModeNoticeBox" class="filter-field hidden">
                    <label>조회 범위</label>
                    <input type="text" class="input-common" value="전체 기간 누적" disabled>
                </div>

                <!-- 보유상태 필터 (연합 포함) -->
                <div class="filter-field">
                    <label>보유상태</label>
                    <select id="holdStateFilter" class="input-common" onchange="renderItemTable()">
                        <option value="all">전체아이템현황</option>
                        <option value="보유중">보유중</option>
                        <option value="내판">내판</option>
                        <option value="연합">연합</option>
                        <option value="외판">외판</option>
                        <option value="이벤트">이벤트</option>
                    </select>
                </div>

                <!-- 분배상태 필터 (분배대기 / 분배시작 / 분배중 / 분배완료) -->
                <div class="filter-field">
                    <label>분배상태</label>
                    <select id="distStateFilter" class="input-common" onchange="renderItemTable()">
                        <option value="all">전체 분배상태</option>
                        <option value="분배대기">분배대기</option>
                        <option value="분배시작">분배시작</option>
                        <option value="분배중">분배중</option>
                        <option value="분배완료">분배완료</option>
                    </select>
                </div>

                <div class="filter-field search-full-mobile">
                    <label>아이템 / 수령자 검색</label>
                    <input type="text" id="keywordSearch" class="input-common" placeholder="아이템명 또는 수령자" oninput="renderItemTable()">
                </div>
            </div>
        </section>

        <!-- 2. 아이템 목록 테이블 -->
        <section class="card-box">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                <span class="section-label">📋 아이템 목록</span>
                <span id="itemTotalCountBadge" style="font-size: 12px; font-weight: bold; color: #60a5fa;">총 0건</span>
            </div>

            <div class="status-table-wrap">
                <table class="item-status-table">
                    <thead>
                        <tr>
                            <th>획득일시</th>
                            <th>아이템명</th>
                            <th>보유상태</th>
                            <th>분배상태</th>
                            <th>판매가격</th>
                            <th>수령자</th>
                            <th>판매<br>완료일</th>
                            <th id="adminCheckHeader" class="hidden">체크</th>
                            <th>분배<br>완료일</th>
                            <th id="adminSaveHeader" class="hidden">관리</th>
                        </tr>
                    </thead>
                    <tbody id="itemStatusTableBody">
                        <tr><td colspan="10" class="empty-party-msg">조회 중...</td></tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="/static/common.js?v=59"></script>
    <script>
        let allMembers = [];
        let clanCharPool = [];
        let clanCharSet = new Set();
        let itemPriceMap = {};
        let flattenedItems = [];
        let editingItemKeys = new Set();
        let activeSuggestIdxMap = {};
        const DAWN_SLOTS = new Set(['01시', '03시', '05시']);

        window.onload = async () => {
            const user = ClanApp.initPage('/item-status', () => {
                applyTableAdminHeaders();
                if (!ClanApp.isAdminModeOn) {
                    editingItemKeys.clear();
                }
                renderItemTable();
            });
            if (!user) return;

            applyTableAdminHeaders();

            const now = new Date();
            document.getElementById('filterMonth').value = ClanApp.formatYM(now);
            document.getElementById('filterDate').value = ClanApp.formatYMD(now);

            document.addEventListener('click', (e) => {
                if (!e.target.closest('.winner-autocomplete-wrap')) {
                    document.querySelectorAll('.winner-suggest-list').forEach(el => el.classList.add('hidden'));
                }
            });

            await Promise.all([loadMembersForAutocomplete(), loadItemMasterPrices()]);
            await loadItemStatusData();
        };

        function applyTableAdminHeaders() {
            const isAdmin = ClanApp.isAdminModeOn;
            document.getElementById('adminCheckHeader').classList.toggle('hidden', !isAdmin);
            document.getElementById('adminSaveHeader').classList.toggle('hidden', !isAdmin);
        }

        function toShortDate(dateStr) {
            if (!dateStr || dateStr.length < 8) return '-';
            return dateStr.length >= 10 ? dateStr.slice(2, 10) : dateStr;
        }

        function formatRaidDateTimeCell(dateStr, timeStr) {
            const shortDate = toShortDate(dateStr);
            const t = (timeStr || '').trim();
            const dawnTag = DAWN_SLOTS.has(t)
                ? `<span class="dawn-sub-tag">(새벽)</span>`
                : '';
            return `<span class="raid-datetime-unified">${shortDate} ${t}${dawnTag}</span>`;
        }

        async function loadMembersForAutocomplete() {
            clanCharPool = [];
            clanCharSet = new Set();
            const seenChar = new Set();

            try {
                const res = await fetch('/api/auth/search-members');
                allMembers = await res.json();

                allMembers.forEach(m => {
                    const activeId = (m.active_id || '').trim();
                    const cClass = m.char_class || '';
                    const subs = (m.sub_chars || '').split(',').map(s => s.trim()).filter(Boolean);

                    if (activeId) {
                        const lowMain = activeId.toLowerCase();
                        clanCharSet.add(lowMain);
                        if (!seenChar.has(lowMain)) {
                            seenChar.add(lowMain);
                            clanCharPool.push({
                                charId: activeId,
                                labelInfo: `${cClass} · 본캐`,
                                searchKey: `${activeId} ${subs.join(' ')}`.toLowerCase()
                            });
                        }
                    }

                    subs.forEach(subId => {
                        const lowSub = subId.toLowerCase();
                        clanCharSet.add(lowSub);
                        if (!seenChar.has(lowSub)) {
                            seenChar.add(lowSub);
                            clanCharPool.push({
                                charId: subId,
                                labelInfo: `쫄 (본캐: ${activeId})`,
                                searchKey: `${subId} ${activeId}`.toLowerCase()
                            });
                        }
                    });
                });
            } catch (e) {
                allMembers = [];
                clanCharPool = [];
                clanCharSet = new Set();
            }
        }

        async function loadItemMasterPrices() {
            itemPriceMap = {};
            try {
                const res = await fetch('/api/items');
                if (!res.ok) return;
                const list = await res.json();
                ClanApp.setItemAliases(list);
                list.forEach(it => {
                    if (it.item_name) itemPriceMap[it.item_name] = Number(it.default_price || 0);
                });
            } catch (e) {
                itemPriceMap = {};
            }
        }

        function computeHoldState(winnerRaw, priceVal, preferredSaleType = '') {
            const w = (winnerRaw || '').trim();
            const p = Number(priceVal || 0);

            if (!w) {
                return '보유중';
            }
            if (p === 0 || preferredSaleType === '이벤트') {
                return '이벤트';
            }
            if (preferredSaleType === '연합') {
                return '연합';
            }
            const isClanMember = clanCharSet.has(w.toLowerCase());
            if (isClanMember) {
                return '내판';
            }
            return '외판';
        }

        function isDistributableHoldState(holdState) {
            return holdState === '내판' || holdState === '외판';
        }

        // [수정] 분배상태 4단계 및 인원수(doneCount/pCount) 계산
        // 1) 체크 안 됨(또는 보유중/연합/이벤트) -> '분배대기'
        // 2) 체크됨(dist_checked) + 아직 혈분배일(dist_date) 미입력 -> '분배시작'
        // 3) 혈분배일(dist_date) 입력됨 + 미완료 -> '분배중' / 표기: '분배중(2/6)'
        // 4) 혈분배일 입력됨 + 전원 수령 완료 -> '분배완료' / 표기: '분배완료(6/6)'
        function computeDistStateInfo(record, item, itemIdx = 0) {
            const winner = (item.winner || '').trim();
            const holdState = computeHoldState(winner, item.price, item.sale_type);
            const distDate = (item.dist_date || '').trim();
            const isChecked = Boolean(item.dist_checked || distDate);

            const participants = ClanApp.extractParticipants(record);
            const distMap = (record && record.distributions) || {};
            const pCount = participants.length;

            let doneCount = 0;
            if (pCount > 0 && distDate) {
                participants.forEach(p => {
                    const dateInfo = distMap[`${p.id}__date_${distDate}`];
                    const itemInfo = distMap[`${p.id}__item_${itemIdx}`];
                    const legacyInfo = distMap[p.id];
                    let st = '';
                    if (dateInfo) {
                        st = dateInfo.status;
                    } else if (itemInfo) {
                        st = itemInfo.status;
                    } else if (legacyInfo) {
                        const paidDate = (legacyInfo.paid_date || '').trim();
                        if (legacyInfo.status === '분배완료' && paidDate && distDate > paidDate) {
                            st = '분배대기';
                        } else {
                            st = legacyInfo.status;
                        }
                    }
                    if (st === '분배완료') {
                        doneCount++;
                    }
                });
            }

            if (!winner || !isDistributableHoldState(holdState) || !isChecked) {
                return { state: '분배대기', label: '분배대기', doneCount: 0, totalCount: pCount };
            }

            if (!distDate) {
                return { state: '분배시작', label: '분배시작', doneCount: 0, totalCount: pCount };
            }

            if (pCount > 0 && doneCount === pCount) {
                return { state: '분배완료', label: `분배완료(${doneCount}/${pCount})`, doneCount, totalCount: pCount };
            }

            return { state: '분배중', label: `분배중(${doneCount}/${pCount})`, doneCount, totalCount: pCount };
        }

        function onViewModeChange() {
            const mode = document.getElementById('viewModeSelect').value;
            const monthBox = document.getElementById('monthPickerBox');
            const dateBox = document.getElementById('datePickerBox');
            const allBox = document.getElementById('allModeNoticeBox');
            const dateLabel = document.getElementById('datePickerLabel');

            monthBox.classList.add('hidden');
            dateBox.classList.add('hidden');
            allBox.classList.add('hidden');

            if (mode === 'month') {
                monthBox.classList.remove('hidden');
            } else if (mode === 'week') {
                dateLabel.textContent = '주간 기준일 선택';
                dateBox.classList.remove('hidden');
            } else if (mode === 'today') {
                document.getElementById('filterDate').value = ClanApp.formatYMD(new Date());
                dateLabel.textContent = '오늘 날짜';
                dateBox.classList.remove('hidden');
            } else if (mode === 'custom_date') {
                dateLabel.textContent = '특정일 선택';
                dateBox.classList.remove('hidden');
            } else {
                allBox.classList.remove('hidden');
            }

            loadItemStatusData();
        }

        async function loadItemStatusData() {
            const mode = document.getElementById('viewModeSelect').value;
            const dateVal = document.getElementById('filterDate').value || ClanApp.formatYMD(new Date());
            const monthVal = document.getElementById('filterMonth').value || ClanApp.formatYM(new Date());

            let query = '';
            if (mode === 'month') {
                query = `?month=${encodeURIComponent(monthVal)}`;
            } else if (mode === 'week') {
                const { start, end } = ClanApp.getWeekRange(dateVal);
                query = `?start=${encodeURIComponent(start)}&end=${encodeURIComponent(end)}`;
            } else if (mode === 'today' || mode === 'custom_date') {
                query = `?date=${encodeURIComponent(dateVal)}`;
            } else {
                query = '';
            }

            const res = await fetch(`/api/raids${query}`);
            const raids = await res.json();
            const todayStr = ClanApp.formatYMD(new Date());

            flattenedItems = [];
            raids.forEach(r => {
                const rawSavedDetails = Array.isArray(r.item_details) ? r.item_details : [];
                const details = ClanApp.extractItemDetails(r, itemPriceMap);

                details.forEach((item, idx) => {
                    const winner = (item.winner || '').trim();
                    const price = Number(item.price || 0);
                    const policyPrice = Number(itemPriceMap[item.name] || 0);
                    const rawObj = rawSavedDetails[idx] || {};
                    const holdState = computeHoldState(winner, price, rawObj.sale_type || item.sale_type);

                    const canDist = isDistributableHoldState(holdState);
                    const distDate = canDist ? (item.dist_date || '').trim() : '';
                    const isChecked = canDist
                        ? (distDate ? true : Boolean(rawObj.dist_checked))
                        : false;

                    const distInfo = computeDistStateInfo(
                        r,
                        { ...item, sale_type: holdState, dist_date: distDate, dist_checked: isChecked },
                        idx
                    );

                    flattenedItems.push({
                        key: `${r.id}_${idx}`,
                        raid_id: r.id,
                        item_idx: idx,
                        raid_date: r.raid_date,
                        raid_time: r.raid_time,
                        name: item.name,
                        hold_state: holdState,
                        dist_state: distInfo.state,
                        dist_label: distInfo.label,
                        price,
                        policy_price: policyPrice,
                        winner,
                        taken_date: item.taken_date || '',
                        default_taken_date: item.taken_date || todayStr,
                        dist_date: distDate,
                        dist_checked: isChecked,
                        full_details_ref: details,
                        record_ref: r
                    });
                });
            });

            renderItemTable();
        }

        function getFilteredItems() {
            const holdFilter = document.getElementById('holdStateFilter').value;
            const distFilter = document.getElementById('distStateFilter').value;
            const kw = document.getElementById('keywordSearch').value.trim().toLowerCase();

            return flattenedItems.filter(row => {
                if (holdFilter !== 'all' && row.hold_state !== holdFilter) return false;
                if (distFilter !== 'all' && row.dist_state !== distFilter) return false;
                const alias = ClanApp.getItemAlias(row.name).toLowerCase();
                if (kw && !row.name.toLowerCase().includes(kw) && !alias.includes(kw) && !row.winner.toLowerCase().includes(kw)) return false;
                return true;
            });
        }

        function startEditItemRow(key) {
            if (!ClanApp.isAdminModeOn) return;
            editingItemKeys.add(key);
            renderItemTable();
        }

        function onWinnerTypeSearch(i, currentDistDate) {
            onLiveWinnerOrPriceInput(i, currentDistDate);

            const winnerEl = document.getElementById(`stWinner_${i}`);
            const suggestBox = document.getElementById(`stWinnerSuggest_${i}`);
            if (!winnerEl || !suggestBox) return;

            const q = winnerEl.value.trim().toLowerCase();
            if (!q) {
                suggestBox.innerHTML = '';
                suggestBox.classList.add('hidden');
                activeSuggestIdxMap[i] = -1;
                return;
            }

            const matches = clanCharPool.filter(entry => entry.searchKey.includes(q))
                .sort((a, b) => {
                    const aDirect = a.charId.toLowerCase().includes(q) ? 0 : 1;
                    const bDirect = b.charId.toLowerCase().includes(q) ? 0 : 1;
                    return aDirect - bDirect;
                })
                .slice(0, 12);

            if (matches.length === 0) {
                suggestBox.innerHTML = '';
                suggestBox.classList.add('hidden');
                activeSuggestIdxMap[i] = -1;
                return;
            }

            activeSuggestIdxMap[i] = 0;

            suggestBox.innerHTML = matches.map((entry, idx) => {
                const safeCharId = entry.charId.replace(/'/g, "\\'");
                return `
                    <div class="winner-suggest-item ${idx === 0 ? 'active' : ''}"
                         data-char-id="${entry.charId}"
                         onmousedown="selectAndCommitWinner(event, ${i}, '${safeCharId}')">
                        <span class="suggest-main-id">${entry.charId}</span>
                        <span class="suggest-sub-info">${entry.labelInfo}</span>
                    </div>
                `;
            }).join('');

            suggestBox.classList.remove('hidden');
        }

        async function selectAndCommitWinner(event, i, selectedCharId) {
            if (event) {
                event.preventDefault();
                event.stopPropagation();
            }
            const winnerEl = document.getElementById(`stWinner_${i}`);
            const suggestBox = document.getElementById(`stWinnerSuggest_${i}`);
            if (winnerEl) {
                winnerEl.value = selectedCharId;
            }
            if (suggestBox) {
                suggestBox.innerHTML = '';
                suggestBox.classList.add('hidden');
            }
            await saveItemRow(i, selectedCharId);
        }

        function onWinnerKeydown(event, i, currentDistDate) {
            if (event.isComposing || event.keyCode === 229) return;

            const suggestBox = document.getElementById(`stWinnerSuggest_${i}`);
            const items = suggestBox ? [...suggestBox.querySelectorAll('.winner-suggest-item')] : [];
            const isOpen = suggestBox && !suggestBox.classList.contains('hidden') && items.length > 0;

            if (event.key === 'ArrowDown' && isOpen) {
                event.preventDefault();
                let cur = activeSuggestIdxMap[i] ?? 0;
                cur = (cur + 1) % items.length;
                activeSuggestIdxMap[i] = cur;
                items.forEach((el, idx) => el.classList.toggle('active', idx === cur));
                items[cur].scrollIntoView({ block: 'nearest' });
            } else if (event.key === 'ArrowUp' && isOpen) {
                event.preventDefault();
                let cur = activeSuggestIdxMap[i] ?? 0;
                cur = (cur - 1 + items.length) % items.length;
                activeSuggestIdxMap[i] = cur;
                items.forEach((el, idx) => el.classList.toggle('active', idx === cur));
                items[cur].scrollIntoView({ block: 'nearest' });
            } else if (event.key === 'Enter') {
                event.preventDefault();
                if (isOpen) {
                    const cur = (activeSuggestIdxMap[i] >= 0 && activeSuggestIdxMap[i] < items.length)
                        ? activeSuggestIdxMap[i]
                        : 0;
                    const chosenId = items[cur].getAttribute('data-char-id');
                    if (chosenId) {
                        selectAndCommitWinner(null, i, chosenId);
                        return;
                    }
                }
                saveItemRow(i);
            } else if (event.key === 'Escape' && suggestBox) {
                suggestBox.classList.add('hidden');
            }
        }

        function onLiveWinnerOrPriceInput(i, currentDistDate, manualHoldChange = false) {
            const winnerEl = document.getElementById(`stWinner_${i}`);
            const priceEl = document.getElementById(`stPrice_${i}`);
            const holdSelectEl = document.getElementById(`stHoldSelect_${i}`);
            const distBadgeEl = document.getElementById(`stLiveDistBadge_${i}`);
            const checkCellWrap = document.getElementById(`stCheckCellWrap_${i}`);
            const chkEl = document.getElementById(`stDistChk_${i}`);

            const wVal = winnerEl ? winnerEl.value.trim() : '';
            const pVal = priceEl ? Number(priceEl.value || 0) : 0;

            let newHold = '보유중';
            if (manualHoldChange && holdSelectEl) {
                newHold = holdSelectEl.value;
                if (newHold === '이벤트' && priceEl) {
                    priceEl.value = 0;
                }
            } else {
                const preferred = (holdSelectEl && holdSelectEl.value === '연합') ? '연합' : '';
                newHold = computeHoldState(wVal, pVal, preferred);
                if (holdSelectEl) {
                    holdSelectEl.value = newHold;
                }
            }

            const targetRow = getFilteredItems()[i];
            const canDist = isDistributableHoldState(newHold);
            const isCurrentlyChecked = canDist && Boolean((chkEl && chkEl.checked) || (targetRow && targetRow.dist_checked));
            const tempItem = {
                winner: wVal,
                price: newHold === '이벤트' ? 0 : pVal,
                sale_type: newHold,
                dist_date: canDist ? currentDistDate : '',
                dist_checked: isCurrentlyChecked
            };
            const distInfo = computeDistStateInfo(
                targetRow ? targetRow.record_ref : { distributions: {} },
                tempItem,
                targetRow ? targetRow.item_idx : 0
            );

            if (distBadgeEl) {
                distBadgeEl.className = `dist-state-badge state-${distInfo.state}`;
                distBadgeEl.textContent = distInfo.label;
            }
            if (checkCellWrap) {
                if (canDist) {
                    checkCellWrap.innerHTML = `
                        <input type="checkbox" id="stDistChk_${i}" class="dist-target-checkbox"
                               ${isCurrentlyChecked ? 'checked' : ''}
                               title="체크 시 분배금 관리로 넘어갑니다."
                               onchange="onDistCheckToggle(${i})">
                    `;
                } else {
                    checkCellWrap.innerHTML = `<span style="color:#52525b;">-</span>`;
                }
            }
        }

        function formatPriceWithPolicyHint(row) {
            if (row.hold_state === '이벤트') {
                return '0 (이벤트)';
            }
            const actual = Number(row.price || 0);
            const policy = Number(row.policy_price || 0);
            if (actual <= 0) return '-';

            if (policy > 0 && actual !== policy) {
                return `
                    <div>${actual.toLocaleString()}</div>
                    <div style="font-size:10px; color:#9ca3af; font-weight:600;">(정책: ${policy.toLocaleString()})</div>
                `;
            }
            return actual.toLocaleString();
        }

        function renderItemTable() {
            const filtered = getFilteredItems();
            document.getElementById('itemTotalCountBadge').textContent = `총 ${filtered.length}건`;

            const tbody = document.getElementById('itemStatusTableBody');
            const isAdmin = ClanApp.isAdminModeOn;
            const isSuperAdmin = ClanApp.isSuperAdmin;
            const colSpan = isAdmin ? 10 : 8;

            if (filtered.length === 0) {
                tbody.innerHTML = `<tr><td colspan="${colSpan}" class="empty-party-msg">조회된 아이템 내역이 없습니다.</td></tr>`;
                return;
            }

            tbody.innerHTML = filtered.map((row, i) => {
                const dateTimeHtml = formatRaidDateTimeCell(row.raid_date, row.raid_time);
                const holdBadgeHtml = `<span class="sale-badge type-${row.hold_state}">${row.hold_state}</span>`;
                const distBadgeHtml = `<span class="dist-state-badge state-${row.dist_state}">${row.dist_label}</span>`;
                const priceDisplay = formatPriceWithPolicyHint(row);

                const distDateHtml = row.dist_date
                    ? `<span class="dist-date-text">${toShortDate(row.dist_date)}</span>`
                    : '-';

                const canCheck = isDistributableHoldState(row.hold_state);

                // 일반회원 뷰: 체크 열 없음 (총 8열)
                if (!isAdmin) {
                    return `
                        <tr>
                            <td>${dateTimeHtml}</td>
                            <td style="color:#fbbf24; font-weight:800;">${ClanApp.itemNameHtml(row.name)}</td>
                            <td>${holdBadgeHtml}</td>
                            <td>${distBadgeHtml}</td>
                            <td style="color:#4ade80; font-weight:700;">${priceDisplay}</td>
                            <td style="color:#a7f3d0; font-weight:700;">${row.winner || '-'}</td>
                            <td>${row.taken_date ? toShortDate(row.taken_date) : '-'}</td>
                            <td>${distDateHtml}</td>
                        </tr>
                    `;
                }

                const isEditingRow = editingItemKeys.has(row.key);

                const checkCellHtml = canCheck
                    ? `<div id="stCheckCellWrap_${i}" class="dist-check-cell">
                           <input type="checkbox" id="stDistChk_${i}" class="dist-target-checkbox"
                                  ${row.dist_checked ? 'checked' : ''}
                                  title="체크 시 분배금 관리 템플릿으로 넘어갑니다."
                                  onchange="onDistCheckToggle(${i})">
                       </div>`
                    : `<div id="stCheckCellWrap_${i}" class="dist-check-cell"><span style="color:#52525b;">-</span></div>`;

                const superAdminDeleteBtn = isSuperAdmin
                    ? `<button type="button" class="btn-row-del-item" onclick="deleteItemRow('${row.raid_id}', ${row.item_idx}, '${row.name}')">삭제</button>`
                    : '';

                if (!isEditingRow) {
                    return `
                        <tr>
                            <td>${dateTimeHtml}</td>
                            <td style="color:#fbbf24; font-weight:800;">${ClanApp.itemNameHtml(row.name)}</td>
                            <td>${holdBadgeHtml}</td>
                            <td>${distBadgeHtml}</td>
                            <td style="color:#4ade80; font-weight:700;">${priceDisplay}</td>
                            <td style="color:#a7f3d0; font-weight:700;">${row.winner || '-'}</td>
                            <td>${row.taken_date ? toShortDate(row.taken_date) : '-'}</td>
                            <td>${checkCellHtml}</td>
                            <td>${distDateHtml}</td>
                            <td>
                                <button type="button" class="btn-row-edit" onclick="startEditItemRow('${row.key}')">수정</button>
                                ${superAdminDeleteBtn}
                            </td>
                        </tr>
                    `;
                }

                return `
                    <tr>
                        <td>${dateTimeHtml}</td>
                        <td style="color:#fbbf24; font-weight:800;">${ClanApp.itemNameHtml(row.name)}</td>
                        <td>
                            <select id="stHoldSelect_${i}" class="tbl-input tbl-hold-select"
                                    onchange="onLiveWinnerOrPriceInput(${i}, '${row.dist_date}', true)">
                                <option value="보유중" ${row.hold_state === '보유중' ? 'selected' : ''}>보유중</option>
                                <option value="내판" ${row.hold_state === '내판' ? 'selected' : ''}>내판</option>
                                <option value="연합" ${row.hold_state === '연합' ? 'selected' : ''}>연합</option>
                                <option value="외판" ${row.hold_state === '외판' ? 'selected' : ''}>외판</option>
                                <option value="이벤트" ${row.hold_state === '이벤트' ? 'selected' : ''}>이벤트</option>
                            </select>
                        </td>
                        <td>
                            <span id="stLiveDistBadge_${i}" class="dist-state-badge state-${row.dist_state}">${row.dist_label}</span>
                        </td>
                        <td>
                            <input type="number" id="stPrice_${i}" class="tbl-input tbl-price-input" value="${row.price}" min="0"
                                   oninput="onLiveWinnerOrPriceInput(${i}, '${row.dist_date}')">
                        </td>
                        <td>
                            <div class="winner-autocomplete-wrap">
                                <input type="text" id="stWinner_${i}" class="tbl-input tbl-winner-input"
                                       value="${row.winner}" placeholder="아이디 입력" autocomplete="off"
                                       oninput="onWinnerTypeSearch(${i}, '${row.dist_date}')"
                                       onkeydown="onWinnerKeydown(event, ${i}, '${row.dist_date}')">
                                <div id="stWinnerSuggest_${i}" class="winner-suggest-list hidden"></div>
                            </div>
                        </td>
                        <td>
                            <input type="date" id="stTaken_${i}" class="tbl-input tbl-date-input" value="${row.default_taken_date}">
                        </td>
                        <td>${checkCellHtml}</td>
                        <td>${distDateHtml}</td>
                        <td>
                            <button type="button" class="btn-sm btn-sm-green" style="padding: 4px 8px; font-size: 11px;" onclick="saveItemRow(${i})">저장</button>
                            ${superAdminDeleteBtn}
                        </td>
                    </tr>
                `;
            }).join('');
        }

        async function deleteItemRow(raidId, itemIdx, itemName) {
            if (!ClanApp.isSuperAdmin) {
                alert('슈퍼관리자만 아이템을 삭제할 수 있습니다.');
                return;
            }
            if (!confirm(`[${itemName}] 아이템을 완전히 삭제하시겠습니까?`)) return;

            const res = await fetch(`/api/raids/item-details/${raidId}/${itemIdx}?role=${encodeURIComponent(ClanApp.role)}`, {
                method: 'DELETE'
            });

            if (res.ok) {
                await loadItemStatusData();
            } else {
                const err = await res.json().catch(() => ({}));
                alert(err.detail || '아이템 삭제 실패');
            }
        }

        async function onDistCheckToggle(i) {
            if (!ClanApp.isAdminModeOn) return;
            const target = getFilteredItems()[i];
            if (!target) return;

            const chkEl = document.getElementById(`stDistChk_${i}`);
            const priceEl = document.getElementById(`stPrice_${i}`);
            const winnerEl = document.getElementById(`stWinner_${i}`);
            const takenEl = document.getElementById(`stTaken_${i}`);
            const holdSelectEl = document.getElementById(`stHoldSelect_${i}`);

            const rawWinner = winnerEl ? winnerEl.value.trim() : target.winner;
            const price = priceEl ? Number(priceEl.value || 0) : target.price;
            const preferredType = holdSelectEl ? holdSelectEl.value : target.hold_state;
            const holdState = computeHoldState(rawWinner, price, preferredType);
            const canCheck = isDistributableHoldState(holdState);

            if (!canCheck) {
                alert('내판 또는 외판 상태일 때만 체크할 수 있습니다. (연합·이벤트·보유중은 체크 불가)');
                if (chkEl) chkEl.checked = false;
                return;
            }

            const dist_checked = chkEl ? chkEl.checked : false;
            const dist_date = dist_checked ? (target.dist_date || '') : '';

            const updatedDetails = target.full_details_ref.map((it, idx) => {
                if (idx === target.item_idx) {
                    return {
                        name: target.name,
                        sale_type: holdState,
                        price,
                        winner: rawWinner,
                        taken_date: takenEl ? takenEl.value : (target.taken_date || ClanApp.formatYMD(new Date())),
                        dist_date,
                        dist_checked
                    };
                }
                return {
                    name: it.name,
                    sale_type: it.sale_type || '보유중',
                    price: Number(it.price || 0),
                    winner: it.winner || '',
                    taken_date: it.taken_date || '',
                    dist_date: it.dist_date || '',
                    dist_checked: Boolean(it.dist_checked)
                };
            });

            const res = await fetch('/api/raids/item-details', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    raid_id: target.raid_id,
                    item_details: updatedDetails,
                    requester_role: ClanApp.role
                })
            });

            if (res.ok) {
                editingItemKeys.delete(target.key);
                await loadItemStatusData();
            } else {
                const err = await res.json().catch(() => ({}));
                alert(err.detail || '체크 저장 실패');
            }
        }

        async function saveItemRow(i, forcedWinner = null) {
            if (!ClanApp.isAdminModeOn) return;
            const target = getFilteredItems()[i];
            if (!target) return;

            const priceInputEl = document.getElementById(`stPrice_${i}`);
            const winnerInputEl = document.getElementById(`stWinner_${i}`);
            const takenInputEl = document.getElementById(`stTaken_${i}`);
            const chkEl = document.getElementById(`stDistChk_${i}`);
            const holdSelectEl = document.getElementById(`stHoldSelect_${i}`);

            const rawWinner = forcedWinner !== null
                ? forcedWinner.trim()
                : (winnerInputEl ? winnerInputEl.value.trim() : target.winner);

            const price = priceInputEl ? Number(priceInputEl.value || 0) : target.price;
            const selectedHold = holdSelectEl ? holdSelectEl.value : target.hold_state;
            const holdState = (rawWinner && selectedHold && selectedHold !== '보유중')
                ? (price === 0 ? '이벤트' : selectedHold)
                : computeHoldState(rawWinner, price, selectedHold);

            const canCheck = isDistributableHoldState(holdState);

            const taken_date = rawWinner
                ? ((takenInputEl && takenInputEl.value) ? takenInputEl.value : (target.taken_date || ClanApp.formatYMD(new Date())))
                : '';

            const dist_checked = canCheck ? (chkEl ? chkEl.checked : Boolean(target.dist_checked)) : false;
            const dist_date = canCheck ? (target.dist_date || '') : '';

            const updatedDetails = target.full_details_ref.map((it, idx) => {
                if (idx === target.item_idx) {
                    return {
                        name: target.name,
                        sale_type: holdState,
                        price: holdState === '이벤트' ? 0 : price,
                        winner: rawWinner,
                        taken_date,
                        dist_date,
                        dist_checked
                    };
                }
                return {
                    name: it.name,
                    sale_type: it.sale_type || '보유중',
                    price: Number(it.price || 0),
                    winner: it.winner || '',
                    taken_date: it.taken_date || '',
                    dist_date: it.dist_date || '',
                    dist_checked: Boolean(it.dist_checked)
                };
            });

            const res = await fetch('/api/raids/item-details', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    raid_id: target.raid_id,
                    item_details: updatedDetails,
                    requester_role: ClanApp.role
                })
            });

            if (res.ok) {
                editingItemKeys.delete(target.key);
                await loadItemStatusData();
            } else {
                const err = await res.json().catch(() => ({}));
                alert(err.detail || '저장 실패');
            }
        }

        function exportItemExcel(kind) {
            if (!ClanApp.isAdminModeOn) return;
            const refDate = document.getElementById('filterDate').value || ClanApp.formatYMD(new Date());
            const refMonth = document.getElementById('filterMonth').value || ClanApp.formatYM(new Date());

            if (kind === 'day') {
                ClanApp.downloadExcel({ date: refDate });
            } else if (kind === 'week') {
                const { start, end } = ClanApp.getWeekRange(refDate);
                ClanApp.downloadExcel({ start, end });
            } else if (kind === 'month') {
                ClanApp.downloadExcel({ month: refMonth });
            } else {
                ClanApp.downloadExcel({});
            }
        }
    </script>
</body>
</html>
