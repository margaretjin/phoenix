<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>템 보유현황 - 혈맹 보스탐 체크기</title>
    <link rel="stylesheet" href="/static/style.css?v=7">
</head>
<body>
    <nav class="navbar" id="appNavbar"></nav>

    <main class="container">
        <div class="card">
            <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 0.9rem;">
                <h2 class="section-title" style="margin-bottom: 0;">💎 혈맹 템 보유 및 판매·분배일자 현황</h2>
                <button class="btn btn-blue" style="font-size: 0.8rem; padding: 0.4rem 0.75rem;" onclick="exportCurrentFilterExcel()">
                    📥 현재 기준 엑셀 다운로드
                </button>
            </div>

            <div style="display: flex; gap: 0.65rem; flex-wrap: wrap; align-items: flex-end; margin-bottom: 1rem;">
                <div>
                    <label>조회 기준</label>
                    <select id="viewModeSelect" onchange="onViewModeChange()" style="width: 125px;">
                        <option value="month">월별 전체</option>
                        <option value="date">특정 날짜별</option>
                    </select>
                </div>
                <div id="monthPickerBox">
                    <label>기준 월</label>
                    <input type="month" id="filterMonth" onchange="loadItemStatusData()" style="width: auto;">
                </div>
                <div id="datePickerBox" class="hidden">
                    <label>획득 날짜</label>
                    <input type="date" id="filterDate" onchange="loadItemStatusData()" style="width: auto;">
                </div>
                <div>
                    <label>판매 상태</label>
                    <select id="saleTypeFilter" onchange="renderItemTable()" style="width: 135px;">
                        <option value="all">전체 보기</option>
                        <option value="holding">보유중</option>
                        <option value="clan">혈원판매</option>
                        <option value="external">외판</option>
                    </select>
                </div>
                <div style="flex: 1; min-width: 140px;">
                    <label>아이템 / 구매자 검색</label>
                    <input type="text" id="keywordSearch" placeholder="아이템명 또는 구매자" oninput="renderItemTable()">
                </div>
            </div>

            <div class="summary-kpi-grid">
                <div class="kpi-box">
                    <div class="kpi-label">총 아이템 / 보유중</div>
                    <div class="kpi-value" id="kpiTotalItems">0건</div>
                </div>
                <div class="kpi-box">
                    <div class="kpi-label">총 판매 금액</div>
                    <div class="kpi-value" id="kpiGrossAdena">0</div>
                </div>
                <div class="kpi-box">
                    <div class="kpi-label">혈비 (<span id="kpiTaxLabel">20</span>%)</div>
                    <div class="kpi-value" style="color: #60a5fa;" id="kpiTaxAdena">0</div>
                </div>
                <div class="kpi-box">
                    <div class="kpi-label">분배 가능 총액</div>
                    <div class="kpi-value" style="color: #34d399;" id="kpiNetAdena">0</div>
                </div>
            </div>

            <div class="table-scroll">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>획득일</th>
                            <th>보스탐</th>
                            <th>아이템명</th>
                            <th>구분</th>
                            <th>판매 가격</th>
                            <th>구매자(당첨자)</th>
                            <th>수령일</th>
                            <th>분배일자</th>
                            <th id="adminEditCol" class="hidden">관리자 정산 설정</th>
                        </tr>
                    </thead>
                    <tbody id="itemStatusTableBody"></tbody>
                </table>
            </div>
        </div>
    </main>

    <script src="/static/common.js?v=7"></script>
    <script>
        let currentTaxRate = 20;
        let allMembers = [];
        let flattenedItems = [];

        window.onload = async () => {
            const user = ClanApp.initPage('/item-status', () => {
                document.getElementById('adminEditCol').classList.toggle('hidden', !ClanApp.isAdminModeOn);
                renderItemTable();
            });
            if (!user) return;

            document.getElementById('adminEditCol').classList.toggle('hidden', !ClanApp.isAdminModeOn);

            const [taxRes, memRes] = await Promise.all([
                fetch('/api/raids/tax-rate'),
                fetch('/api/auth/search-members')
            ]);
            currentTaxRate = (await taxRes.json()).tax_rate ?? 20;
            allMembers = await memRes.json();
            document.getElementById('kpiTaxLabel').textContent = currentTaxRate;

            const now = new Date();
            document.getElementById('filterMonth').value = ClanApp.formatYM(now);
            document.getElementById('filterDate').value = ClanApp.formatYMD(now);
            await loadItemStatusData();
        };

        function exportCurrentFilterExcel() {
            const mode = document.getElementById('viewModeSelect').value;
            if (mode === 'date') ClanApp.downloadExcel({ date: document.getElementById('filterDate').value });
            else ClanApp.downloadExcel({ month: document.getElementById('filterMonth').value });
        }

        function onViewModeChange() {
            const isMonth = document.getElementById('viewModeSelect').value === 'month';
            document.getElementById('monthPickerBox').classList.toggle('hidden', !isMonth);
            document.getElementById('datePickerBox').classList.toggle('hidden', isMonth);
            loadItemStatusData();
        }

        async function loadItemStatusData() {
            const mode = document.getElementById('viewModeSelect').value;
            const query = mode === 'month'
                ? `?month=${document.getElementById('filterMonth').value}`
                : `?date=${document.getElementById('filterDate').value}`;
            const res = await fetch(`/api/raids${query}`);
            const raids = await res.json();
            const memberSet = new Set(allMembers.map(m => m.active_id));

            flattenedItems = [];
            raids.forEach(r => {
                const details = ClanApp.extractItemDetails(r);
                details.forEach((item, idx) => {
                    const buyer = (item.winner || '').trim();
                    const price = Number(item.price || 0);
                    let saleType = 'holding';
                    if (buyer || price > 0) saleType = (buyer && memberSet.has(buyer)) ? 'clan' : 'external';

                    flattenedItems.push({
                        raid_id: r.id, item_idx: idx, raid_date: r.raid_date, raid_time: r.raid_time,
                        name: item.name, price, winner: buyer,
                        taken_date: item.taken_date || '', dist_date: item.dist_date || '',
                        sale_type: saleType, full_details_ref: details
                    });
                });
            });
            renderItemTable();
        }

        function getFilteredItems() {
            const typeFilter = document.getElementById('saleTypeFilter').value;
            const kw = document.getElementById('keywordSearch').value.trim().toLowerCase();
            return flattenedItems.filter(row => {
                if (typeFilter !== 'all' && row.sale_type !== typeFilter) return false;
                if (kw && !row.name.toLowerCase().includes(kw) && !row.winner.toLowerCase().includes(kw)) return false;
                return true;
            });
        }

        function renderItemTable() {
            const filtered = getFilteredItems();
            const holding = filtered.filter(x => x.sale_type === 'holding').length;
            const gross = filtered.reduce((a, c) => a + c.price, 0);
            const tax = Math.floor(gross * (currentTaxRate / 100));

            document.getElementById('kpiTotalItems').textContent = `${filtered.length}건 (보유 ${holding})`;
            document.getElementById('kpiGrossAdena').textContent = `${gross.toLocaleString()}`;
            document.getElementById('kpiTaxAdena').textContent = `${tax.toLocaleString()}`;
            document.getElementById('kpiNetAdena').textContent = `${(gross - tax).toLocaleString()}`;

            const tbody = document.getElementById('itemStatusTableBody');
            if (filtered.length === 0) {
                tbody.innerHTML = `<tr><td colspan="9" style="text-align:center; color:var(--text-muted);">내역이 없습니다.</td></tr>`;
                return;
            }

            tbody.innerHTML = filtered.map((row, i) => {
                const badge = row.sale_type === 'holding'
                    ? `<span class="status-badge badge-holding">보유중</span>`
                    : (row.sale_type === 'clan' ? `<span class="status-badge badge-clan">혈원판매</span>` : `<span class="status-badge badge-external">외판</span>`);

                const adminCol = ClanApp.isAdminModeOn ? `
                    <td>
                        <div style="display:flex; gap:0.25rem; flex-wrap:wrap; align-items:center;">
                            <input type="number" id="stPrice_${i}" value="${row.price || ''}" placeholder="가격" style="width:80px; padding:0.2rem; font-size:0.75rem;">
                            <input type="text" id="stBuyer_${i}" value="${row.winner}" placeholder="구매자" style="width:75px; padding:0.2rem; font-size:0.75rem;">
                            <input type="date" id="stTaken_${i}" value="${row.taken_date}" title="수령일" style="width:110px; padding:0.18rem; font-size:0.72rem;">
                            <input type="date" id="stDist_${i}" value="${row.dist_date}" title="분배일자" style="width:110px; padding:0.18rem; font-size:0.72rem;">
                            <button class="btn btn-green" style="padding:0.2rem 0.45rem; font-size:0.74rem;" onclick="saveRow(${i})">저장</button>
                        </div>
                    </td>` : '';

                return `<tr>
                    <td>${row.raid_date}</td>
                    <td style="color:var(--accent-gold); font-weight:700;">${row.raid_time}</td>
                    <td style="font-weight:800;">${row.name}</td>
                    <td>${badge}</td>
                    <td>${row.price > 0 ? `<b style="color:var(--accent-gold);">${row.price.toLocaleString()}</b>` : '-'}</td>
                    <td><b style="color:#a7f3d0;">${row.winner || '-'}</b></td>
                    <td>${row.taken_date || '-'}</td>
                    <td style="color:#93c5fd; font-weight:700;">${row.dist_date || '-'}</td>
                    ${adminCol}
                </tr>`;
            }).join('');
        }

        async function saveRow(i) {
            const target = getFilteredItems()[i];
            if (!target) return;
            const price = Number(document.getElementById(`stPrice_${i}`).value.trim() || 0);
            const winner = document.getElementById(`stBuyer_${i}`).value.trim();
            const taken_date = document.getElementById(`stTaken_${i}`).value || (winner ? ClanApp.formatYMD() : '');
            const dist_date = document.getElementById(`stDist_${i}`).value || '';

            const updated = [...target.full_details_ref];
            updated[target.item_idx] = { name: target.name, price, winner, taken_date, dist_date };

            const res = await fetch('/api/raids/item-details', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ raid_id: target.raid_id, item_details: updated, requester_role: ClanApp.role })
            });
            if (res.ok) {
                alert('저장되었습니다.');
                await loadItemStatusData();
            }
        }
    </script>
</body>
</html>
