<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>피닉스 - 메인</title>
    <meta property="og:title" content="피닉스" />
    <meta property="og:description" content="혈맹원 정보를 검색해보세요." />
    <meta property="og:image" content="https://phoenix-mmtl.onrender.com/static/phoenix.jpg" />
    <meta property="og:url" content="https://phoenix-mmtl.onrender.com" />
    
    <link rel="stylesheet" href="./static/style.css?v=20260718-2">
</head>
<body>
    <div class="container menu-container">
        <div class="menu-buttons">
            <a href="/" class="menu-btn home-btn active">🏠 홈</a>
            <a href="adena.html" class="menu-btn">💰 분배금</a>
            <a href="kurtz.html" class="menu-btn">커츠</a>
            <a href="fire.html" class="menu-btn">화둥</a>
            <a href="dragon.html" class="menu-btn">용계</a>
        </div>

        <div class="container">
            <h1>린델 피닉스</h1>
            
            <div id="loadingIndicator" class="loading-container">
                <div class="loading-spinner"></div>
                <span class="loading-text">데이터를 불러오는 중입니다. 잠시만 기다려주세요...</span>
            </div>

            <div class="search">
                <input id="searchInput" type="text" placeholder="아이디를 입력하세요">
                <button onclick="searchUser()">검색</button>
            </div>

            <div class="bloodline-section">
                <div id="bloodlineList" class="card-grid"></div>
            </div>
      
            <!-- 검색 결과 카드 -->
            <div id="card" class="card search-result-card" style="display: none;">
                <div class="item"><span class="label">아이디</span><span class="value" id="name"></span></div>
                <div class="item"><span class="label">직업</span><span class="value" id="job"></span></div>
                <div class="item"><span class="label">혈맹</span><span class="value" id="blood"></span></div>
                <div class="item"><span class="label">공성혈</span><span class="value" id="blood_member"></span></div>
                
                <div class="item">
                    <span class="label" id="label_total_dist_gold">💎 총 분배금 <span class="unit-small">(단위 : 아덴)</span></span>
                    <span class="value" id="total_dist_gold">0</span>
                </div>     
                <div class="item"><span class="label">📊 이번주 기여도</span><span class="value" id="contrib_rate">0.00 %</span></div>

                <!-- 오늘 보스탐 -->
                <div class="item" style="flex-direction: column; align-items: flex-start;">
                    <div style="display: flex; justify-content: space-between; width: 100%;">
                        <span class="label">⭐ 오늘 보스탐 참여점수</span>
                        <span class="value" id="today_pts">0 점</span>
                    </div>
                    <div id="timeBadgeContainer" class="time-badge-container" style="width: 100%; box-sizing: border-box; margin-top: 8px;"></div>
                </div>

                <!-- 어제 보스탐 -->
                <div class="item" style="flex-direction: column; align-items: flex-start;">
                    <div style="display: flex; justify-content: space-between; width: 100%;">
                        <span class="label">🌙 어제 보스탐 참여점수</span>
                        <span class="value" id="yesterday_pts">0 점</span>
                    </div>
                    <div id="yesterdayTimeBadgeContainer" class="time-badge-container" style="width: 100%; box-sizing: border-box; margin-top: 8px;"></div>
                </div>

                <div class="item">
                    <span class="label" id="label_d_period">📅 참여점수 및 분배금 <span class="unit-small">(단위 : 아덴)</span><br><span class="label-sub">(1주간)</span></span>
                    <span class="value" id="d_period_pts" style="text-align: right;">0 점<br>0</span>
                </div>
                <div class="item">
                    <span class="label" id="label_c_period">📅 참여점수<br><span class="label-sub">(2주간)</span></span>
                    <span class="value" id="c_period_pts" style="text-align: right;">0 점</span>
                </div>
            </div>
            
            <div id="error" class="error-message" style="display: none;"></div>

            <div id="statusArea" class="card status-area" style="display: none;">
                <div id="remainingText" class="remaining-text"></div>
                <div id="memberListBox" class="member-list-box">
                    <div id="memberListContent" class="member-grid"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        window.currentBloodlineMembers = []; 
        const input = document.getElementById("searchInput");
        const loadingIndicator = document.getElementById("loadingIndicator");
        
        // 🎯 평일 기본 보스탐 타임 목록 (20시 없음)
        const baseHours = [1, 3, 5, 6, 7, 9, 11, 12, 13, 15, 17, 18, 19, 21, 23, 24];

        const memberJobClassMap = {
            "군주": "member-job-monarch",
            "기사": "member-job-knight",
            "요정": "member-job-elf",
            "법사": "member-job-mage"
        };
        
        input.addEventListener("keydown", function(e) { 
            if (e.key === "Enter") { searchUser(); } 
        });

        function showLoading() {
            if (loadingIndicator) loadingIndicator.style.display = "flex";
        }

        function hideLoading() {
            if (loadingIndicator) loadingIndicator.style.display = "none";
        }

        async function loadBloodlineList() {
            try {
                const res = await fetch("/bloodlines");
                const data = await res.json();
                const listEl = document.getElementById("bloodlineList");
                if (!listEl) return;

                const bloodlines = Array.isArray(data.bloodlines) ? data.bloodlines : [];
                listEl.innerHTML = bloodlines.map(name => `
                    <button class="grid-card-btn" type="button" title="${name}" onclick="fetchBloodlineStatus('${name.replace(/'/g, "\\'")}')">
                        <span class="grid-card-btn-name">${name}</span>
                    </button>
                `).join('');
            } catch (e) {
                console.error("혈 목록 로드 실패", e);
            }
        }

        loadBloodlineList();

        async function searchUser() {
            const keyword = input.value.trim();
            if (keyword === "") { alert("아이디를 입력하세요."); return; }
            
            const card = document.getElementById("card");
            const error = document.getElementById("error");
            const statusArea = document.getElementById("statusArea");
            
            if (statusArea) statusArea.style.display = "none";
            if (card) card.style.display = "none";
            if (error) error.style.display = "none";
            
            showLoading();

            try {
                const res = await fetch("/search/" + encodeURIComponent(keyword));
                const data = await res.json();
                if (!res.ok) { throw new Error(data.detail || "유저를 찾을 수 없습니다."); }
                
                if (document.getElementById("name")) document.getElementById("name").innerText = data.name || "";
                if (document.getElementById("job")) document.getElementById("job").innerText = data.character_class || "";
                if (document.getElementById("blood")) document.getElementById("blood").innerText = data.bloodline || "";
                if (document.getElementById("blood_member")) document.getElementById("blood_member").innerText = data.blood_member || "";
                
                const stats = data.attendance_stats || {};
                const distGold = stats.distribution_gold || 0;

                // 💎 총 분배금 (위: 항목명 + 단위 / 아래: 기간) - 우측 아덴 글자 삭제
                if (document.getElementById("label_total_dist_gold")) {
                    const periodSub = stats.d_period_label ? `<br><span class="label-sub">(${stats.d_period_label})</span>` : "";
                    document.getElementById("label_total_dist_gold").innerHTML = `💎 총 분배금 <span class="unit-small">(단위 : 아덴)</span>${periodSub}`;
                }

                if (document.getElementById("total_dist_gold")) {
                    document.getElementById("total_dist_gold").innerHTML = (stats.total_distribution_gold || 0).toLocaleString();
                }
                if (document.getElementById("contrib_rate")) {
                    document.getElementById("contrib_rate").innerText = (stats.contribution_rate || 0).toFixed(2) + " %";
                }

                
                // 🌟 오늘 보스탐 연동
                if (document.getElementById("today_pts")) {
                    document.getElementById("today_pts").innerText = (stats.today_points || 0) + " 점";
                }
                
                const attendedHours = stats.today_hours || [];
                const isTodaySunday = (stats.is_today_sunday !== undefined) ? stats.is_today_sunday : (new Date().getDay() === 0);
                
                // 🎯 일요일이면 21시 제거하고 20시 추가 후 정렬
                let todayHoursList = [...baseHours];
                if (isTodaySunday) {
                    todayHoursList = todayHoursList.filter(h => h !== 21); // 21시 제거
                    todayHoursList.push(20);                               // 20시 추가
                    todayHoursList.sort((a, b) => a - b);
                }

                const badgeContainer = document.getElementById("timeBadgeContainer");
                if (badgeContainer) {
                    badgeContainer.innerHTML = todayHoursList.map(hour => {
                        const isAttended = attendedHours.includes(hour);
                        const isSiege = (hour === 20);
                        return `
                            <div class="time-badge-wrapper">
                                <div class="time-badge ${isAttended ? 'attended' : 'absent'}">${hour}</div>
                                ${isSiege ? '<span class="siege-label">공성</span>' : ''}
                            </div>
                        `;
                    }).join('');
                }

                // 🌟 어제 보스탐 연동
                if (document.getElementById("yesterday_pts")) {
                    document.getElementById("yesterday_pts").innerText = (stats.yesterday_points || 0) + " 점";
                }

                const yesterdayAttendedHours = stats.yesterday_hours || [];
                
                const yesterdayObj = new Date();
                yesterdayObj.setDate(yesterdayObj.getDate() - 1);
                const isYesterdaySunday = (stats.is_yesterday_sunday !== undefined) ? stats.is_yesterday_sunday : (yesterdayObj.getDay() === 0);

                // 🎯 어제가 일요일이면 21시 제거하고 20시 추가
                let yesterdayHoursList = [...baseHours];
                if (isYesterdaySunday) {
                    yesterdayHoursList = yesterdayHoursList.filter(h => h !== 21); // 21시 제거
                    yesterdayHoursList.push(20);                                   // 20시 추가
                    yesterdayHoursList.sort((a, b) => a - b);
                }

                const yesterdayBadgeContainer = document.getElementById("yesterdayTimeBadgeContainer");
                if (yesterdayBadgeContainer) {
                    yesterdayBadgeContainer.innerHTML = yesterdayHoursList.map(hour => {
                        const isAttended = yesterdayAttendedHours.includes(hour);
                        const isSiege = (hour === 20);
                        return `
                            <div class="time-badge-wrapper">
                                <div class="time-badge ${isAttended ? 'attended' : 'absent'}">${hour}</div>
                                ${isSiege ? '<span class="siege-label">공성</span>' : ''}
                            </div>
                        `;
                    }).join('');
                }

                // 📅 1주간 / 2주간 라벨 (위: 항목명 + 단위 / 아래: 기간) - 우측 아덴 글자 삭제
                if (stats.d_period_label && document.getElementById("label_d_period")) {
                    document.getElementById("label_d_period").innerHTML = `📅 참여점수 및 분배금 <span class="unit-small">(단위 : 아덴)</span><br><span class="label-sub">(${stats.d_period_label})</span>`;
                }
                if (document.getElementById("d_period_pts")) {
                    document.getElementById("d_period_pts").innerHTML = `${stats.d_period_points || 0} 점<br>${distGold.toLocaleString()}`;
                }
                
                if (stats.c_period_label && document.getElementById("label_c_period")) {
                    document.getElementById("label_c_period").innerHTML = `📅 참여점수<br><span class="label-sub">(${stats.c_period_label})</span>`;
                }
                if (document.getElementById("c_period_pts")) {
                    document.getElementById("c_period_pts").innerHTML = `${stats.c_period_points || 0} 점`;
                }
                
                if (card) card.style.display = "block"; 

            } catch (err) {
                if (card) card.style.display = "none"; 
                if (error) {
                    error.style.display = "block"; 
                    error.innerText = err.message;
                }
            } finally {
                hideLoading();
            }
        }

        async function fetchBloodlineStatus(bloodlineName) {
            if (!bloodlineName || bloodlineName === "undefined" || bloodlineName === "없음") return;
            
            const card = document.getElementById("card");
            const statusArea = document.getElementById("statusArea");
            
            if (card) card.style.display = "none";
            if (statusArea) statusArea.style.display = "none";

            showLoading();

            try {
                const res = await fetch("/members/" + encodeURIComponent(bloodlineName));
                const data = await res.json();
                
                window.currentBloodlineMembers = Array.isArray(data.members) ? data.members : [];
                const currentCount = window.currentBloodlineMembers.length;
                const remaining = data.remaining;
                
                const titleEl = document.getElementById("remainingText");
                if (titleEl) {
                    if (remaining <= 0) {
                        titleEl.innerHTML = `📢 <span class="bloodline-name">[${data.bloodline}]</span> 혈맹 총 ${currentCount}명`;
                    } else {
                        titleEl.innerHTML = `📢 <span class="bloodline-name">[${data.bloodline}]</span> 혈맹 총 ${currentCount}명 <span class="status-success">${remaining}자리가 남았습니다.</span>`;
                    }
                }
                
                const contentEl = document.getElementById("memberListContent");
                if (!contentEl) return;

                const groups = [
                    { label: "군주", members: window.currentBloodlineMembers.filter(m => (m.job || "").trim() === "군주") },
                    { label: "기사", members: window.currentBloodlineMembers.filter(m => (m.job || "").trim() === "기사") },
                    { label: "요정", members: window.currentBloodlineMembers.filter(m => (m.job || "").trim() === "요정") },
                    { label: "법사", members: window.currentBloodlineMembers.filter(m => (m.job || "").trim() === "법사") }
                ];

                contentEl.innerHTML = groups.map(group => {
                    if (!group.members.length) return "";
                    
                    const cards = group.members.map(member => {
                        const fullName = member.id || member.name || "";
                        const truncated = fullName.length > 5 ? fullName.slice(0, 5) + "..." : fullName;
                        const jobClass = memberJobClassMap[group.label] || "";
                        return `
                            <button class="grid-card-btn ${jobClass}" type="button" data-full-name="${fullName}" data-truncated-name="${truncated}">
                                <span class="grid-card-btn-name">${truncated}</span>
                            </button>
                        `;
                    }).join('');

                    return `
                        <div class="member-group">
                            <div class="member-group-label">${group.label} <span class="member-group-count">(${group.members.length}명)</span></div>
                            <div class="card-grid">${cards}</div>
                        </div>
                    `;
                }).join('');

                contentEl.querySelectorAll('.grid-card-btn').forEach(item => {
                    item.addEventListener('click', () => {
                        const expanded = item.dataset.expanded === 'true';
                        const fullName = item.dataset.fullName || '';
                        const truncated = item.dataset.truncatedName || '';
                        item.dataset.expanded = expanded ? 'false' : 'true';
                        item.querySelector('.grid-card-btn-name').textContent = expanded ? truncated : fullName;
                    });
                });
                
                if (statusArea) statusArea.style.display = "block";

            } catch (e) {
                console.error("혈맹 정보 로드 실패", e);
            } finally {
                hideLoading();
            }
        }
</script>
</body>
</html>
